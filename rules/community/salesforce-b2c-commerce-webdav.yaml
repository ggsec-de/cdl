schema_version: 1
id: "cortex.community:salesforce-b2c-commerce-webdav"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Salesforce B2C Commerce WebDAV - Detection"
  description: "Detects Salesforce B2C Commerce WebDAV by checking for specific patterns in a 404 response. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://help.salesforce.com/s/articleView?id=cc.b2c_import_export_transaction_handling_and_feed_size.htm&type=5"
  tags: ["salesforce", "tech", "detect", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "/waroot/style.css" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "/waroot/system_arrow.gif" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 404 } }
