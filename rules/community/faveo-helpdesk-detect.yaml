schema_version: 1
id: "cortex.community:faveo-helpdesk-detect"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Faveo Helpdesk - Detect"
  description: "Faveo Helpdesk, a web-based ticketing and customer support platform, was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.faveohelpdesk.com/"
    - "https://github.com/ladybirdweb/faveo-helpdesk"
  tags: ["tech", "faveo", "helpdesk", "ticketing", "support", "detect", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)<title>Faveo\\ HELPDESK</title>" } }
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)http\\-equiv=\"refresh\"" } }
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)URL=public" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
