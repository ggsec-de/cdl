schema_version: 1
id: "cortex.community:atproto-did-exposure"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Well-Known ATProto DID"
  description: "Detects AT Protocol DID reference used by Bluesky. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://atproto.com/specs/did"
  tags: ["well-known", "atproto", "bluesky", "misc", "identity", "miscellaneous", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/.well-known/atproto-did" }
  - id: "probe1"
    request: { method: "GET", path: "/well-known-atproto-did" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - all:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "atproto" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "did:plc" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - all:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "atproto" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "did:plc" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
