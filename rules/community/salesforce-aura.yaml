schema_version: 1
id: "cortex.community:salesforce-aura"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Salesforce Lightning - API Detection"
  description: "A Salesforce Lightning aura API was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.enumerated.de/index/salesforce"
    - "https://github.com/Ph33rr/cirrusgo"
  cwes: [200]
  tags: ["aura", "unauth", "salesforce", "exposure", "misconfig", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request:
      method: "POST"
      path: "/aura"
      body: "{}"
  - id: "probe1"
    request:
      method: "POST"
      path: "/s/sfsites/aura"
      body: "{}"
  - id: "probe2"
    request:
      method: "POST"
      path: "/sfsites/aura"
      body: "{}"
  - id: "probe3"
    request:
      method: "POST"
      path: "/s/aura"
      body: "{}"
  - id: "probe4"
    request:
      method: "POST"
      path: "/s/fact"
      body: "{}"
proof:
  kind: "signal.v1"
  assertions:
    any:
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "aura:invalidSession" } }
      - contains: { left: { ref: "steps.probe1.body" }, right: { value: "aura:invalidSession" } }
      - contains: { left: { ref: "steps.probe2.body" }, right: { value: "aura:invalidSession" } }
      - contains: { left: { ref: "steps.probe3.body" }, right: { value: "aura:invalidSession" } }
      - contains: { left: { ref: "steps.probe4.body" }, right: { value: "aura:invalidSession" } }
