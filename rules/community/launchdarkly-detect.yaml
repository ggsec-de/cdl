schema_version: 1
id: "cortex.community:launchdarkly-detect"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "LaunchDarkly - Detect"
  description: "Detects the presence of LaunchDarkly, a feature management and feature flag platform. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://launchdarkly.com/"
    - "https://launchdarkly.com/docs/sdk/client-side/javascript"
  tags: ["tech", "discovery", "launchdarkly", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "LDClient.initialize" } }
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "ldclient.min.js" } }
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "launchdarkly-js-client-sdk" } }
