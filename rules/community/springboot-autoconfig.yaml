schema_version: 1
id: "cortex.community:springboot-autoconfig"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Detect Springboot autoconfig Actuator"
  description: "Displays an auto-configuration report showing all auto-configuration candidates and the reason why they 'were' or 'were not' applied. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  tags: ["springboot", "exposure", "misconfig", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Low"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/autoconfig" }
  - id: "probe1"
    request: { method: "GET", path: "/actuator/autoconfig" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - all:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "positiveMatches" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "AuditAutoConfiguration#auditListener" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "EndpointAutoConfiguration#beansEndpoint" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - all:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "positiveMatches" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "AuditAutoConfiguration#auditListener" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "EndpointAutoConfiguration#beansEndpoint" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
