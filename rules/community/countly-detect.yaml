schema_version: 1
id: "cortex.community:countly-detect"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Countly - Detect"
  description: "Countly is a privacy-focused product analytics and customer engagement platform. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://countly.com/"
    - "https://github.com/Countly/countly-server"
  tags: ["countly", "analytics", "engagement", "tech", "detect", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>Countly</title>" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "window.countlyGlobal = window.countlyGlobal || {}" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "stylesheets/pre-login/main.css" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
