schema_version: 1
id: "cortex.community:ant-media-server-detect"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Ant Media Server - Detect"
  description: "Ant Media Server is a streaming server supporting WebRTC and other streaming protocols. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://github.com/ant-media/Ant-Media-Server"
  tags: ["antmedia", "tech", "detect", "streaming", "webrtc", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>Management of Ant Media Server</title>" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "assets/css/ant-media.css" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
