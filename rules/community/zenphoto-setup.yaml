schema_version: 1
id: "cortex.community:zenphoto-setup"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Zenphoto <1.5 Installer - Detect"
  description: "Zenphoto setup page before version 1.5 is susceptible to sensitive information disclosure due to misconfiguration. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  cwes: [284]
  tags: ["misconfig", "panel", "zenphoto", "setup", "installer", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Critical"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/zp-core/setup/index.php" }
  - id: "probe1"
    request: { method: "GET", path: "/zp/zp-core/setup/index.php" }
  - id: "probe2"
    request: { method: "GET", path: "/gallery/zp-core/setup/index.php" }
  - id: "probe3"
    request: { method: "GET", path: "/zenphoto/zp-core/setup/index.php" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Welcome to Zenphoto! This page will set up Zenphoto" } }
      - contains: { left: { ref: "steps.probe1.body" }, right: { value: "Welcome to Zenphoto! This page will set up Zenphoto" } }
      - contains: { left: { ref: "steps.probe2.body" }, right: { value: "Welcome to Zenphoto! This page will set up Zenphoto" } }
      - contains: { left: { ref: "steps.probe3.body" }, right: { value: "Welcome to Zenphoto! This page will set up Zenphoto" } }
