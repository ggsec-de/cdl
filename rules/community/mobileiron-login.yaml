schema_version: 1
id: "cortex.community:mobileiron-login"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "MobileIron Login Panel - Detect"
  description: "MobileIron login panel was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  cwes: [200]
  tags: ["panel", "mobileiron", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/mifs/login.jsp" }
  - id: "probe1"
    request: { method: "GET", path: "/mifs/user/login.jsp" }
  - id: "probe2"
    request: { method: "GET", path: "/mifs/c/d/android.html" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - any:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "MobileIron Admin Portal" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "MobileIron User Portal" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "MobileIron Registration" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Mobilizing enterprise applications" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "whitelabel/mobileiron/img/favicon.ico" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - any:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "MobileIron Admin Portal" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "MobileIron User Portal" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "MobileIron Registration" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "Mobilizing enterprise applications" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "whitelabel/mobileiron/img/favicon.ico" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
      - all:
          - any:
              - contains: { left: { ref: "steps.probe2.body" }, right: { value: "MobileIron Admin Portal" } }
              - contains: { left: { ref: "steps.probe2.body" }, right: { value: "MobileIron User Portal" } }
              - contains: { left: { ref: "steps.probe2.body" }, right: { value: "MobileIron Registration" } }
              - contains: { left: { ref: "steps.probe2.body" }, right: { value: "Mobilizing enterprise applications" } }
              - contains: { left: { ref: "steps.probe2.body" }, right: { value: "whitelabel/mobileiron/img/favicon.ico" } }
          - eq: { left: { ref: "steps.probe2.status" }, right: { value: 200 } }
