schema_version: 1
id: "cortex.community:gitlab-public-snippets"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "GitLab public snippets"
  description: "Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://gist.github.com/vysecurity/20311c29d879e0aba9dcffbe72a88b10"
    - "https://twitter.com/intigriti/status/1375078783338876929"
  tags: ["gitlab", "exposure", "misconfig", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/explore/snippets" }
  - id: "probe1"
    request: { method: "GET", path: "/-/snippets" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>Snippets · Explore · GitLab</title>" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
          - not:
              any:
                - contains: { left: { ref: "steps.probe0.body" }, right: { value: "No snippets found" } }
                - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Nothing here." } }
      - all:
          - contains: { left: { ref: "steps.probe1.body" }, right: { value: "<title>Snippets · Explore · GitLab</title>" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
          - not:
              any:
                - contains: { left: { ref: "steps.probe1.body" }, right: { value: "No snippets found" } }
                - contains: { left: { ref: "steps.probe1.body" }, right: { value: "Nothing here." } }
