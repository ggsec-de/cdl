schema_version: 1
id: "cortex.community:trendmicro-apexone-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Trend Micro Apex One Login Panel - Detect"
  description: "Trend Micro Apex One login panel was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  cwes: [200]
  tags: ["panel", "trendmicro", "login", "detect", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/officescan/console/html/cgi/cgiChkMasterPwd.exe" }
  - id: "probe1"
    request: { method: "GET", path: "/SMB/console/html/cgi/cgiChkMasterPwd.exe" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - all:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Trend Micro" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "TMlogonEncrypted" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - all:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "Trend Micro" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "TMlogonEncrypted" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
