schema_version: 1
id: "cortex.community:nextcloud-detect"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Nextcloud Detect"
  description: "Nextcloud is a suite of client-server software for creating and using file hosting services Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://nextcloud.com"
  tags: ["tech", "nextcloud", "storage", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
  - id: "probe1"
    request: { method: "GET", path: "/login" }
  - id: "probe2"
    request: { method: "GET", path: "/nextcloud/login" }
  - id: "probe3"
    request: { method: "GET", path: "/nextcloud/index.php/login" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - all:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "var nc_lastLogin" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "var nc_pageLoad" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - all:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "var nc_lastLogin" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "var nc_pageLoad" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
      - all:
          - all:
              - contains: { left: { ref: "steps.probe2.body" }, right: { value: "var nc_lastLogin" } }
              - contains: { left: { ref: "steps.probe2.body" }, right: { value: "var nc_pageLoad" } }
          - eq: { left: { ref: "steps.probe2.status" }, right: { value: 200 } }
      - all:
          - all:
              - contains: { left: { ref: "steps.probe3.body" }, right: { value: "var nc_lastLogin" } }
              - contains: { left: { ref: "steps.probe3.body" }, right: { value: "var nc_pageLoad" } }
          - eq: { left: { ref: "steps.probe3.status" }, right: { value: 200 } }
