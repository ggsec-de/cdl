schema_version: 1
id: "cortex.community:aptabase-detect"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Aptabase - Detect"
  description: "Aptabase is an open-source, privacy-first analytics platform for mobile, desktop, and web applications. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://aptabase.com/"
    - "https://github.com/aptabase/aptabase"
  tags: ["aptabase", "analytics", "privacy", "tech", "detect", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>Aptabase</title>" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "content=\"Open Source, Privacy-First and Simple Analytics for Mobile, Desktop and Web apps.\"" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<meta name=\"twitter:site\" content=\"@aptabase\"" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
