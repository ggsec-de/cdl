schema_version: 1
id: "cortex.community:qmail-admin-login"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "QmailAdmin Login Panel - Detect"
  description: "QmailAdmin login panel was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  cwes: [200]
  tags: ["qmail", "panel", "qmail_project", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
  - id: "probe1"
    request: { method: "GET", path: "/qmailadmin/qmailadmin.cgi" }
  - id: "probe2"
    request: { method: "GET", path: "/cgi-bin/qmailadmin/qmailadmin" }
  - id: "probe3"
    request: { method: "GET", path: "/cgi-bin/qmailadmin" }
  - id: "probe4"
    request: { method: "GET", path: "/cgi-ssl/qmailadmin/qmailadmin" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "QmailAdmin" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - contains: { left: { ref: "steps.probe1.body" }, right: { value: "QmailAdmin" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
      - all:
          - contains: { left: { ref: "steps.probe2.body" }, right: { value: "QmailAdmin" } }
          - eq: { left: { ref: "steps.probe2.status" }, right: { value: 200 } }
      - all:
          - contains: { left: { ref: "steps.probe3.body" }, right: { value: "QmailAdmin" } }
          - eq: { left: { ref: "steps.probe3.status" }, right: { value: 200 } }
      - all:
          - contains: { left: { ref: "steps.probe4.body" }, right: { value: "QmailAdmin" } }
          - eq: { left: { ref: "steps.probe4.status" }, right: { value: 200 } }
