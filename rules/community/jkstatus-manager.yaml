schema_version: 1
id: "cortex.community:jkstatus-manager"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "JK Status Manager - Detect"
  description: "Exposed JKStatus manager which is a web-based tool that allows administrators to monitor and manage the connections between the Apache HTTP Server and the Tomcat application server. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://github.com/PortSwigger/j2ee-scan/blob/master/src/main/java/burp/j2ee/issues/impl/JKStatus.java"
  tags: ["config", "jk", "status", "exposure", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Low"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request:
      method: "GET"
      path: "/"
      headers: { "X-Forwarded-For": "127.0.0.1" }
  - id: "probe1"
    request:
      method: "GET"
      path: "/status"
      headers: { "X-Forwarded-For": "127.0.0.1" }
  - id: "probe2"
    request:
      method: "GET"
      path: "/jkstatus"
      headers: { "X-Forwarded-For": "127.0.0.1" }
  - id: "probe3"
    request:
      method: "GET"
      path: "/jkstatus-auth"
      headers: { "X-Forwarded-For": "127.0.0.1" }
  - id: "probe4"
    request:
      method: "GET"
      path: "/jk-status"
      headers: { "X-Forwarded-For": "127.0.0.1" }
  - id: "probe5"
    request:
      method: "GET"
      path: "/jkmanager"
      headers: { "X-Forwarded-For": "127.0.0.1" }
  - id: "probe6"
    request:
      method: "GET"
      path: "/jkmanager-auth"
      headers: { "X-Forwarded-For": "127.0.0.1" }
  - id: "probe7"
    request:
      method: "GET"
      path: "/jdkstatus"
      headers: { "X-Forwarded-For": "127.0.0.1" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "JK Status Manager" } }
      - contains: { left: { ref: "steps.probe1.body" }, right: { value: "JK Status Manager" } }
      - contains: { left: { ref: "steps.probe2.body" }, right: { value: "JK Status Manager" } }
      - contains: { left: { ref: "steps.probe3.body" }, right: { value: "JK Status Manager" } }
      - contains: { left: { ref: "steps.probe4.body" }, right: { value: "JK Status Manager" } }
      - contains: { left: { ref: "steps.probe5.body" }, right: { value: "JK Status Manager" } }
      - contains: { left: { ref: "steps.probe6.body" }, right: { value: "JK Status Manager" } }
      - contains: { left: { ref: "steps.probe7.body" }, right: { value: "JK Status Manager" } }
