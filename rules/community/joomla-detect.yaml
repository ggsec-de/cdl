schema_version: 1
id: "cortex.community:joomla-detect"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Joomla! Detect"
  description: "Joomla! is a free and open-source content management system (CMS) for publishing content on websites. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.joomla.org/"
    - "https://github.com/joomla/joomla-cms"
    - "https://www.itoctopus.com/how-to-quickly-know-the-version-of-any-joomla-website"
    - "https://hackertarget.com/attacking-enumerating-joomla/"
  tags: ["tech", "joomla", "cms", "oss", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/administrator/manifests/files/joomla.xml" }
  - id: "probe1"
    request: { method: "GET", path: "/language/en-GB/en-GB.xml" }
  - id: "probe2"
    request: { method: "GET", path: "/README.txt" }
  - id: "probe3"
    request: { method: "GET", path: "/modules/custom.xml" }
  - id: "probe4"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - any:
          - all:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<version>" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<creationDate>" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "</metafile>" } }
          - any:
              - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?:<div[^>]+id=\"wrapper_r\"|<(?:link|script)[^>]+(?:feed|components)/com_|<table[^>]+class=\"pill)" } }
              - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)<meta\\s+name=[\"']generator[\"']\\s+content=[\"']\\s*joomla[^\"']*" } }
              - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)Joomla_([\\d.|\\d]+)_version_history" } }
              - regex: { left: { ref: "steps.probe0.body" }, right: { value: "FILES_JOOMLA_XML_DESCRIPTION" } }
      - any:
          - all:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "<version>" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "<creationDate>" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "</metafile>" } }
          - any:
              - regex: { left: { ref: "steps.probe1.body" }, right: { value: "(?:<div[^>]+id=\"wrapper_r\"|<(?:link|script)[^>]+(?:feed|components)/com_|<table[^>]+class=\"pill)" } }
              - regex: { left: { ref: "steps.probe1.body" }, right: { value: "(?i)<meta\\s+name=[\"']generator[\"']\\s+content=[\"']\\s*joomla[^\"']*" } }
              - regex: { left: { ref: "steps.probe1.body" }, right: { value: "(?i)Joomla_([\\d.|\\d]+)_version_history" } }
              - regex: { left: { ref: "steps.probe1.body" }, right: { value: "FILES_JOOMLA_XML_DESCRIPTION" } }
      - any:
          - all:
              - contains: { left: { ref: "steps.probe2.body" }, right: { value: "<version>" } }
              - contains: { left: { ref: "steps.probe2.body" }, right: { value: "<creationDate>" } }
              - contains: { left: { ref: "steps.probe2.body" }, right: { value: "</metafile>" } }
          - any:
              - regex: { left: { ref: "steps.probe2.body" }, right: { value: "(?:<div[^>]+id=\"wrapper_r\"|<(?:link|script)[^>]+(?:feed|components)/com_|<table[^>]+class=\"pill)" } }
              - regex: { left: { ref: "steps.probe2.body" }, right: { value: "(?i)<meta\\s+name=[\"']generator[\"']\\s+content=[\"']\\s*joomla[^\"']*" } }
              - regex: { left: { ref: "steps.probe2.body" }, right: { value: "(?i)Joomla_([\\d.|\\d]+)_version_history" } }
              - regex: { left: { ref: "steps.probe2.body" }, right: { value: "FILES_JOOMLA_XML_DESCRIPTION" } }
      - any:
          - all:
              - contains: { left: { ref: "steps.probe3.body" }, right: { value: "<version>" } }
              - contains: { left: { ref: "steps.probe3.body" }, right: { value: "<creationDate>" } }
              - contains: { left: { ref: "steps.probe3.body" }, right: { value: "</metafile>" } }
          - any:
              - regex: { left: { ref: "steps.probe3.body" }, right: { value: "(?:<div[^>]+id=\"wrapper_r\"|<(?:link|script)[^>]+(?:feed|components)/com_|<table[^>]+class=\"pill)" } }
              - regex: { left: { ref: "steps.probe3.body" }, right: { value: "(?i)<meta\\s+name=[\"']generator[\"']\\s+content=[\"']\\s*joomla[^\"']*" } }
              - regex: { left: { ref: "steps.probe3.body" }, right: { value: "(?i)Joomla_([\\d.|\\d]+)_version_history" } }
              - regex: { left: { ref: "steps.probe3.body" }, right: { value: "FILES_JOOMLA_XML_DESCRIPTION" } }
      - any:
          - all:
              - contains: { left: { ref: "steps.probe4.body" }, right: { value: "<version>" } }
              - contains: { left: { ref: "steps.probe4.body" }, right: { value: "<creationDate>" } }
              - contains: { left: { ref: "steps.probe4.body" }, right: { value: "</metafile>" } }
          - any:
              - regex: { left: { ref: "steps.probe4.body" }, right: { value: "(?:<div[^>]+id=\"wrapper_r\"|<(?:link|script)[^>]+(?:feed|components)/com_|<table[^>]+class=\"pill)" } }
              - regex: { left: { ref: "steps.probe4.body" }, right: { value: "(?i)<meta\\s+name=[\"']generator[\"']\\s+content=[\"']\\s*joomla[^\"']*" } }
              - regex: { left: { ref: "steps.probe4.body" }, right: { value: "(?i)Joomla_([\\d.|\\d]+)_version_history" } }
              - regex: { left: { ref: "steps.probe4.body" }, right: { value: "FILES_JOOMLA_XML_DESCRIPTION" } }
