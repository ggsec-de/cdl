schema_version: 1
id: "cortex.community:sonarqube-public-projects"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Sonarqube with public projects"
  description: "Sonarqube public projects detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://next.sonarqube.com/sonarqube/web_api/api/components/suggestions?internal=true"
  tags: ["sonarqube", "misconfig", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Low"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/api/components/suggestions?recentlyBrowsed=" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "\"results\":" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "\"items\":" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "\"more\":" } }
