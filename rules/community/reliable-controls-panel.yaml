schema_version: 1
id: "cortex.community:reliable-controls-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Reliable Controls MACH-Pro - Login Panel"
  description: "Reliable Controls MACH-ProWebSys is a web-based building controller for HVAC, lighting, and energy management using BACnet/IP. These controllers are widely deployed in commercial buildings across North America and are often directly internet-facing with no VPN protection. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://reliablecontrols.com/products/mach-prowebsys/"
  tags: ["panel", "ics", "bms", "bacnet", "building-automation", "reliable-controls", "mach-pro", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - any:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Reliable Controls" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Reliable Controls Embedded Web Server" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "mpw-sw" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
