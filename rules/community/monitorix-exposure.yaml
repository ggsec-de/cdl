schema_version: 1
id: "cortex.community:monitorix-exposure"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Monitorix Panel - Detect"
  description: "Monitorix panel was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.monitorix.org/"
  cwes: [200]
  tags: ["monitorix", "exposure", "logs", "panel", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/monitorix-cgi/monitorix.cgi?mode=localhost&graph=all&when=1day" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<!-- graph table begins -->" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Global kernel usage</b>" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Kernel usage per processor</b>" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<!-- graph table ends -->" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "1day.png'" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
