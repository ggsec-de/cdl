schema_version: 1
id: "cortex.community:ruijie-information-disclosure"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Ruijie Login Panel - Detect"
  description: "Ruijie login panel was detected and leaks authentication credentials. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.ruijienetworks.com/"
    - "https://www.cnblogs.com/cHr1s/p/14499858.html"
  cwes: [200]
  tags: ["ruijie", "config", "exposure", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "High"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/login.php" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - regex: { left: { ref: "steps.probe0.body" }, right: { value: "\"role\":\"super_admin\",\"name\":\"(.*)\",\"password\":\"(.*)\"" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
