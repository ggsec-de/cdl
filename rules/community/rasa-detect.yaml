schema_version: 1
id: "cortex.community:rasa-detect"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Rasa Open Source - Detect"
  description: "Rasa Open Source, an open-source conversational AI framework used to build chatbots and voice assistants that exposes a REST server (default port 5005) for intent parsing and webhook-driven conversations, was detected. Exposed unauthenticated instances may have allowed interaction with the assistant's conversation endpoints and disclosed internal version and configuration information. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://github.com/RasaHQ/rasa"
    - "https://rasa.com/docs/rasa/"
  tags: ["tech", "rasa", "ai", "chatbot", "detect", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/version" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "\"minimum_compatible_version\"" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
