schema_version: 1
id: "cortex.community:checkpoint-mobile-detect"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Check Point Mobile SSL VPN - Detect"
  description: "Check Point Mobile SSL VPN was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.checkpoint.com/quantum/remote-access-vpn/"
  tags: ["panel", "checkpoint", "detect", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/sslvpn/Login" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)Check\\ Point\\ Mobile" } }
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)Check\\ Point\\ Software\\ Technologies" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 403 } }
