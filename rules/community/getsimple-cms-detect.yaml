schema_version: 1
id: "cortex.community:getsimple-cms-detect"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "GetSimple CMS Detection"
  description: "Template to detect a running GetSimple CMS instance Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  tags: ["tech", "getsimple", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
  - id: "probe1"
    request: { method: "GET", path: "/readme.txt" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
          - any:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Powered by  GetSimple" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "GetSimple CMS is a flatfile CMS" } }
      - all:
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
          - any:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "Powered by  GetSimple" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "GetSimple CMS is a flatfile CMS" } }
