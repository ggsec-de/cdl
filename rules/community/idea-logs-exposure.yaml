schema_version: 1
id: "cortex.community:idea-logs-exposure"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Public .idea Folder containing http logs"
  description: "Searches for .idea Folder for http-requests-log.http and http-client.cookies file Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  tags: ["phpstorm", "jetbrains", "idea", "exposure", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/.idea/httpRequests/http-requests-log.http" }
  - id: "probe1"
    request: { method: "GET", path: "/.idea/httpRequests/http-client.cookies" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - any:
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?m)^(GET|POST) https?:\\/\\/" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "# domain\tpath\tname\tvalue\tdate" } }
      - any:
          - regex: { left: { ref: "steps.probe1.body" }, right: { value: "(?m)^(GET|POST) https?:\\/\\/" } }
          - contains: { left: { ref: "steps.probe1.body" }, right: { value: "# domain\tpath\tname\tvalue\tdate" } }
