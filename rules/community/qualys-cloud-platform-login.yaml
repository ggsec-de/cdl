schema_version: 1
id: "cortex.community:qualys-cloud-platform-login"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Qualys Cloud Platform Login Panel - Detect"
  description: "Qualys Cloud Platform login panel was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.qualys.com/cloud-platform/"
  cwes: [200]
  tags: ["panel", "qualys", "cloud", "login", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
  - id: "probe1"
    request: { method: "GET", path: "/fo/login.php" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - any:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>Qualys - Login</title>" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>Qualys&reg;</title>" } }
          - any:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "top.location='fo/user_login.php'" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "/fo/user_login.php" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "id=\"myform_UserLogin\"" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "/images/qualys/product.png" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - any:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "<title>Qualys - Login</title>" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "<title>Qualys&reg;</title>" } }
          - any:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "top.location='fo/user_login.php'" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "/fo/user_login.php" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "id=\"myform_UserLogin\"" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "/images/qualys/product.png" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
