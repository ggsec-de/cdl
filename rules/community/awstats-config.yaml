schema_version: 1
id: "cortex.community:awstats-config"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "AWStats Config - Detect"
  description: "AWStats configuration information was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.awstats.org/"
  cwes: [200]
  tags: ["config", "exposure", "awstats", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/awstats/" }
  - id: "probe1"
    request: { method: "GET", path: "/awstats.conf" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - any:
          - all:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "AWSTATS CONFIGURE" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "MAIN SETUP SECTION" } }
          - all:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Index of /awstats" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Parent Directory" } }
      - any:
          - all:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "AWSTATS CONFIGURE" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "MAIN SETUP SECTION" } }
          - all:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "Index of /awstats" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "Parent Directory" } }
