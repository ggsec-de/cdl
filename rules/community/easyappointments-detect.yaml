schema_version: 1
id: "cortex.community:easyappointments-detect"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Easy!Appointments - Detect"
  description: "Easy!Appointments is an open-source appointment scheduling application. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://easyappointments.org/"
    - "https://github.com/alextselegidis/easyappointments"
  tags: ["tech", "easyappointments", "appointment", "scheduling", "detect", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)<title>[^<]+\\| Easy!Appointments</title>" } }
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "id=\"book-appointment-wizard\"" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "/assets/css/layouts/booking_layout" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
