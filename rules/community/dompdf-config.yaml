schema_version: 1
id: "cortex.community:dompdf-config"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "DomPDF - Configuration Page"
  description: "DOMPDF Configuration page was detected, which contains paths, library versions and other potentially sensitive information Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  cwes: [200]
  tags: ["config", "exposure", "dompdf", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Low"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/www/setup.php" }
  - id: "probe1"
    request: { method: "GET", path: "/dompdf/dompdf/www/setup.php" }
  - id: "probe2"
    request: { method: "GET", path: "/js/dompdf/www/setup.php" }
  - id: "probe3"
    request: { method: "GET", path: "/portal/application/libraries/dompdf/www/setup.php" }
  - id: "probe4"
    request: { method: "GET", path: "/sites/all/libraries/dompdf/www/setup.php" }
  - id: "probe5"
    request: { method: "GET", path: "/vendor/dompdf/dompdf/www/setup.php" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - all:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "HTML to PDF Converter</title>" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<td class=\"title\">DOMPDF_PDF_BACKEND</td>" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - all:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "HTML to PDF Converter</title>" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "<td class=\"title\">DOMPDF_PDF_BACKEND</td>" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
      - all:
          - all:
              - contains: { left: { ref: "steps.probe2.body" }, right: { value: "HTML to PDF Converter</title>" } }
              - contains: { left: { ref: "steps.probe2.body" }, right: { value: "<td class=\"title\">DOMPDF_PDF_BACKEND</td>" } }
          - eq: { left: { ref: "steps.probe2.status" }, right: { value: 200 } }
      - all:
          - all:
              - contains: { left: { ref: "steps.probe3.body" }, right: { value: "HTML to PDF Converter</title>" } }
              - contains: { left: { ref: "steps.probe3.body" }, right: { value: "<td class=\"title\">DOMPDF_PDF_BACKEND</td>" } }
          - eq: { left: { ref: "steps.probe3.status" }, right: { value: 200 } }
      - all:
          - all:
              - contains: { left: { ref: "steps.probe4.body" }, right: { value: "HTML to PDF Converter</title>" } }
              - contains: { left: { ref: "steps.probe4.body" }, right: { value: "<td class=\"title\">DOMPDF_PDF_BACKEND</td>" } }
          - eq: { left: { ref: "steps.probe4.status" }, right: { value: 200 } }
      - all:
          - all:
              - contains: { left: { ref: "steps.probe5.body" }, right: { value: "HTML to PDF Converter</title>" } }
              - contains: { left: { ref: "steps.probe5.body" }, right: { value: "<td class=\"title\">DOMPDF_PDF_BACKEND</td>" } }
          - eq: { left: { ref: "steps.probe5.status" }, right: { value: 200 } }
