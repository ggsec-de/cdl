schema_version: 1
id: "cortex.community:krpano-detect"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Krpano Panorama Viewer - Detection"
  description: "Detected Krpano Panorama Viewer by identifying known Krpano-specific resources and response patterns. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://krpano.com/"
  tags: ["tech", "krpano", "viewer", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
  - id: "probe1"
    request: { method: "GET", path: "/krpano.html" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "embedpano({" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "passQueryParameters:true" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "swf" } }
      - all:
          - contains: { left: { ref: "steps.probe1.body" }, right: { value: "embedpano({" } }
          - contains: { left: { ref: "steps.probe1.body" }, right: { value: "passQueryParameters:true" } }
          - contains: { left: { ref: "steps.probe1.body" }, right: { value: "swf" } }
