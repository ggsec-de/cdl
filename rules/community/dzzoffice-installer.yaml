schema_version: 1
id: "cortex.community:dzzoffice-installer"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "DzzOffice - Installer Page Exposure"
  description: "Detects exposed DzzOffice Installation page. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  cwes: [200]
  tags: ["misconfig", "install", "exposure", "dzzoffice", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "High"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/install/index.php" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "DzzOffice" } }
      - any:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "简体中文 UTF8 版" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Simplified Chinese UTF8 version" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
