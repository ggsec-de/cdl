schema_version: 1
id: "cortex.community:determined-ai-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Determined AI Panel - Detect"
  description: "Determined AI, an open-source deep learning training platform that provides distributed training, hyperparameter tuning, and experiment tracking through a web-based UI and a REST/gRPC-gateway API served by the \"master\" component, was detected by matching the application title and meta description served at the application root. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://github.com/determined-ai/determined"
    - "https://docs.determined.ai"
  tags: ["panel", "determined-ai", "ml", "ai", "mlops", "detect", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Determined Deep Learning Training Platform" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>Determined</title>" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
