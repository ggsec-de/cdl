schema_version: 1
id: "cortex.community:klr300n-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "KLR 300N Router Panel - Detect"
  description: "Home router wireless KLR 300N login panel were Detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "http://www.keo.com.br/produtos/roteador-klr-300n"
    - "http://www.keo.com.br/wp-content/uploads/2017/09/Manual_KLR_300N_03-17_site.pdf"
  tags: ["keo", "klr300n", "panel", "login", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/login.asp" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>Roteador Wireless KLR 300N</title>" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "login" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
