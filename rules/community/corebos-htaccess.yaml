schema_version: 1
id: "cortex.community:corebos-htaccess"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "CoreBos - .htaccess File Exposure"
  description: "CoreBos was discovered to have .htaccess file exposed to public which includes sensitive information. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://huntr.dev/bounties/5b0fe6e3-4ca1-44ae-8875-d7e6c065432e/"
  tags: ["exposure", "corebos", "huntr", "misconfig", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/htaccess.txt" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Options -Indexes" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<FilesMatch" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
