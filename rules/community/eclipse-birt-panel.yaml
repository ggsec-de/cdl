schema_version: 1
id: "cortex.community:eclipse-birt-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Eclipse BIRT Panel - Detect"
  description: "Eclipse BIRT (Business Intelligence Reporting Tool) detected Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://eclipse.github.io/birt-website/"
  cwes: [200]
  tags: ["panel", "eclipsebirt", "detect", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
  - id: "probe1"
    request: { method: "GET", path: "/reportviewer/" }
  - id: "probe2"
    request: { method: "GET", path: "/birt/" }
  - id: "probe3"
    request: { method: "GET", path: "/birt-viewer/" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - any:
              - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)alt=\"Eclipse\\ Logo" } }
              - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)Eclipse\\ BIRT\\ Home" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - any:
              - regex: { left: { ref: "steps.probe1.body" }, right: { value: "(?i)alt=\"Eclipse\\ Logo" } }
              - regex: { left: { ref: "steps.probe1.body" }, right: { value: "(?i)Eclipse\\ BIRT\\ Home" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
      - all:
          - any:
              - regex: { left: { ref: "steps.probe2.body" }, right: { value: "(?i)alt=\"Eclipse\\ Logo" } }
              - regex: { left: { ref: "steps.probe2.body" }, right: { value: "(?i)Eclipse\\ BIRT\\ Home" } }
          - eq: { left: { ref: "steps.probe2.status" }, right: { value: 200 } }
      - all:
          - any:
              - regex: { left: { ref: "steps.probe3.body" }, right: { value: "(?i)alt=\"Eclipse\\ Logo" } }
              - regex: { left: { ref: "steps.probe3.body" }, right: { value: "(?i)Eclipse\\ BIRT\\ Home" } }
          - eq: { left: { ref: "steps.probe3.status" }, right: { value: 200 } }
