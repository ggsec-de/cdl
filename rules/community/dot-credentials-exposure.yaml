schema_version: 1
id: "cortex.community:dot-credentials-exposure"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Dot Credentials - Exposure"
  description: "Detected the presence of a .credentials file and extracts sensitive authentication tokens, passwords, or API keys. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  tags: ["exposure", "config", "credentials", "sensitive", "token", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "High"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/.credentials" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - any:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "client_id" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "client_secret" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "access_token" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "refresh_token" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "password" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "aws_access_key_id" } }
      - not:
          any:
            - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<html" } }
            - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<body" } }
            - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<!DOCTYPE" } }
            - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<script" } }
            - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<?php" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
