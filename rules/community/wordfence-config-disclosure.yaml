schema_version: 1
id: "cortex.community:wordfence-config-disclosure"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "WordPress Wordfence - Configuration File Disclosure"
  description: "The Wordfence Security plugin for WordPress stores configuration files in the /wp-content/wflogs/ directory. These files may be accessible without authentication and can expose sensitive configuration data, firewall rules, attack logs, and internal paths. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://wordpress.org/support/topic/files-created-in-wflogs-before-plugin-activated/"
    - "https://forum.ait-pro.com/forums/topic/wordfence-firewall-wp-contentwflogsconfig-php-file-quarantined/"
  cwes: [200]
  tags: ["wordpress", "wp", "wp-plugin", "wordfence", "config", "exposure", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Medium"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
  - id: "probe1"
    request: { method: "GET", path: "/wp-content/wflogs/config.php" }
  - id: "probe2"
    request: { method: "GET", path: "/wp-content/wflogs/config-synced.php" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "plugins/wordfence" } }
      - any:
          - all:
              - all:
                  - contains: { left: { ref: "steps.probe1.body" }, right: { value: "authKey\"" } }
                  - contains: { left: { ref: "steps.probe1.body" }, right: { value: "{s" } }
              - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
          - all:
              - all:
                  - contains: { left: { ref: "steps.probe2.body" }, right: { value: "authKey\"" } }
                  - contains: { left: { ref: "steps.probe2.body" }, right: { value: "{s" } }
              - eq: { left: { ref: "steps.probe2.status" }, right: { value: 200 } }
