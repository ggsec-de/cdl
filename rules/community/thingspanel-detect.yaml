schema_version: 1
id: "cortex.community:thingspanel-detect"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "ThingsPanel - Detect"
  description: "ThingsPanel is an open-source IoT platform for device management, data collection, and visualisation. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://thingspanel.io/"
    - "https://github.com/ThingsPanel/thingspanel-go"
  tags: ["thingspanel", "tech", "iot", "device-management", "detect", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>ThingsPanel</title>" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "clarity', 'script', 'no47mbcicr'" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
