schema_version: 1
id: "cortex.community:directus-api-exposure"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Directus Server Info - Unauthenticated Fingerprint"
  description: "Directus /server/info endpoint is exposed without authentication, leaking project metadata and license configuration. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://directus.io/docs/api/server"
  tags: ["exposure", "directus", "fingerprint", "unauth", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/server/info" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "\"display_powered_by\"" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "\"DIRECTUS\"" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "\"entitlements\"" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
