schema_version: 1
id: "cortex.community:wpmudev-pub-keys"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Wpmudev Dashboard Pub Key"
  description: "Wpmudev Wordpress Plugin public key leaked. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.exploit-db.com/ghdb/6443"
  tags: ["wordpress", "edb", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Medium"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/wp-content/plugins/wpmudev-updates/keys/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Index of /" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: ".pub" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "wpmudev" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
