schema_version: 1
id: "cortex.community:apache-syncope-detect"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Apache Syncope - Detect"
  description: "Detected an Apache Syncope server, an enterprise digital identity management platform built with Java EE and licensed under Apache 2.0. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://github.com/apache/syncope"
  tags: ["tech", "apache", "syncope", "detect", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/syncope-enduser/" }
  - id: "probe1"
    request: { method: "GET", path: "/syncope-wa/" }
  - id: "probe2"
    request: { method: "GET", path: "/syncope-console/" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - any:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>Apache Syncope" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "org.apache.syncope" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - any:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "<title>Apache Syncope" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "org.apache.syncope" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
      - all:
          - any:
              - contains: { left: { ref: "steps.probe2.body" }, right: { value: "<title>Apache Syncope" } }
              - contains: { left: { ref: "steps.probe2.body" }, right: { value: "org.apache.syncope" } }
          - eq: { left: { ref: "steps.probe2.status" }, right: { value: 200 } }
