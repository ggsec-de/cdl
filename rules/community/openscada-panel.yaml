schema_version: 1
id: "cortex.community:openscada-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "OpenSCADA - Panel"
  description: "OpenSCADA is an open-source SCADA (Supervisory Control and Data Acquisition) system. Exposed instances may provide access to industrial control interfaces and operational technology (OT) data without authentication. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://oscada.org"
    - "https://sourceforge.net/projects/oscada/"
  tags: ["panel", "ics", "scada", "openscada", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - any:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>OpenSCADA" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "OpenSCADA" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "WorkStation" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
