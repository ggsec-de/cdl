schema_version: 1
id: "cortex.community:wp-woocommerce-pdf-invoice-listing"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Woocommerce - PDF Invoice Exposure"
  description: "A vulnerability in Woocommerce allows remote unauthenticated attackers to access company invoices and other sensitive information. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://twitter.com/sec_hawk/status/1426984595094913025?s=21"
    - "https://github.com/Mohammedsaneem/wordpress-upload-information-disclosure/blob/main/worpress-upload.yaml"
    - "https://woocommerce.com/products/pdf-invoices/"
  cwes: [200]
  tags: ["wordpress", "listing", "exposure", "woocommerce", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Medium"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/wp-content/uploads/pdf-invoices/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Index of /wp-content/uploads/pdf-invoices" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Parent Directory" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: ".pdf" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
