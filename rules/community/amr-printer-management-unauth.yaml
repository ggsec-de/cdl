schema_version: 1
id: "cortex.community:amr-printer-management-unauth"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "AMR Printer Management Dashboard - Exposure"
  description: "Unauthorized access to the AMR Printer Management dashboard was possible, potentially exposing sensitive printer configuration and management interfaces without proper authentication. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  tags: ["network", "iot", "printer", "misconfig", "unauth", "intrusive", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Medium"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
  - id: "probe1"
    request: { method: "GET", path: "/amr" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - all:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "AMR Printer Management" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<span>Basic Setup" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<span>Log" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - all:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "AMR Printer Management" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "<span>Basic Setup" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "<span>Log" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
