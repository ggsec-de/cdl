schema_version: 1
id: "cortex.community:apache-server-status-localhost"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Server Status Disclosure"
  description: "Apache Server Status page is exposed, which may contain information about pages visited by the users, their IPs or sensitive information such as session tokens. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  tags: ["apache", "debug", "misconfig", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Low"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/server-status" }
  - id: "probe1"
    request:
      method: "GET"
      path: "/server-status"
      headers: { "Forwarded": "127.0.0.1", "X-Client-IP": "127.0.0.1", "X-Forwarded-By": "127.0.0.1", "X-Forwarded-For": "127.0.0.1", "X-Forwarded-For-IP": "127.0.0.1", "X-Forwarded-Host": "127.0.0.1", "X-Host": "127.0.0.1", "X-Originating-IP": "127.0.0.1", "X-Remote-Addr": "127.0.0.1", "X-Remote-IP": "127.0.0.1", "X-True-IP": "127.0.0.1" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - any:
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 403 } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 404 } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 401 } }
      - all:
          - contains: { left: { ref: "steps.probe1.body" }, right: { value: "Apache Server Status" } }
          - contains: { left: { ref: "steps.probe1.body" }, right: { value: "Server Version" } }
