schema_version: 1
id: "cortex.community:onlyoffice-login-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "ONLYOFFICE Login Panel - Detect"
  description: "ONLYOFFICE Community Server is a free open-source collaborative system developed to manage documents, projects, customer relationship and email correspondence. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  tags: ["panel", "onlyoffice", "detect", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
  - id: "probe1"
    request: { method: "GET", path: "/auth.aspx" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - any:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "ONLYOFFICE" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "title=\"ONLYOFFICE" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "content=\"ONLYOFFICE" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "/images/onlyoffice_logo/" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "alt=\"ONLYOFFICE" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - any:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "ONLYOFFICE" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "title=\"ONLYOFFICE" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "content=\"ONLYOFFICE" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "/images/onlyoffice_logo/" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "alt=\"ONLYOFFICE" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
