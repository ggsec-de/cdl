schema_version: 1
id: "cortex.community:apache-storm-unauth"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Apache Storm Unauth"
  description: "Apache Storm instance is exposed. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://storm.apache.org/releases/current/STORM-UI-REST-API.html"
  tags: ["apache", "unauth", "misconfig", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Medium"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/api/v1/cluster/summary" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "\"totalMem\":" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "\"stormVersion\":" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
