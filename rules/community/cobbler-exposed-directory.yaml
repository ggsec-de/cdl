schema_version: 1
id: "cortex.community:cobbler-exposed-directory"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Exposed Cobbler Directories"
  description: "Searches for exposed Cobbler Directories Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  tags: ["cobbler", "exposure", "misconfig", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Medium"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/cobbler/" }
  - id: "probe1"
    request: { method: "GET", path: "/cblr/" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
          - any:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Index of /cobbler" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Index of /cblr" } }
      - all:
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
          - any:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "Index of /cobbler" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "Index of /cblr" } }
