schema_version: 1
id: "cortex.community:supershell-c2"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Supershell C2 - Detect"
  description: "Supershell is a C2 remote control platform accessed through WEB services. By establishing a reverse SSH tunnel, a fully interactive shell can be obtained, and it supports multi-platform architecture Payload. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://twitter.com/S4nsLimit3/status/1693619836339859497"
    - "https://github.com/tdragon6/Supershell/blob/main/README_EN.md"
  tags: ["c2", "ir", "osint", "supershell", "panel", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>Supershell - 登录</title>" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
