schema_version: 1
id: "cortex.community:wazuh-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Wazuh Login Panel"
  description: "Wazuh - The Open Source Security Platform Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://github.com/wazuh/wazuh"
  tags: ["panel", "wazuh", "login", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/app/login" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - any:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "&quot;id&quot;:&quot;wazuh&quot;" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "&quot;title&quot;:&quot;Wazuh&quot;" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "&quot;icon&quot;:&quot;plugins/wazuh/img/icon_blue.png&quot;" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "&quot;url&quot;:&quot;/app/wazuh&quot;" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
