schema_version: 1
id: "cortex.community:parameters-config"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Parameters.yml - File Discovery"
  description: "Parameters.yml was discovered. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.exploit-db.com/ghdb/5986"
  tags: ["exposure", "cloud", "devops", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "High"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/parameters.yml" }
  - id: "probe1"
    request: { method: "GET", path: "/app/config/parameters.yml" }
  - id: "probe2"
    request: { method: "GET", path: "/parameters.yml.dist" }
  - id: "probe3"
    request: { method: "GET", path: "/app/config/parameters.yml.dist" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - all:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "parameters:" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "database_user" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "database_password" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - all:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "parameters:" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "database_user" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "database_password" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
      - all:
          - all:
              - contains: { left: { ref: "steps.probe2.body" }, right: { value: "parameters:" } }
              - contains: { left: { ref: "steps.probe2.body" }, right: { value: "database_user" } }
              - contains: { left: { ref: "steps.probe2.body" }, right: { value: "database_password" } }
          - eq: { left: { ref: "steps.probe2.status" }, right: { value: 200 } }
      - all:
          - all:
              - contains: { left: { ref: "steps.probe3.body" }, right: { value: "parameters:" } }
              - contains: { left: { ref: "steps.probe3.body" }, right: { value: "database_user" } }
              - contains: { left: { ref: "steps.probe3.body" }, right: { value: "database_password" } }
          - eq: { left: { ref: "steps.probe3.status" }, right: { value: 200 } }
