schema_version: 1
id: "cortex.community:cyberark-pvwa-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "CyberArk Password Vault Web Access - Login Panel"
  description: "CyberArk Password Vault Web Access (PVWA) is the web interface for CyberArk Privileged Access Manager. The PVWA login panel was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.cyberark.com/"
  tags: ["panel", "cyberark", "pvwa", "pam", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/PasswordVault/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)<title>Password\\ Vault</title>" } }
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)/PasswordVault/v10/assets/cyb\\-loading\\-page" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
