schema_version: 1
id: "cortex.community:stormshield-network-security-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Stormshield Network Security - Login Panel"
  description: "Stormshield Network Security (SNS) is a French network security appliance providing firewall, IPS, VPN, and web filtering capabilities. Its web management portal is frequently exposed on non-standard ports. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.stormshield.com/products/network-security/"
  tags: ["panel", "stormshield", "vpn", "firewall", "network-security", "detect", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
  - id: "probe1"
    request: { method: "GET", path: "/admin" }
  - id: "probe2"
    request: { method: "GET", path: "/admin/admin.html" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Stormshield Network Security - Portal" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - contains: { left: { ref: "steps.probe1.body" }, right: { value: "Stormshield Network Security - Portal" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
      - all:
          - contains: { left: { ref: "steps.probe2.body" }, right: { value: "Stormshield Network Security - Portal" } }
          - eq: { left: { ref: "steps.probe2.status" }, right: { value: 200 } }
