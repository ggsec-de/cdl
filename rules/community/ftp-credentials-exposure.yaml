schema_version: 1
id: "cortex.community:ftp-credentials-exposure"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "FTP Credentials Exposure"
  description: "FTP credentials were detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  cwes: [200]
  tags: ["config", "ftp", "exposure", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "High"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/ftpsync.settings" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "FTPSync" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "overwrite_newer_prevention" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "default_folder_permissions" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
