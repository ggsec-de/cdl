schema_version: 1
id: "cortex.community:opentouch-multimediaservices-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "OpenTouch Multimedia Services - Detect"
  description: "OpenTouch Multimedia Services Login Panel was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.al-enterprise.com/-/media/assets/internet/documents/opentouch-multimedia-services-datasheet-en.pdf"
  tags: ["panel", "opentouch", "login", "detect", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/authenticationform/login" }
  - id: "probe1"
    request: { method: "GET", path: "/authenticationform/jsp/logonWeb.jsp" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - all:
              - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)OpenTouch" } }
              - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)Multimedia\\ Services" } }
              - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)Alcatel\\-Lucent" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - all:
              - regex: { left: { ref: "steps.probe1.body" }, right: { value: "(?i)OpenTouch" } }
              - regex: { left: { ref: "steps.probe1.body" }, right: { value: "(?i)Multimedia\\ Services" } }
              - regex: { left: { ref: "steps.probe1.body" }, right: { value: "(?i)Alcatel\\-Lucent" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
