schema_version: 1
id: "cortex.community:ibm-decision-server-console"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "IBM Decision Server Console Panel - Detect"
  description: "IBM Decision Server Console panel was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.ibm.com/docs/en/odm/8.12.0?topic=overview-introducing-rule-execution-server"
  tags: ["panel", "ibm", "login", "detect", "decision-server", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/res/login.jsf" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - any:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>Rule Execution Server</title>" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Rule Execution Server console" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
