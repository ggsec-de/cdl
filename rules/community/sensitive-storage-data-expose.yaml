schema_version: 1
id: "cortex.community:sensitive-storage-data-expose"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Sensitive Storage Data - Detect"
  description: "A generic search for 'storage' in sensitive key files, file names, logs, etc., returned a match. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.exploit-db.com/ghdb/6304"
  cwes: [200]
  tags: ["expose", "listing", "config", "logs", "storage", "edb", "files", "exposure", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Medium"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/storage/" }
  - id: "probe1"
    request: { method: "GET", path: "/api_smartapp/storage/" }
  - id: "probe2"
    request: { method: "GET", path: "/equipbid/storage/" }
  - id: "probe3"
    request: { method: "GET", path: "/server/storage/" }
  - id: "probe4"
    request: { method: "GET", path: "/intikal/storage/" }
  - id: "probe5"
    request: { method: "GET", path: "/elocker_old/storage/" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - all:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Index of" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "oauth-private.key" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "oauth-private.key" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - all:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "Index of" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "oauth-private.key" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "oauth-private.key" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
      - all:
