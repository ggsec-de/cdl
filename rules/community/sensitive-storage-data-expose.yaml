              - contains: { left: { ref: "steps.probe4.body" }, right: { value: "oauth-private.key" } }
              - contains: { left: { ref: "steps.probe4.body" }, right: { value: "oauth-private.key" } }
          - eq: { left: { ref: "steps.probe4.status" }, right: { value: 200 } }
