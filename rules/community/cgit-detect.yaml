schema_version: 1
id: "cortex.community:cgit-detect"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "cgit Web Interface - Detection"
  description: "Detects cgit web interface for Git repositories. cgit is a hyperfast web frontend for Git repositories written in C. It provides a web-based interface to browse Git repositories, view commits, diffs, and files. cgit is designed to be publicly accessible for open source projects. However, detecting cgit instances Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://git.zx2c4.com/cgit/about/"
    - "https://wiki.archlinux.org/title/Cgit"
  tags: ["tech", "cgit", "git", "panel", "detect", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
  - id: "probe1"
    request: { method: "GET", path: "/cgit/" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - all:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "cgit" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "generated by" } }
          - any:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "repository list" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "class='list nowrap'" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "id='cgit'" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "cgit.css" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - all:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "cgit" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "generated by" } }
          - any:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "repository list" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "class='list nowrap'" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "id='cgit'" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "cgit.css" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
