schema_version: 1
id: "cortex.community:cisco-ucm-detect"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Cisco Unified Communications Manager - Detect"
  description: "Detected the presence of the Cisco Unified Communications User Management portal. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://developer.cisco.com/site/user-data-services/develop-and-test/api-reference/#version"
  tags: ["tech", "detect", "cisco", "ucm", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request:
      method: "GET"
      path: "/cucm-uds/version"
      headers: { "Accept": "application/xml" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<versionInformation" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<version>" } }
