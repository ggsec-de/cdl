schema_version: 1
id: "cortex.community:f5-next-central-manager"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "F5 Next Central Manager Panel - Detect"
  description: "F5 Next Central Manager login panel was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://clouddocs.f5.com/bigip-next/latest/use_cm/"
  cwes: [200]
  tags: ["panel", "fortinet", "login", "f5", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/gui/login" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>BIG-IP Next | Central Manager" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
