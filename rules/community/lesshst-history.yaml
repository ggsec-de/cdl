schema_version: 1
id: "cortex.community:lesshst-history"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Less History - File Disclosure"
  description: "LESSHST file is a Less History File. LESSHST file is a Less History File. Less is a terminal pager program on Unix, Windows, and Unix-like systems used to view (but not change) the contents of a text file one screen at a time. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  tags: ["misconfig", "disclosure", "config", "files", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Low"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/.lesshst" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: ".less-history-file:" } }
      - not:
          any:
            - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<?xml" } }
            - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<env" } }
            - contains: { left: { ref: "steps.probe0.body" }, right: { value: "application/javascript" } }
            - contains: { left: { ref: "steps.probe0.body" }, right: { value: "application/json" } }
            - contains: { left: { ref: "steps.probe0.body" }, right: { value: "application/xml" } }
            - contains: { left: { ref: "steps.probe0.body" }, right: { value: "html>" } }
            - contains: { left: { ref: "steps.probe0.body" }, right: { value: "text/html" } }
            - contains: { left: { ref: "steps.probe0.body" }, right: { value: "image/" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
