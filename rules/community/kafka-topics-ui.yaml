schema_version: 1
id: "cortex.community:kafka-topics-ui"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Apache Kafka Topics Panel - Detect"
  description: "Apache Kafka Topics panel was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://kafka.apache.org/"
    - "https://github.com/provectus/kafka-ui"
  cwes: [200]
  tags: ["panel", "kafka", "apache", "detect", "provectus", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
  - id: "probe1"
    request: { method: "GET", path: "/info" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - any:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>Kafka Topics UI - Browse Kafka Data</title>" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>UI for Apache Kafka</title>" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "github.com/provectus/kafka-ui" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - any:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "<title>Kafka Topics UI - Browse Kafka Data</title>" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "<title>UI for Apache Kafka</title>" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "github.com/provectus/kafka-ui" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
