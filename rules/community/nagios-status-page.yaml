schema_version: 1
id: "cortex.community:nagios-status-page"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Nagios Current Status Page - Detect"
  description: "Nagios current status page was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.exploit-db.com/ghdb/6918"
  cwes: [200]
  tags: ["exposure", "nagios", "status", "edb", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Medium"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/nagios/cgi-bin/status.cgi" }
  - id: "probe1"
    request: { method: "GET", path: "/cgi-bin/nagios4/status.cgi" }
  - id: "probe2"
    request: { method: "GET", path: "/cgi-bin/nagios3/status.cgi" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Current Network Status" } }
      - contains: { left: { ref: "steps.probe1.body" }, right: { value: "Current Network Status" } }
      - contains: { left: { ref: "steps.probe2.body" }, right: { value: "Current Network Status" } }
