schema_version: 1
id: "cortex.community:unauth-fastvue-dashboard"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Fastvue Dashboard Panel - Unauthenticated Detect"
  description: "Fastvue Dashboard panel was detected without authentication. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  cwes: [200]
  tags: ["panel", "fastvue", "unauth", "misconfig", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Medium"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/dashboard.aspx" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - any:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>Fastvue Sophos Reporter</title>" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>Fastvue Reporter for SonicWall</title>" } }
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Dashboard" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
