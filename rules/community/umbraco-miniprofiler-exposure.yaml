schema_version: 1
id: "cortex.community:umbraco-miniprofiler-exposure"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Umbraco Mini Profiler - Exposure"
  description: "Detected the exposure of the MiniProfiler debugging interface in Umbraco CMS. When exposed, it can reveal sensitive information including SQL queries, execution times, stack traces, and internal application details. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://miniprofiler.com/"
    - "https://umbraco.com/"
  tags: ["umbraco", "miniprofiler", "exposure", "debug", "misconfig", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Low"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/mini-profiler-resources/results" }
  - id: "probe1"
    request: { method: "GET", path: "/umbraco/mini-profiler-resources/results" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - all:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "StartupProfiler" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "var profiler =" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "\"DurationMilliseconds\"" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - all:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "StartupProfiler" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "var profiler =" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "\"DurationMilliseconds\"" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
