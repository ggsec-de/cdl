schema_version: 1
id: "cortex.community:wp-bricks-builder-theme"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "WordPress Bricks Builder Theme Version"
  description: "- Checks for Bricks Builder Theme versions. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://0day.today/exploit/description/39489"
  tags: ["wordpress", "theme", "wp-theme", "wp", "bricks", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/wp-content/themes/bricks/readme.txt" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Bricks - Visual Website Builder" } }
      - regex: { left: { ref: "steps.probe0.body" }, right: { value: "Stable tag:([ 0-9.]+)" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
