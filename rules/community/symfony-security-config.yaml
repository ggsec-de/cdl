schema_version: 1
id: "cortex.community:symfony-security-config"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Symfony Security Configuration File - Detect"
  description: "Symfony security configuration file was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://symfony2-document.readthedocs.io/en/latest/book/security.html"
    - "https://symfony.com/doc/current/reference/configuration/security.html"
  cwes: [200]
  tags: ["config", "exposure", "symfony", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/config/packages/security.yaml" }
  - id: "probe1"
    request: { method: "GET", path: "/app/config/security.yml" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
          - all:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "security:" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "firewalls:" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "access_control:" } }
      - all:
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
          - all:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "security:" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "firewalls:" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "access_control:" } }
