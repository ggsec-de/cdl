schema_version: 1
id: "cortex.community:seeddms-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "SeedDMS Login Panel - Detect"
  description: "SeedDMS login panel was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  cwes: [200]
  tags: ["panel", "seeddms", "login", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/out/out.Login.php?referuri=%2Fout%2Fout.ViewFolder.php" }
  - id: "probe1"
    request: { method: "GET", path: "/dms/out/out.Login.php?referuri=%2Fout%2Fout.ViewFolder.php" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - any:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "href=\"/out/out.ViewFolder.php\">SeedDMS</a>" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "href=\"../out/out.ViewFolder.php?folderid=1\">SeedDMS</a>" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - any:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "href=\"/out/out.ViewFolder.php\">SeedDMS</a>" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "href=\"../out/out.ViewFolder.php?folderid=1\">SeedDMS</a>" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
