schema_version: 1
id: "cortex.community:oauth-authorization-server-exposure"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Well-Known OAuth Authorization Server Metadata"
  description: "Detects OAuth 2.0 Authorization Server metadata (RFC 8414). Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.rfc-editor.org/rfc/rfc8414"
  tags: ["well-known", "oauth", "oidc", "security", "rfc8414", "miscellaneous", "misc", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/.well-known/oauth-authorization-server" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "issuer" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "authorization_endpoint" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
