schema_version: 1
id: "cortex.community:crafty-controller-detect"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Crafty Controller - Detect"
  description: "Crafty Controller is an open-source Minecraft server management interface. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://gitlab.com/crafty-controller/crafty-4"
  tags: ["crafty", "tech", "detect", "gaming", "minecraft", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>Crafty Controller</title>" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "/static/assets/crafty.webmanifest" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "/static/assets/css/crafty.css" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
