schema_version: 1
id: "cortex.community:weebly-detect"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Weebly Detection"
  description: "An instance running Weebly is detected by looking for specific HTTP headers, HTML tags, and known endpoints. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  tags: ["weebly", "detect", "tech", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
  - id: "probe1"
    request: { method: "GET", path: "/robots.txt" }
  - id: "probe2"
    request: { method: "GET", path: "/sitemap.xml" }
  - id: "probe3"
    request: { method: "GET", path: "/favicon.ico" }
  - id: "probe4"
    request: { method: "GET", path: "/index.php" }
  - id: "probe5"
    request: { method: "GET", path: "/weebly/" }
  - id: "probe6"
    request: { method: "GET", path: "/site/" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - any:
              - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)Powered\\ by\\ Weebly" } }
              - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)weebly\\.com" } }
              - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)X\\-Powered\\-By\\-Weebly" } }
          - any:
              - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
              - eq: { left: { ref: "steps.probe0.status" }, right: { value: 403 } }
      - all:
          - any:
              - regex: { left: { ref: "steps.probe1.body" }, right: { value: "(?i)Powered\\ by\\ Weebly" } }
              - regex: { left: { ref: "steps.probe1.body" }, right: { value: "(?i)weebly\\.com" } }
              - regex: { left: { ref: "steps.probe1.body" }, right: { value: "(?i)X\\-Powered\\-By\\-Weebly" } }
          - any:
