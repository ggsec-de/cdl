schema_version: 1
id: "cortex.community:unitrends-recovery-series-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Unitrends Recovery Series - Login Panel"
  description: "Unitrends Recovery Series backup appliance web management login panel was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.unitrends.com/products/backup-and-disaster-recovery/backup-appliance/"
  tags: ["panel", "unitrends", "backup", "recovery", "login", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/ui/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title ng-bind=\"Unitrends + Page.title()\">Unitrends</title>" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "ng-include=\"'app/login/login.html'\"" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
