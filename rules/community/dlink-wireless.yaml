schema_version: 1
id: "cortex.community:dlink-wireless"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "D-Link Wireless Router Panel - Detect"
  description: "D-Link Wireless Router panel was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.exploit-db.com/ghdb/6784"
  cwes: [200]
  tags: ["dlink", "router", "edb", "panel", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/status.php" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - any:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>D-LINK SYSTEMS, INC. | WIRELESS ROUTER | HOME</title>" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>D-LINK SYSTEMS, INC. | WIRELESS ACCESS POINT | HOME</title>" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
