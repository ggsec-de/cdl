schema_version: 1
id: "cortex.community:adobe-connect-username-exposure"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Adobe Connect Username Exposure"
  description: "Adobe Connect Username is exposed. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://packetstormsecurity.com/files/161345/Adobe-Connect-10-Username-Disclosure.html"
  tags: ["adobe", "disclosure", "packetstorm", "misconfig", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Low"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/system/help/support" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Administrators name:" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Support Administrators email address:" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
