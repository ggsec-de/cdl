schema_version: 1
id: "cortex.community:freepbx-cleanup-backdoor"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "FreePBX - CVE-2025-57819 Backdoor"
  description: "FreePBX backdoor cleanup script used in 0-day exploitation of CVE-2025-57819 was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://community.freepbx.org/t/security-advisory-please-lock-down-your-administrator-access/107203"
  tags: ["backdoor", "sangoma", "freepbx", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "High"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/.clean.sh" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "LOGS" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Processing file" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "sed -i --follow-symlinks" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "/var/log/asterisk/freepbx_security.log" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
