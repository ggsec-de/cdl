schema_version: 1
id: "cortex.community:meteor-takeover"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Meteor subdomain takeover"
  description: "Meteor takeover was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://rivalsec.github.io/blog/2022/12/02/meteor.html"
    - "https://github.com/EdOverflow/can-i-take-over-xyz/issues/321"
  tags: ["takeover", "meteor", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "High"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    contains: { left: { ref: "steps.probe0.body" }, right: { value: "404 Not Found: No applications registered for host '" } }
