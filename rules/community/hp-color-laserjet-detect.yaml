schema_version: 1
id: "cortex.community:hp-color-laserjet-detect"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "HP Color LaserJet Detection"
  description: "HP color laserJet panel was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "http://www.hp.com/"
    - "https://www.hp.com/us-en/shop/cv/printers"
  tags: ["iot", "hp", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
  - id: "probe1"
    request: { method: "GET", path: "/hp/device/this.LCDispatcher" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - any:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "HP Color LaserJet" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<td class=\"mastheadTitle\"><h1>HP Color LaserJet" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<strong class=\"product\">HP Color LaserJet" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<a href=\"info_deviceStatus.html?" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - any:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "HP Color LaserJet" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "<td class=\"mastheadTitle\"><h1>HP Color LaserJet" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "<strong class=\"product\">HP Color LaserJet" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "<a href=\"info_deviceStatus.html?" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
