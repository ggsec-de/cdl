schema_version: 1
id: "cortex.community:array-networks-ssl-vpn-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Array Networks SSL VPN - Login Panel"
  description: "Array Networks AG Series SSL VPN appliances provide enterprise remote access. The web login portal (Pilot) is typically accessible on port 8889 or via /prx/ paths. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.arraynetworks.com/products/ag-series.html"
  tags: ["panel", "array-networks", "ssl-vpn", "vpn", "network", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - any:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Array Networks Pilot Login" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Array Networks" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "ArrayOS" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
