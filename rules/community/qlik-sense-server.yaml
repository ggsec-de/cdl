schema_version: 1
id: "cortex.community:qlik-sense-server"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Qlik Sense Server Panel - Detect"
  description: "Qlik Sense Server panel was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.qlik.com/us/products/qlik-sense"
  cwes: [200]
  tags: ["panel", "qlik", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/hub" }
  - id: "probe1"
    request: { method: "GET", path: "/resources/autogenerated/product-info.json" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - any:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "alt=\"Qlik Sense" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "class=\"qlik-logo\"" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "alt=\"Qlik.Sense\"" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "qliksenseserver" } }
      - any:
          - contains: { left: { ref: "steps.probe1.body" }, right: { value: "alt=\"Qlik Sense" } }
          - contains: { left: { ref: "steps.probe1.body" }, right: { value: "class=\"qlik-logo\"" } }
          - contains: { left: { ref: "steps.probe1.body" }, right: { value: "alt=\"Qlik.Sense\"" } }
          - contains: { left: { ref: "steps.probe1.body" }, right: { value: "qliksenseserver" } }
