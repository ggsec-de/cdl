schema_version: 1
id: "cortex.community:netalertx-dashboard"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "NetAlert X Admin Dashboard - Exposed"
  description: "Unauthorized access to the NetAlert X Admin Dashboard. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://github.com/jokob-sk/NetAlertX"
  tags: ["netalertx", "unauth", "dashboard", "misconfig", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Medium"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
  - id: "probe1"
    request: { method: "GET", path: "/devices.php" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - all:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>NetAlertX" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Sign out</a>" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "My Devices" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - all:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "<title>NetAlertX" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "Sign out</a>" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "My Devices" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
