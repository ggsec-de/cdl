schema_version: 1
id: "cortex.community:thinkphp-errors"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "ThinkPHP Errors - Sensitive Information Exposure"
  description: "ThinkPHP error is leaking sensitive info. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  tags: ["thinkphp", "misconfig", "exposure", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Medium"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "_DATABASE</td>" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "_USERNAME</td>" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "_PASSWORD</td>" } }
      - any:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>系统发生错误</title>" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>System Error</title>" } }
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Exception" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "REQUEST_TIME" } }
      - any:
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 500 } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 404 } }
