schema_version: 1
id: "cortex.community:bash-config-exposure"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Bash Configuration - Exposure"
  description: "Detected exposed bash configuration on web servers that could have contained sensitive information such as credentials, API keys, database connection strings, or internal paths. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  tags: ["exposure", "config", "misconfig", "bash", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Low"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/.bashrc" }
  - id: "probe1"
    request: { method: "GET", path: "/.bash_profile" }
  - id: "probe2"
    request: { method: "GET", path: "/.profile" }
  - id: "probe3"
    request: { method: "GET", path: "/.zshrc" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "usr/(local|bin)/" } }
          - any:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "export " } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "source " } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "if [" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "then" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "echo " } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "for " } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "do" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "done" } }
          - not:
              any:
                - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<html" } }
                - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<!DOCTYPE" } }
                - contains: { left: { ref: "steps.probe0.body" }, right: { value: "404" } }
                - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Not Found" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - regex: { left: { ref: "steps.probe1.body" }, right: { value: "usr/(local|bin)/" } }
          - any:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "export " } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "source " } }
