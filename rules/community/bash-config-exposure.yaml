              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "echo " } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "for " } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "do" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "done" } }
