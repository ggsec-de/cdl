schema_version: 1
id: "cortex.community:copa-data-zenon-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Copa-Data zenon - Login Panel"
  description: "Copa-Data zenon is an industrial automation platform used in manufacturing, energy, and infrastructure. The zenon Web Server and Smart Server expose a browser-based HMI interface for remote monitoring and control of SCADA processes. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.copadata.com/en/products/zenon-software-platform/zenon-supervisor/"
    - "https://www.copadata.com/en/support-services/knowledge-base-documents/zenon-web-server/"
  tags: ["panel", "scada", "hmi", "ics", "copa-data", "zenon", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "COPA-DATA" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "zenon" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
