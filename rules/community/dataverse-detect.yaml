schema_version: 1
id: "cortex.community:dataverse-detect"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Dataverse - Detect"
  description: "Dataverse is an open-source platform for publishing and preserving research data. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://github.com/IQSS/dataverse"
  tags: ["tech", "detect", "dataverse", "research", "data", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)<title>[^<]*Dataverse[^<]*</title>" } }
      - any:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "/jakarta.faces.resource/" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "/javax.faces.resource/" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
