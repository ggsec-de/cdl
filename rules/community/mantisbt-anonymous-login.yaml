schema_version: 1
id: "cortex.community:mantisbt-anonymous-login"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "mantisbt - Anonymous Login"
  description: "mantisbt Anonymous login were discovered. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  tags: ["default-logins", "anonymous", "mantisbt", "default-login", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Medium"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/my_view_page.php" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "\"user-info\">anonymous</span>" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "My View" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Roadmap" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
