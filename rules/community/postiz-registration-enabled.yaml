schema_version: 1
id: "cortex.community:postiz-registration-enabled"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Postiz - User Registration Enabled"
  description: "Postiz registration page is exposed and allows public account creation. Unrestricted registration may allow unauthorized users to create accounts. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  tags: ["postiz", "misconfig", "exposure", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/auth" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>Postiz Register</title>" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Create Account</div></button>" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Sign Up</h1>" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
