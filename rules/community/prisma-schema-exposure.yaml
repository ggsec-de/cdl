schema_version: 1
id: "cortex.community:prisma-schema-exposure"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Exposed Prisma Database Schema - Exposure"
  description: "Prisma is a modern ORM extremely popular in the Node.js and TypeScript (Next.js/Express) ecosystems. Developers often accidentally expose the `prisma/` folder in web directories during deployments or Docker builds. This template checks for the exposure of the `schema.prisma` file, which typically contains the complete internal database table definitions, architectures, and the database connection strings (URLs) pointing to AWS RDS, PostgreSQL, or SQLite databases. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  tags: ["exposure", "prisma", "database", "config", "custom", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Medium"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/schema.prisma" }
  - id: "probe1"
    request: { method: "GET", path: "/prisma/schema.prisma" }
  - id: "probe2"
    request: { method: "GET", path: "/src/prisma/schema.prisma" }
  - id: "probe3"
    request: { method: "GET", path: "/db/schema.prisma" }
  - id: "probe4"
    request: { method: "GET", path: "/.prisma/schema.prisma" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - all:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "generator" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "datasource " } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "provider =" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "model " } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - all:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "generator" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "datasource " } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "provider =" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "model " } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
      - all:
          - all:
              - contains: { left: { ref: "steps.probe2.body" }, right: { value: "generator" } }
              - contains: { left: { ref: "steps.probe2.body" }, right: { value: "datasource " } }
              - contains: { left: { ref: "steps.probe2.body" }, right: { value: "provider =" } }
              - contains: { left: { ref: "steps.probe2.body" }, right: { value: "model " } }
          - eq: { left: { ref: "steps.probe2.status" }, right: { value: 200 } }
      - all:
          - all:
              - contains: { left: { ref: "steps.probe3.body" }, right: { value: "generator" } }
              - contains: { left: { ref: "steps.probe3.body" }, right: { value: "datasource " } }
              - contains: { left: { ref: "steps.probe3.body" }, right: { value: "provider =" } }
              - contains: { left: { ref: "steps.probe3.body" }, right: { value: "model " } }
          - eq: { left: { ref: "steps.probe3.status" }, right: { value: 200 } }
      - all:
          - all:
              - contains: { left: { ref: "steps.probe4.body" }, right: { value: "generator" } }
              - contains: { left: { ref: "steps.probe4.body" }, right: { value: "datasource " } }
