schema_version: 1
id: "cortex.community:meteor-detect"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Meteor.js Framework - Detect"
  description: "Detects the presence of Meteor.js, an open-source isomorphic JavaScript web framework written using Node.js. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.meteor.com/"
    - "https://docs.meteor.com/"
  tags: ["tech", "discovery", "meteor", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "__meteor_runtime_config__" } }
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "__meteor-css__" } }
