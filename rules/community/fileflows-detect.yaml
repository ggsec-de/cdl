schema_version: 1
id: "cortex.community:fileflows-detect"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "FileFlows - Detect"
  description: "FileFlows is a media file processing and automation application. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://fileflows.com/"
  tags: ["fileflows", "tech", "detect", "media", "automation", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>FileFlows</title>" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<meta name=\"app-version\"" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "flow-editor/fileflows-editor.js" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
