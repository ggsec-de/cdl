schema_version: 1
id: "cortex.community:http-etcd-unauthenticated-api-v3"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "etcd v3 Unauthenticated API"
  description: "etcd's v3 API is reachable and authentication is disabled or not configured. With auth disabled, the v3 API grants full read and write access to every key in the store to anyone who can reach it. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://etcd.io/docs/v3.5/op-guide/authentication/"
    - "https://etcd.io/docs/v3.5/op-guide/security/"
  cwes: [306]
  tags: ["misconfig", "unauth", "etcd", "exposure", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "High"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request:
      method: "POST"
      path: "/v3/auth/status"
      headers: { "Content-Type": "application/json" }
      body: "{}"
proof:
  kind: "signal.v1"
  assertions:
    all:
      - not:
          contains: { left: { ref: "steps.probe0.body" }, right: { value: "\"enabled\":true" } }
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "authRevision" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
