schema_version: 1
id: "cortex.community:paystack-secret-live"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Paystack Secret/Live Key - Exposure"
  description: "Detected exposed Paystack secret keys (test or live) found in application source code, configuration files, or client-side assets. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://support.paystack.com/en/articles/2123458"
  tags: ["exposure", "token", "paystack", "fintech", "tinlance", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - regex: { left: { ref: "steps.probe0.body" }, right: { value: "sk_(live|test)_[0-9a-zA-Z]{50,}" } }
      - any:
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)paystack" } }
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)secret_key" } }
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)sk_live" } }
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)sk_test" } }
