schema_version: 1
id: "cortex.community:seaweedfs-unauth"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "SeaweedFS Filer - Unauthenticated Access"
  description: "SeaweedFS Filer interface is exposed without authentication.Unauthenticated users may be able to upload, modify, or access files, potentially leading to malicious file hosting, data exposure, or remote compromise. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  cwes: [306]
  tags: ["panel", "seaweedfs", "filer", "storage", "unauth", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "High"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - regex: { left: { ref: "steps.probe0.body" }, right: { value: "<title>\\s*SeaweedFS Filer.*</title>" } }
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "</span> New Folder" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "</span> Upload" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
