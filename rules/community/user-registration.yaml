schema_version: 1
id: "cortex.community:user-registration"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "WordPress User Registration & Membership Plugin Detection"
  description: "Detected WordPress User Registration & Membership plugin and its version information. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://wordpress.org/plugins/user-registration/"
  tags: ["wordpress", "wp-plugin", "user-registration", "tech", "wp", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/wp-content/plugins/user-registration/readme.txt" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "User Registration" } }
      - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)Stable tag:\\s*[\\d.]+" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
