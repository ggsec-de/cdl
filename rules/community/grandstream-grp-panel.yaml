schema_version: 1
id: "cortex.community:grandstream-grp-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Grandstream GRP Panel - Detect"
  description: "Detected the presence of a Grandstream GRP web management login panel. The React-based SPA loads characteristic JavaScript modules including tl.account.ucm.js and webpack chunks for UCM modules. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  tags: ["panel", "grandstream", "grp", "iot", "detect", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/login" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "tl.account.ucm.js" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "tl.phoneSettings.js" } }
      - any:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "tl.maintenance.js" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "tl.sysSettings.js" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
