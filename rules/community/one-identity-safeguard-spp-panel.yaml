schema_version: 1
id: "cortex.community:one-identity-safeguard-spp-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "One Identity Safeguard for Privileged Passwords - Login Panel"
  description: "One Identity Safeguard for Privileged Passwords is a privileged password vault and session management platform. The login panel was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://support.oneidentity.com/technical-documents/one-identity-safeguard-for-privileged-passwords"
  tags: ["panel", "oneidentity", "safeguard", "spp", "pam", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>Safeguard for Privileged Passwords</title>" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "/images/SafeguardLogo.png" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
