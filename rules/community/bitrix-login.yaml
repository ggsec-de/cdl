schema_version: 1
id: "cortex.community:bitrix-login"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Bitrix Login Panel"
  description: "Bitrix24 is a unified work space that places a complete set of business tools into a single, intuitive interface. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  cwes: [200]
  tags: ["panel", "bitrix", "login", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/bitrix/admin/" }
  - id: "probe1"
    request: { method: "GET", path: "/bitrix/components/bitrix/map.yandex.view/settings/settings.php" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "USER_LOGIN" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "/bitrix/js/main/" } }
      - all:
          - contains: { left: { ref: "steps.probe1.body" }, right: { value: "USER_LOGIN" } }
          - contains: { left: { ref: "steps.probe1.body" }, right: { value: "/bitrix/js/main/" } }
