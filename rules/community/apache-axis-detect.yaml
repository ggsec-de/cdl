schema_version: 1
id: "cortex.community:apache-axis-detect"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "apache-axis-detect"
  description: "Axis and Axis2 detection Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  tags: ["tech", "axis2", "middleware", "apache", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
  - id: "probe1"
    request: { method: "GET", path: "/axis2/" }
  - id: "probe2"
    request: { method: "GET", path: "/axis/" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - all:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Validate" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Welcome" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Axis" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "deployed" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "installation" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Admin" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - all:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "Validate" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "Welcome" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "Axis" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "deployed" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "installation" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "Admin" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
      - all:
          - all:
              - contains: { left: { ref: "steps.probe2.body" }, right: { value: "Validate" } }
              - contains: { left: { ref: "steps.probe2.body" }, right: { value: "Welcome" } }
              - contains: { left: { ref: "steps.probe2.body" }, right: { value: "Axis" } }
              - contains: { left: { ref: "steps.probe2.body" }, right: { value: "deployed" } }
              - contains: { left: { ref: "steps.probe2.body" }, right: { value: "installation" } }
              - contains: { left: { ref: "steps.probe2.body" }, right: { value: "Admin" } }
          - eq: { left: { ref: "steps.probe2.status" }, right: { value: 200 } }
