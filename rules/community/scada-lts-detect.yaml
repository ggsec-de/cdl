schema_version: 1
id: "cortex.community:scada-lts-detect"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Scada-LTS - Detect"
  description: "Scada-LTS is an open-source, web-based supervisory control and data acquisition platform. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://github.com/SCADA-LTS/Scada-LTS"
  tags: ["scada-lts", "tech", "scada", "hmi", "ics", "industrial", "detect", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Scada-LTS" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "content=\"ScadaLTS Software\"" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "resources/fuscabr/fuscabr.js" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
