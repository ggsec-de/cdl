schema_version: 1
id: "cortex.community:wpml-xss"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "WordPress Plugin WPML Version < 4.6.1 Cross-Site Scripting"
  description: "WordPress Plugin WPML Version < 4.6.1 is vulnerable to RXSS via wp_lang parameter. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://wpml.org/fr/changelog/2023/03/wpml-4-6-1-important-security-update/"
    - "https://twitter.com/bug_vs_me/status/1652789903766200320"
  tags: ["xss", "wp", "wordpress", "wpml", "wp-plugin", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Medium"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/wp-login.php?wp_lang=en_US%27" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "#039;\"=" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "wpml_lang" } }
