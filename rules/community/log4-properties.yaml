schema_version: 1
id: "cortex.community:log4-properties"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Log4j Properties - File Disclosure"
  description: "Log4j Properties file is exposed. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://docs.oracle.com/cd/E29578_01/webhelp/cas_webcrawler/src/cwcg_config_log4j_file.html"
  tags: ["exposure", "files", "log4j", "oracle", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Low"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/log4j.properties" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)log4j\\.rootLogger=" } }
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)log4j\\.logger" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
