schema_version: 1
id: "cortex.community:honeywell-scada-config"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Honeywell Scada Configuration File - Detect"
  description: "Honeywell Scada configuration file was detected. The downloaded file opens with the file name and contains critical information about the destination address. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.exploit-db.com/exploits/44734"
  tags: ["scada", "config", "exposure", "edb", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Low"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/web_caps/webCapsConfig" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "DeviceSubClass" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "IPAddress" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
