schema_version: 1
id: "cortex.community:pbootcms-database-file-download"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "PbootCMS 2.0.7 - SQL Injection"
  description: "PbootCMS 2.0.7 contains a SQL injection vulnerability via pbootcms.db. An attacker can possibly obtain sensitive information from a database, modify data, and execute unauthorized administrative operations in the context of the affected site. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://xz.aliyun.com/t/7628"
    - "https://www.cnblogs.com/0daybug/p/12786036.html"
  cwes: [89]
  tags: ["pbootcms", "db", "exposure", "database", "sqlite", "sqli", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Critical"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/data/pbootcms.db" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "PbootCMS" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "SQLite format 3" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
