schema_version: 1
id: "cortex.community:jumpserver-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "JumpServer Login Panel - Detect"
  description: "JumpServer Open Source Bastion Host login panel was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.jumpserver.org/"
    - "https://github.com/jumpserver/jumpserver"
  cwes: [200]
  tags: ["panel", "jumpserver", "login", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/core/auth/login/" }
  - id: "probe1"
    request: { method: "GET", path: "/users/login/" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - any:
              - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)<title>(\n.*)JumpServer Open Source Bastion Host(\n.*)</title>" } }
              - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)<title>(\n.*)JumpServer 开源堡垒机(\n.*)</title>" } }
              - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)<title>\n*Jumpserver.*?\n*</title>" } }
              - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)>Welcome to the Jumpserver.*?</h2>" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - any:
              - regex: { left: { ref: "steps.probe1.body" }, right: { value: "(?i)<title>(\n.*)JumpServer Open Source Bastion Host(\n.*)</title>" } }
              - regex: { left: { ref: "steps.probe1.body" }, right: { value: "(?i)<title>(\n.*)JumpServer 开源堡垒机(\n.*)</title>" } }
              - regex: { left: { ref: "steps.probe1.body" }, right: { value: "(?i)<title>\n*Jumpserver.*?\n*</title>" } }
              - regex: { left: { ref: "steps.probe1.body" }, right: { value: "(?i)>Welcome to the Jumpserver.*?</h2>" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
