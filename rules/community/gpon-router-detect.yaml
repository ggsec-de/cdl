schema_version: 1
id: "cortex.community:gpon-router-detect"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "GPON Home Gateway - Detect"
  description: "GPON home gateway device was detected. The \"GPON Home Gateway\" interface string belongs to Dasan-licensed firmware that is rebranded by many ISPs worldwide. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.vpnmentor.com/blog/critical-vulnerability-gpon-router"
    - "https://nvd.nist.gov/vuln/detail/CVE-2018-10562"
  cwes: [200]
  tags: ["tech", "gpon", "router", "iot", "detect", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)<title>\\s*GPON Home Gateway\\s*</title>" } }
      - any:
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 401 } }
