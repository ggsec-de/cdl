schema_version: 1
id: "cortex.community:sphider-login"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Sphider Admin Login Panel - Detect"
  description: "Sphider admin login panel was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.exploit-db.com/ghdb/6641"
  cwes: [200]
  tags: ["edb", "panel", "sphider", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/admin/spider.php" }
  - id: "probe1"
    request: { method: "GET", path: "/sphider/admin/admin.php" }
  - id: "probe2"
    request: { method: "GET", path: "/search/admin/admin.php" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>Sphider Admin Login</title>" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - contains: { left: { ref: "steps.probe1.body" }, right: { value: "<title>Sphider Admin Login</title>" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
      - all:
          - contains: { left: { ref: "steps.probe2.body" }, right: { value: "<title>Sphider Admin Login</title>" } }
          - eq: { left: { ref: "steps.probe2.status" }, right: { value: 200 } }
