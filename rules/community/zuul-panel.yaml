schema_version: 1
id: "cortex.community:zuul-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Zuul Panel - Detect"
  description: "ZUUL panel was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://opendev.org/zuul/zuul"
  cwes: [200]
  tags: ["panel", "zuul", "cicd", "oss", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/api/tenants" }
  - id: "probe1"
    request: { method: "GET", path: "/api/status" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - any:
          - all:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "\"name\":" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "\"projects\":" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "\"queue\":" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "zuul_version" } }
      - any:
          - all:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "\"name\":" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "\"projects\":" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "\"queue\":" } }
          - contains: { left: { ref: "steps.probe1.body" }, right: { value: "zuul_version" } }
