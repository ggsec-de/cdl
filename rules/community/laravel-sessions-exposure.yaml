schema_version: 1
id: "cortex.community:laravel-sessions-exposure"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Laravel Sessions Folder Exposure"
  description: "Detected unauthenticated access to the Laravel session storage directory, allowing attackers to browse and download session files that may contain active authentication tokens, CSRF tokens, and serialized user data. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  tags: ["laravel", "exposure", "misconfig", "storage", "session", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "High"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/storage/framework/sessions/" }
  - id: "probe1"
    request: { method: "GET", path: "/storage/sessions/" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - any:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Index of" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Parent Directory" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>Index of" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Directory listing for" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - any:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "Index of" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "Parent Directory" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "<title>Index of" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "Directory listing for" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
