schema_version: 1
id: "cortex.community:auth-json"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Auth.json File - Disclosure"
  description: "auth.json file is exposed. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  tags: ["devops", "exposure", "files", "auth", "config", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "High"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/auth.json" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "\"http-basic\": {" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "\"username\":" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "\"password\":" } }
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "\"github-oauth\": {" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "\"github.com\":" } }
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "\"bitbucket-oauth\":" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "\"consumer-key\":" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "\"consumer-secret\":" } }
