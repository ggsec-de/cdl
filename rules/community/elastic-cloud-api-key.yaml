schema_version: 1
id: "cortex.community:elastic-cloud-api-key"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Elastic Cloud API Key Detection"
  description: "Detects Elastic Cloud API keys used for programmatic access to the Elastic Cloud and serverless APIs. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.elastic.co/docs/deploy-manage/api-keys/elastic-cloud-api-keys"
  cwes: [522]
  tags: ["elastic", "exposure", "tokens", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "High"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "essu_" } }
      - regex: { left: { ref: "steps.probe0.body" }, right: { value: "essu_[A-Za-z0-9+/]{80}AAAAA[A-Za-z0-9+/=]{7}" } }
