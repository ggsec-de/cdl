schema_version: 1
id: "cortex.community:ivanti-traffic-manager-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Ivanti Traffic Manager Panel - Detect"
  description: "An Ivanti Traffic Manager Login Panel was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.ivanti.com/resources/v/doc/ivi/2528/2ef03e8ed03d"
  tags: ["detect", "traffic-manager", "panel", "login", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/apps/zxtm/login.cgi" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Login (Virtual Traffic Manager" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
