schema_version: 1
id: "cortex.community:webalizer-xtended-stats"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Webalizer Xtended Statistics Exposed"
  description: "Webalizer Xtended Statistics is exposed. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.patrickfrei.ch/webalizer/"
  tags: ["exposure", "stats", "webalizer", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Low"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/usage/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)<TITLE>Webalizer</TITLE>" } }
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)SRC=menu\\.html" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
