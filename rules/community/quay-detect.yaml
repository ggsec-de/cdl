schema_version: 1
id: "cortex.community:quay-detect"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Quay - Detect"
  description: "Quay is a container image registry for building, storing, and distributing container images. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.redhat.com/en/technologies/cloud-computing/quay"
    - "https://github.com/quay/quay"
  tags: ["tech", "quay", "detect", "registry", "container", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<html ng-app=\"quay\"" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "/static/img/quay_favicon.png" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "window.__endpoints" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
