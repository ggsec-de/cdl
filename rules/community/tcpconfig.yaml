schema_version: 1
id: "cortex.community:tcpconfig"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Rockwell Automation TCP/IP Configuration Information - Detect"
  description: "TCP/IP configuration information was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.rockwellautomation.com/"
    - "https://www.exploit-db.com/ghdb/6782"
  cwes: [200]
  tags: ["config", "edb", "logs", "misconfig", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Medium"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/tcpconfig.html" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "TCP/IP Configuration" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
