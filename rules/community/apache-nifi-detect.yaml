schema_version: 1
id: "cortex.community:apache-nifi-detect"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Apache NiFi detect"
  description: "Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  tags: ["tech", "apache", "nifi", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/access/config" }
  - id: "probe1"
    request: { method: "GET", path: "/controller/config" }
  - id: "probe2"
    request: { method: "GET", path: "/controller/registry-clients" }
  - id: "probe3"
    request: { method: "GET", path: "/counters" }
  - id: "probe4"
    request: { method: "GET", path: "/flow/registries" }
  - id: "probe5"
    request: { method: "GET", path: "/system-diagnostics" }
  - id: "probe6"
    request: { method: "GET", path: "/nifi-api/access/config" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - any:
              - regex: { left: { ref: "steps.probe0.body" }, right: { value: "supportsLogin" } }
              - regex: { left: { ref: "steps.probe0.body" }, right: { value: "disconnectedNodeAcknowledged" } }
              - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(aggregate|node)Snapshots?" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - any:
              - regex: { left: { ref: "steps.probe1.body" }, right: { value: "supportsLogin" } }
              - regex: { left: { ref: "steps.probe1.body" }, right: { value: "disconnectedNodeAcknowledged" } }
              - regex: { left: { ref: "steps.probe1.body" }, right: { value: "(aggregate|node)Snapshots?" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
      - all:
          - any:
              - regex: { left: { ref: "steps.probe2.body" }, right: { value: "supportsLogin" } }
              - regex: { left: { ref: "steps.probe2.body" }, right: { value: "disconnectedNodeAcknowledged" } }
              - regex: { left: { ref: "steps.probe2.body" }, right: { value: "(aggregate|node)Snapshots?" } }
          - eq: { left: { ref: "steps.probe2.status" }, right: { value: 200 } }
      - all:
          - any:
              - regex: { left: { ref: "steps.probe3.body" }, right: { value: "supportsLogin" } }
              - regex: { left: { ref: "steps.probe3.body" }, right: { value: "disconnectedNodeAcknowledged" } }
              - regex: { left: { ref: "steps.probe3.body" }, right: { value: "(aggregate|node)Snapshots?" } }
          - eq: { left: { ref: "steps.probe3.status" }, right: { value: 200 } }
      - all:
          - any:
              - regex: { left: { ref: "steps.probe4.body" }, right: { value: "supportsLogin" } }
              - regex: { left: { ref: "steps.probe4.body" }, right: { value: "disconnectedNodeAcknowledged" } }
              - regex: { left: { ref: "steps.probe4.body" }, right: { value: "(aggregate|node)Snapshots?" } }
          - eq: { left: { ref: "steps.probe4.status" }, right: { value: 200 } }
      - all:
          - any:
              - regex: { left: { ref: "steps.probe5.body" }, right: { value: "supportsLogin" } }
              - regex: { left: { ref: "steps.probe5.body" }, right: { value: "disconnectedNodeAcknowledged" } }
              - regex: { left: { ref: "steps.probe5.body" }, right: { value: "(aggregate|node)Snapshots?" } }
          - eq: { left: { ref: "steps.probe5.status" }, right: { value: 200 } }
