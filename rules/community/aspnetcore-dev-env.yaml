schema_version: 1
id: "cortex.community:aspnetcore-dev-env"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "ASP.NET Core Development Environment - Exposure"
  description: "The ASP.NET Core application is running in Development mode, which could exposes detailed error messages and stack traces on the '/Error' page. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://docs.microsoft.com/en-us/aspnet/core/fundamentals/environments"
  tags: ["misconfig", "aspnetcore", "exposure", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/Error" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<strong>ASPNETCORE_ENVIRONMENT</strong> environment variable to <strong>Development</strong>" } }
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "ASPNETCORE_ENVIRONMENT" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<environment include=\"Development\">" } }
