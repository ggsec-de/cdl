schema_version: 1
id: "cortex.community:ptc-thingworx-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "PTC ThingWorx - Panel"
  description: "PTC ThingWorx is an Industrial IoT (IIoT) platform for building and deploying connected industrial applications, machine monitoring, and remote service solutions. Exposed instances may provide unauthenticated access to IIoT dashboards and connected device management interfaces. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.ptc.com/en/products/thingworx"
  tags: ["panel", "ics", "iot", "ptc", "thingworx", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - any:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>Thingworx</title>" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "/Thingworx/Home" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "thingworx.com" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
