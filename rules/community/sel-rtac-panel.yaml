schema_version: 1
id: "cortex.community:sel-rtac-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "SEL Real-Time Automation Controller - Login Panel"
  description: "Schweitzer Engineering Laboratories (SEL) Real-Time Automation Controller (RTAC) is a programmable automation controller used in electric utility and industrial automation environments for protection, control, and automation. The web interface exposes a management panel for configuration and monitoring. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://selinc.com/products/3530/"
    - "https://selinc.com/products/3555/"
  tags: ["panel", "scada", "ics", "sel", "rtac", "schweitzer", "energy", "utilities", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - any:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>SEL-RTAC</title>" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "selinc.com" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "SEL-RTAC" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
