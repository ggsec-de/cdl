schema_version: 1
id: "cortex.community:rails-database-config"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Ruby on Rails Database Configuration File - Detect"
  description: "Ruby on Rails database configuration file was detected, which may contain database credentials. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://guides.rubyonrails.org/configuring.html#configuring-a-database"
  cwes: [200]
  tags: ["config", "exposure", "rails", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "High"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/config/database.yml" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "adapter:" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "database:" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "production:" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
