schema_version: 1
id: "cortex.community:apache-allura-detect"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Apache Allura - Detection"
  description: "Detects a Apache Allura server, a open source implementation of a software \"forge\". Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://allura.apache.org/"
  tags: ["tech", "allura", "apache", "detect", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/neighborhood" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>All Neighborhoods</title>" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: ">Apache Allura</a>" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
