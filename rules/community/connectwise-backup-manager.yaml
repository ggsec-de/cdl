schema_version: 1
id: "cortex.community:connectwise-backup-manager"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "ConnectWise Server Backup Manager SE Panel - Detect"
  description: "ConnectWise Server Backup Manager SE login panel was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.connectwise.com/company/trust/security-bulletins/r1soft-and-recover-security-bulletin"
  cwes: [200]
  tags: ["panel", "connectwise", "backup", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/login.zul" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Server Backup Manager SE" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
