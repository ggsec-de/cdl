schema_version: 1
id: "cortex.community:emlog-installer"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Emlog Pro - Installation"
  description: "Emlog Pro Installation page has been exposed. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  tags: ["emlog", "install", "misconfig", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "High"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/install.php" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)>MySQL" } }
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)install\\.php\\?action=install" } }
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)emlog" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
