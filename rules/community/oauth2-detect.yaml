schema_version: 1
id: "cortex.community:oauth2-detect"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "OAuth 2.0 Authorization Server Detection Template"
  description: "Try to detect OAuth 2.0 Authorization Server via the \"oauth/token\" endpoint Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  tags: ["tech", "oauth", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request:
      method: "POST"
      path: "/oauth/token"
      body: "grant_type=authorization_code&client_id=xxx&redirect_uri=https%3A%2F%2Fprojectdiscovery.io&code=xxx&client_secret=xxx"
proof:
  kind: "signal.v1"
  assertions:
    all:
      - any:
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 401 } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 400 } }
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "error\":\"invalid_client\"" } }
