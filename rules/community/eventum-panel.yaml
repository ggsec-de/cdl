schema_version: 1
id: "cortex.community:eventum-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Eventum Login Panel - Detect"
  description: "Eventum login panel was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  cwes: [200]
  tags: ["panel", "eventum", "mysql", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - any:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>Login - Eventum</title>" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "title=\"Eventum Issues search\"" } }
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Database Error:" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "There seems to be a problem connecting to the database server specified in your configuration file" } }
