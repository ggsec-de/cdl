schema_version: 1
id: "cortex.community:cinny-detect"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Cinny - Detect"
  description: "Cinny is an open-source web client for the Matrix protocol. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://cinny.in/"
    - "https://github.com/cinnyapp/cinny"
  tags: ["cinny", "matrix", "chat", "messaging", "tech", "detect", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>Cinny</title>" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "A Matrix client where you can enjoy the conversation" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "name=\"application-name\" content=\"Cinny\"" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
