schema_version: 1
id: "cortex.community:osticket-installer"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "osTicket Installer Panel - Detect"
  description: "osTicket installer panel was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  cwes: [284]
  tags: ["misconfig", "install", "exposure", "osticket", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "High"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/upload/setup/install.php" }
  - id: "probe1"
    request: { method: "GET", path: "/setup/install.php" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>osTicket Installer" } }
          - not:
              contains: { left: { ref: "steps.probe0.body" }, right: { value: "already installed" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - contains: { left: { ref: "steps.probe1.body" }, right: { value: "<title>osTicket Installer" } }
          - not:
              contains: { left: { ref: "steps.probe1.body" }, right: { value: "already installed" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
