schema_version: 1
id: "cortex.community:gerrit-account-enum"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Gerrit Code Review - Account Enumeration"
  description: "Gerrit Code Review exposes the /accounts/ REST API endpoint which can be used to enumerate user accounts.The endpoint allows querying for accounts by username, email, or name, potentially revealing sensitive user information including account IDs, names, emails, and usernames without authentication. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://gerrit-review.googlesource.com/Documentation/rest-api-accounts.html"
    - "https://gerrit-documentation.storage.googleapis.com/Documentation/2.11/rest-api-accounts.html"
  tags: ["gerrit", "enum", "exposure", "misconfig", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Medium"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/accounts/?q=a&n=10" }
  - id: "probe1"
    request: { method: "GET", path: "/accounts/?suggest&q=a&n=10" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - all:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "_account_id" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "username" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - all:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "_account_id" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "username" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
