schema_version: 1
id: "cortex.community:cradlepoint-gateway-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "CradlePoint Gateway - Login Panel"
  description: "CradlePoint (an Ericsson company) produces cellular-connected SD-WAN and VPN gateway appliances. The web administration interface is commonly exposed on port 8080. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://cradlepoint.com/products/netcloud-manager/"
  tags: ["panel", "cradlepoint", "gateway", "vpn", "router", "detect", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - any:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "CradlePoint" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "cradlepoint.com" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
