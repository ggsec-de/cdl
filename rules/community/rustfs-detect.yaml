schema_version: 1
id: "cortex.community:rustfs-detect"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Rustfs - Detect"
  description: "Detects a Rustfs server, a high-performance, distributed object storage system built in Rust. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://github.com/rustfs/rustfs"
  tags: ["tech", "rustfs", "rustfs", "detect", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/rustfs/console/auth/login" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - any:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>RustFS</title>" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "title\":\"RustFS" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "/rustfs/console/_nuxt" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
