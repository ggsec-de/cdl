schema_version: 1
id: "cortex.community:flask-debug-toolbar"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Flask Debug Toolbar - Exposure"
  description: "Detected Flask Debug Toolbar was exposed in production, potentially leaking sensitive application information, SQL queries, request data, and configuration details. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://flask-debugtoolbar.readthedocs.io/"
    - "https://github.com/flask-debugtoolbar/flask-debugtoolbar"
  cwes: [200]
  tags: ["flask", "python", "debug", "toolbar", "exposure", "misconfig", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Medium"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - any:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "flDebugToolbar" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "flDebugPanelList" } }
      - any:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "/_debug_toolbar/" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "flDebugVersionPanel" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "DEBUG_TOOLBAR_STATIC_PATH" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
