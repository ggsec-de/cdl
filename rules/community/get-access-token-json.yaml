              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "\"access_token\":" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "\"token_type\":" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - all:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "\"access_token\":" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "\"token_type\":" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
