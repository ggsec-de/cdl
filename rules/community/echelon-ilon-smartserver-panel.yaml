schema_version: 1
id: "cortex.community:echelon-ilon-smartserver-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Echelon i.LON SmartServer - Login Panel"
  description: "Echelon (now Adesto/Dialog Semiconductor) i.LON SmartServer is a LonWorks/IP-852 building automation controller used in HVAC, lighting, and energy management systems. The embedded web interface is frequently exposed on standard and non-standard ports. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.echelon.com/products/ilon-smartserver/"
  tags: ["panel", "echelon", "ilon", "lonworks", "scada", "ics", "ot", "building-automation", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - any:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "i.LON SmartServer" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Echelon" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "SmartServer" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
