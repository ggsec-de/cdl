schema_version: 1
id: "cortex.community:sftp-deployment-config"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Atom SFTP Configuration File - Detect"
  description: "Atom SFTP deployment configuration file was detected. File contains server details and credentials. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://atom.io/packages/sftp-deployment"
  cwes: [200]
  tags: ["sftp", "atom", "config", "exposure", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "High"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/deployment-config.json" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "\"host\":" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "\"username\":" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "\"password\":" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "\"remotePath\":" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
