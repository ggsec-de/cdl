schema_version: 1
id: "cortex.community:google-services-json"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Google Service Json"
  description: "google-services.json internal file is exposed. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.exploit-db.com/ghdb/6886"
  tags: ["google", "cloud", "exposure", "files", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Low"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/google-services.json" }
  - id: "probe1"
    request: { method: "GET", path: "/app/google-services.json" }
  - id: "probe2"
    request: { method: "GET", path: "/android/app/google-services.json" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - all:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "storage_bucket" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "oauth_client" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - all:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "storage_bucket" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "oauth_client" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
      - all:
          - all:
              - contains: { left: { ref: "steps.probe2.body" }, right: { value: "storage_bucket" } }
              - contains: { left: { ref: "steps.probe2.body" }, right: { value: "oauth_client" } }
          - eq: { left: { ref: "steps.probe2.status" }, right: { value: 200 } }
