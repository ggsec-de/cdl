schema_version: 1
id: "cortex.community:ghe-encrypt-saml"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "GitHub Enterprise - Encrypted SAML"
  description: "This template checks if Encrypted SAML (Security Assertion Markup Language) is enabled on a GitHub Enterprise instance. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://docs.github.com/en/enterprise-server@3.10/admin/managing-iam/using-saml-for-enterprise-iam/enabling-encrypted-assertions"
  tags: ["github", "ghe", "saml", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/saml/metadata" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "EntityDescriptor" } }
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "KeyDescriptor" } }
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "use=\"encryption\"" } }
