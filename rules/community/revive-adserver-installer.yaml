schema_version: 1
id: "cortex.community:revive-adserver-installer"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Revive Adserver - Exposed Installer"
  description: "Detected exposed Revive Adserver installation wizard that allows unauthorized installation and configuration. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://github.com/revive-adserver/revive-adserver"
    - "https://www.revive-adserver.com/support/installation/"
    - "https://documentation.revive-adserver.com/"
  tags: ["misconfig", "revive", "adserver", "exposure", "unauth", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "High"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/www/admin/install.php?action=welcome" }
  - id: "probe1"
    request: { method: "GET", path: "/admin/install.php?action=welcome" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - all:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Installing Revive Adserver" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "installer" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - all:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "Installing Revive Adserver" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "installer" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
