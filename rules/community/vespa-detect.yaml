schema_version: 1
id: "cortex.community:vespa-detect"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Vespa - Detect"
  description: "Vespa, an open-source big-data serving engine used for low-latency search, recommendation, and vector/embedding retrieval, increasingly deployed as the retrieval backend in AI and RAG (retrieval-augmented generation) pipelines, was detected. Exposed config-server or container endpoints could have leaked application deployment metadata, cluster status, and version information, and may have allowed unauthenticated access to indexed/vectorized data if the query API was left open. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://vespa.ai/"
    - "https://github.com/vespa-engine/vespa"
    - "https://docs.vespa.ai/en/reference/state-v1.html"
  tags: ["tech", "vespa", "ai", "vector-db", "search", "detect", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/ApplicationStatus" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "\"vespa\"" } }
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "\"version\"" } }
