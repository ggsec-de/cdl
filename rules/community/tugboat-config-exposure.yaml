schema_version: 1
id: "cortex.community:tugboat-config-exposure"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Tugboat Configuration File Exposure"
  description: "A Tugboat configuration file was discovered. Tugboat is a command line tool for interacting with DigitalOcean droplets. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://github.com/petems/tugboat"
    - "https://www.digitalocean.com/community/tools/tugboat"
  tags: ["tugboat", "config", "exposure", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Critical"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/.tugboat" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "authentication" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "access_token" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "ssh_user" } }
