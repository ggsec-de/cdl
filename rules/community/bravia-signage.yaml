schema_version: 1
id: "cortex.community:bravia-signage"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "BRAVIA Signage - Exposure"
  description: "Bravia Signage is exposed. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://twitter.com/WhiteOakSec/status/1667197552461004800"
    - "https://www.whiteoaksecurity.com/blog/sony-bravia-remote-code-execution-disclosure/"
  tags: ["misconfig", "exposure", "bravia", "sony", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Medium"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/#/settings" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "BRAVIA Signage" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
