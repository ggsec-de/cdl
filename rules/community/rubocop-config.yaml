schema_version: 1
id: "cortex.community:rubocop-config"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Rubocop Configuration - Detect"
  description: "Rubocop configuration information was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://raw.githubusercontent.com/maurosoria/dirsearch/master/db/dicc.txt"
    - "https://github.com/rubocop/rubocop"
  cwes: [200]
  tags: ["exposure", "files", "config", "ruby", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/.rubocop.yml" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "AllCops:" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Include:" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Exclude:" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
