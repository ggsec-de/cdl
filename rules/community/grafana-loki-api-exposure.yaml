schema_version: 1
id: "cortex.community:grafana-loki-api-exposure"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Grafana Loki - Unauthenticated API Access"
  description: "Grafana Loki API is accessible without authentication, allowing unauthorized access to log streams. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://grafana.com/docs/loki/latest/operations/authentication/"
    - "https://grafana.com/docs/loki/latest/reference/loki-http-api/"
  tags: ["exposure", "loki", "grafana", "unauth", "misconfig", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Medium"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/loki/api/v1/labels" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "\"status\":\"success\"" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
