schema_version: 1
id: "cortex.community:jellyfin-detect"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Jellyfin detected"
  description: "Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  tags: ["tech", "jellyfin", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/home.html" }
  - id: "probe1"
    request: { method: "GET", path: "/web/home.html" }
  - id: "probe2"
    request: { method: "GET", path: "/index.html" }
  - id: "probe3"
    request: { method: "GET", path: "/web/index.html" }
  - id: "probe4"
    request: { method: "GET", path: "/web/manifest.json" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - any:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "name=\"application-name\" content=\"Jellyfin\"" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "class=\"page homePage libraryPage allLibraryPage backdropPage pageWithAbsoluteTabs withTabs\"" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "The Free Software Media System" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
