schema_version: 1
id: "cortex.community:glitchtip-public-signup"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Gitea Public Registration Enabled"
  description: "A misconfiguration in GlitchTip allows arbitrary users to sign up. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://glitchtip.com/documentation/install"
  tags: ["misconfig", "glitchtip", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Medium"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/api/settings/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "\"enableUserRegistration\": true" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "enableSocialAppsUserRegistration" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
