schema_version: 1
id: "cortex.community:arcgis-api-service"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "ArcGIS REST Services Directory - Detect"
  description: "Check for the existence of the \"/arcgis/rest/services\" path on an ArcGIS server. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://enterprise.arcgis.com/en/"
  tags: ["panel", "arcgis", "rest", "api", "detect", "esri", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/arcgis/rest/services" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "REST Services Directory" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "ArcGIS" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
