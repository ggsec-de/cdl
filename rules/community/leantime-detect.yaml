schema_version: 1
id: "cortex.community:leantime-detect"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Leantime - Detect"
  description: "Detects a Leantime server, a project management system for non-project managers. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://github.com/Leantime/leantime"
  tags: ["tech", "leantime", "detect", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/auth/login" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - any:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "content=\"Leantime" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "name=\"leantime-version" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "window.leantime.currentProject" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: ".leantimeLogo {" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "class=\"leantimeLogo" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
