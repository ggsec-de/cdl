schema_version: 1
id: "cortex.community:google-api-private-key"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Google Api Private Key"
  description: "Google API private keys are exposed in files. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.exploit-db.com/ghdb/6037"
  tags: ["exposure", "cloud", "google", "devops", "files", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Medium"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/google-api-private-key.json" }
  - id: "probe1"
    request: { method: "GET", path: "/app/config/pimcore/google-api-private-key.json" }
  - id: "probe2"
    request: { method: "GET", path: "/pimcore/app/config/pimcore/google-api-private-key.json" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - all:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "private_key_id" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "private_key" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - all:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "private_key_id" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "private_key" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
      - all:
          - all:
              - contains: { left: { ref: "steps.probe2.body" }, right: { value: "private_key_id" } }
              - contains: { left: { ref: "steps.probe2.body" }, right: { value: "private_key" } }
          - eq: { left: { ref: "steps.probe2.status" }, right: { value: 200 } }
