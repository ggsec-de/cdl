schema_version: 1
id: "cortex.community:openmetadata-detect"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "OpenMetadata - Detect"
  description: "Detects a OpenMetadata server, a unified metadata platform for data discovery, data observability, and data governance powered by a central metadata repository, in-depth column level lineage, and seamless team collaboration. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://github.com/open-metadata/OpenMetadata"
  tags: ["tech", "openmetadata", "detect", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - any:
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)<title>OpenMetadata" } }
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)content=\"OpenMetadata" } }
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)/openmetadata\\.bundle" } }
      - any:
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 404 } }
