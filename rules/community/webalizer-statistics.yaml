schema_version: 1
id: "cortex.community:webalizer-statistics"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Webalizer Statistics Information Disclosure"
  description: "The remote host is running the Webalizer Report generator. Webalizer parses web logs and gives a potential attacker information regarding hosts that have accessed the server, resources accessed, total statistics for the Web server, version of Web server, and more. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.rapid7.com/db/vulnerabilities/spider-webalizer-stats-disclosure"
    - "https://www.tenable.com/plugins/nnm/2506"
  tags: ["webalizer", "logs", "statistics", "tenable", "misconfig", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Low"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
  - id: "probe1"
    request: { method: "GET", path: "/stats/index.html" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - all:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Generated by The Webalizer" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Usage Statistics" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - all:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "Generated by The Webalizer" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "Usage Statistics" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
