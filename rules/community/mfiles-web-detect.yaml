schema_version: 1
id: "cortex.community:mfiles-web-detect"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "M-Files Web Login Panel - Detect"
  description: "M-Files Web login panel was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.m-files.com/about/trust-center/security-advisories/"
  cwes: [200]
  tags: ["panel", "m-files", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
  - id: "probe1"
    request: { method: "GET", path: "/Login.aspx" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - any:
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "<title>(.*)M-Files Web(.*)</title>" } }
          - any:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "M-Files user" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "M-Files authentication" } }
      - any:
          - regex: { left: { ref: "steps.probe1.body" }, right: { value: "<title>(.*)M-Files Web(.*)</title>" } }
          - any:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "M-Files user" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "M-Files authentication" } }
