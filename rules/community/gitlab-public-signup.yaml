schema_version: 1
id: "cortex.community:gitlab-public-signup"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "GitLab public signup"
  description: "Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  tags: ["gitlab", "misconfig", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/users/sign_in" }
  - id: "probe1"
    request: { method: "GET", path: "/users/sign_up" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - any:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<a data-qa-selector=\"register_link\" href=\"/users/sign_up\">Register now</a>" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "data-qa-selector=\"new_user_register_button\"" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "https://about.gitlab.com" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
          - not:
              contains: { left: { ref: "steps.probe0.body" }, right: { value: "<meta content=\"GitLab.com\" property=\"og:description\">" } }
      - all:
          - any:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "<a data-qa-selector=\"register_link\" href=\"/users/sign_up\">Register now</a>" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "data-qa-selector=\"new_user_register_button\"" } }
          - contains: { left: { ref: "steps.probe1.body" }, right: { value: "https://about.gitlab.com" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
          - not:
              contains: { left: { ref: "steps.probe1.body" }, right: { value: "<meta content=\"GitLab.com\" property=\"og:description\">" } }
