schema_version: 1
id: "cortex.community:paperclip-detect"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Paperclip - Detect"
  description: "Paperclip is an open-source app for managing AI agents at work. It orchestrates a team of AI agents from a single dashboard. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://paperclip.ing"
    - "https://github.com/paperclipai/paperclip"
  tags: ["paperclip", "tech", "detect", "discovery", "ai", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>Paperclip</title>" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "PAPERCLIP_RUNTIME_BRANDING_START" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "paperclip.theme" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
