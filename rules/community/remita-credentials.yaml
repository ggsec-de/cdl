schema_version: 1
id: "cortex.community:remita-credentials"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Remita Merchant ID & API Key - Exposure"
  description: "Detected exposed Remita merchant IDs, API keys, and secret hashes in application source code, configuration files, or publicly accessible assets. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://api.remita.net/"
  tags: ["exposure", "remita", "fintech", "tinlance", "lloydcoder", "token", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Low"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - regex: { left: { ref: "steps.probe0.body" }, right: { value: "merchantId[\"']?\\s*[:=]\\s*[\"']?\\d{10,}[\"']?" } }
      - any:
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)remita" } }
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)merchantId" } }
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)publicKey" } }
