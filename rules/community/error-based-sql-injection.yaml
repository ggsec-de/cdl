schema_version: 1
id: "cortex.community:error-based-sql-injection"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Error based SQL injection"
  description: "A SQL injection vulnerability was identified based on an error message returned by the server. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  cwes: [89]
  tags: ["sqli", "generic", "error", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Critical"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/'" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - not:
          contains: { left: { ref: "steps.probe0.body" }, right: { value: "Adminer" } }
      - any:
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "SQL syntax.{0,200}?MySQL" } }
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "Warning.{0,200}?\\Wmysqli?_" } }
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "MySQLSyntaxErrorException" } }
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "valid MySQL result" } }
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "check the manual that (corresponds to|fits) your MySQL server version" } }
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "Unknown column '[^ ]+' in 'field list'" } }
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "MySqlClient\\." } }
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "com\\.mysql\\.jdbc" } }
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "Zend_Db_(Adapter|Statement)_Mysqli_Exception" } }
