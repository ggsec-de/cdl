schema_version: 1
id: "cortex.community:spring-eureka"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Spring Eureka Exposure"
  description: "Spring Eureka is exposed. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  tags: ["misconfig", "springboot", "exposure", "eureka", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Low"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Eureka" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Toggle navigation" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Last 1000 since startup" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
