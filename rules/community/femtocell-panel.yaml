schema_version: 1
id: "cortex.community:femtocell-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Femtocell Access Point Panel - Detect"
  description: "Femtocell Access Point panel was discovered. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://en.wikipedia.org/wiki/Femtocell"
    - "https://www.facebook.com/photo/?fbid=844447314392456&set=a.467014098802448"
  tags: ["femtocell", "network", "panel", "login", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/index.html" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Femtocell Access Point" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
