schema_version: 1
id: "cortex.community:openboxes-detect"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "OpenBoxes - Detect"
  description: "OpenBoxes open-source supply chain management system for healthcare organisations was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://openboxes.com/"
    - "https://github.com/openboxes/openboxes"
  tags: ["tech", "openboxes", "scm", "healthcare", "detect", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/openboxes/auth/login" }
  - id: "probe1"
    request: { method: "GET", path: "/auth/login" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - all:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "openboxes.css" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "id=\"loginContainer\"" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - all:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "openboxes.css" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "id=\"loginContainer\"" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
