schema_version: 1
id: "cortex.community:lacie-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "LaCie Login Panel - Detect"
  description: "LaCie login panel was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.exploit-db.com/ghdb/7118"
  cwes: [200]
  tags: ["panel", "lacie", "login", "edb", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
  - id: "probe1"
    request: { method: "GET", path: "/dashboard/" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "id_LaCie" } }
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?m)<title>([a-zA-Z0-9&#; ]|)+Dashboard<\\/title>$" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - contains: { left: { ref: "steps.probe1.body" }, right: { value: "id_LaCie" } }
          - regex: { left: { ref: "steps.probe1.body" }, right: { value: "(?m)<title>([a-zA-Z0-9&#; ]|)+Dashboard<\\/title>$" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
