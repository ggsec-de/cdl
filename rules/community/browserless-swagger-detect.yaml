schema_version: 1
id: "cortex.community:browserless-swagger-detect"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Browserless API Swagger - Detect"
  description: "Detects exposed Browserless API Swagger UI interface. Browserless is a headless browser automation service that provides REST APIs for Chrome/Chromium-based browser operations including screenshots, PDFs, and web scraping. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://github.com/browserless/browserless"
    - "https://docs.browserless.io/"
  tags: ["tech", "browserless", "swagger", "api", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/docs/swagger-ui-init.js" }
  - id: "probe1"
    request: { method: "GET", path: "/docs" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - all:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "browserless/chrome API" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "browserless Swagger documentation" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - contains: { left: { ref: "steps.probe1.body" }, right: { value: "<title>Swagger UI" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
