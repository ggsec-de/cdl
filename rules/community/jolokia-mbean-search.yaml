schema_version: 1
id: "cortex.community:jolokia-mbean-search"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Jolokia - Searching MBeans"
  description: "Unauth users can search Mbeans in Jolokia. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://thinkloveshare.com/hacking/ssrf_to_rce_with_jolokia_and_mbeans/"
    - "https://github.com/laluka/jolokia-exploitation-toolkit"
  tags: ["jolokia", "springboot", "mbean", "tomcat", "misconfig", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Low"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/jolokia/search/*:test=test" }
  - id: "probe1"
    request: { method: "GET", path: "/actuator/jolokia/search/*:test=test" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
          - all:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "\"type\":\"search\"" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "\"value\":" } }
      - all:
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
          - all:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "\"type\":\"search\"" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "\"value\":" } }
