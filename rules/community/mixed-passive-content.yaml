schema_version: 1
id: "cortex.community:mixed-passive-content"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Mixed Passive Content"
  description: "This check detects if there are any passive content being loaded over HTTP instead of HTTPS. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://developer.mozilla.org/en-US/docs/Web/Security/Mixed_content"
    - "https://portswigger.net/kb/issues/01000400_mixed-content"
    - "https://resources.infosecinstitute.com/topics/vulnerabilities/https-mixed-content-vulnerability/"
    - "https://docs.gitlab.com/ee/user/application_security/dast/checks/319.1.html"
  tags: ["misconfig", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - regex: { left: { ref: "steps.probe0.body" }, right: { value: "<img[^>]*src=['\"]http://[^'\">]+['\"]" } }
      - regex: { left: { ref: "steps.probe0.body" }, right: { value: "<audio[^>]*src=['\"]http://[^'\">]+['\"]" } }
      - regex: { left: { ref: "steps.probe0.body" }, right: { value: "<video[^>]*src=['\"]http://[^'\">]+['\"]" } }
