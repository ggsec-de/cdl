schema_version: 1
id: "cortex.community:solar-log-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Solar-Log - Monitoring Panel"
  description: "Solar-Log is a solar plant monitoring system by Solare Datensysteme GmbH (Germany) used for PV system monitoring, yield optimisation, and fault detection. The web interface is commonly exposed on port 80, 81, or non-standard ports. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.solar-log.com/"
  tags: ["panel", "solar-log", "solar", "energy", "ics", "monitoring", "ot", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - any:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Solar-Log" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "solar-log.com" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Solar-Log™" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
