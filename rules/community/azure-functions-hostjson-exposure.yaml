schema_version: 1
id: "cortex.community:azure-functions-hostjson-exposure"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Azure Functions host.json Configuration Exposure"
  description: "Detected exposed Azure Functions host.json configuration files. The exposed metadata revealed sensitive runtime, logging, extension, and infrastructure settings that could aid attackers in understanding the application architecture. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  tags: ["azure", "config", "exposure", "misconfig", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Medium"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/host.json" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "\"version\"" } }
      - any:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "\"extensionBundle\"" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "\"functionTimeout\"" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "\"logging\"" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "\"extensions\"" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "\"healthMonitor\"" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "\"singleton\"" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "\"concurrency\"" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "\"Microsoft.Azure.Functions.ExtensionBundle\"" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
