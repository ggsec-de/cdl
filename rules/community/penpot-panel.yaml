schema_version: 1
id: "cortex.community:penpot-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Penpot - Login Panel"
  description: "Penpot is an open-source design and prototyping platform. The web interface was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://help.penpot.app/technical-guide/getting-started/"
  tags: ["panel", "penpot", "design", "oss", "detect", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - any:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>Penpot" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: ".penpotVersion" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "penpotBuildDate" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "penpotWorkerURI" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "penpotTranslations" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "content=\"Penpot" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
