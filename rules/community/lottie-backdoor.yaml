schema_version: 1
id: "cortex.community:lottie-backdoor"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Lottie Player - Backdoor"
  description: "Detectes vulnerable compormised version of lottie-player JS Library that were compormised with a Web3 wallet pop-up backdoor. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://github.com/LottieFiles/lottie-player/issues/254"
    - "https://x.com/galnagli/status/1851779972639363076"
  tags: ["cdn", "lottie-player", "backdoor", "malware", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Critical"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "lottie-player@2.0.5" } }
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "lottie-player@2.0.6" } }
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "lottie-player@2.0.7" } }
