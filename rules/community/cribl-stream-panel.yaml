schema_version: 1
id: "cortex.community:cribl-stream-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Cribl Stream - Login Panel"
  description: "Cribl Stream, formerly known as Cribl LogStream, web interface was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://docs.cribl.io/stream/"
  tags: ["panel", "cribl", "stream", "logstream", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - any:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>Cribl LogStream</title>" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>Cribl Stream</title>" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>Cribl</title>" } }
      - any:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "stream.ico" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "window.CRIBL" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "static/css/main-light.css" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
