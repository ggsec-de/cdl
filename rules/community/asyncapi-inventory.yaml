              - regex: { left: { ref: "steps.probe5.body" }, right: { value: "(?i)\"asyncapi\"\\s*:\\s*\"([0-9.]+)\"" } }
          - eq: { left: { ref: "steps.probe5.status" }, right: { value: 200 } }
