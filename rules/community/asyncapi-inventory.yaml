schema_version: 1
id: "cortex.community:asyncapi-inventory"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "AsyncAPI Spec Inventory"
  description: "Detected publicly accessible AsyncAPI specification files (YAML/JSON), which might have exposed message channels, server endpoints, and security schemes. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.asyncapi.com/docs/reference/specification"
    - "https://raw.githubusercontent.com/asyncapi/spec/v2.6.0/examples/streetlights-kafka.yml"
  tags: ["exposure", "asyncapi", "api", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
  - id: "probe1"
    request: { method: "GET", path: "/asyncapi" }
  - id: "probe2"
    request: { method: "GET", path: "/asyncapi.yaml" }
  - id: "probe3"
    request: { method: "GET", path: "/asyncapi.yml" }
  - id: "probe4"
    request: { method: "GET", path: "/asyncapi.json" }
  - id: "probe5"
    request: { method: "GET", path: "/api/asyncapi" }
  - id: "probe6"
    request: { method: "GET", path: "/api/docs/asyncapi" }
  - id: "probe7"
    request: { method: "GET", path: "/docs/asyncapi" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - any:
              - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)\\basyncapi\\s*:\\s*['\"]?[0-9.]+" } }
              - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)\"asyncapi\"\\s*:\\s*\"([0-9.]+)\"" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - any:
              - regex: { left: { ref: "steps.probe1.body" }, right: { value: "(?i)\\basyncapi\\s*:\\s*['\"]?[0-9.]+" } }
              - regex: { left: { ref: "steps.probe1.body" }, right: { value: "(?i)\"asyncapi\"\\s*:\\s*\"([0-9.]+)\"" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
      - all:
          - any:
              - regex: { left: { ref: "steps.probe2.body" }, right: { value: "(?i)\\basyncapi\\s*:\\s*['\"]?[0-9.]+" } }
              - regex: { left: { ref: "steps.probe2.body" }, right: { value: "(?i)\"asyncapi\"\\s*:\\s*\"([0-9.]+)\"" } }
          - eq: { left: { ref: "steps.probe2.status" }, right: { value: 200 } }
      - all:
          - any:
              - regex: { left: { ref: "steps.probe3.body" }, right: { value: "(?i)\\basyncapi\\s*:\\s*['\"]?[0-9.]+" } }
              - regex: { left: { ref: "steps.probe3.body" }, right: { value: "(?i)\"asyncapi\"\\s*:\\s*\"([0-9.]+)\"" } }
          - eq: { left: { ref: "steps.probe3.status" }, right: { value: 200 } }
      - all:
          - any:
              - regex: { left: { ref: "steps.probe4.body" }, right: { value: "(?i)\\basyncapi\\s*:\\s*['\"]?[0-9.]+" } }
              - regex: { left: { ref: "steps.probe4.body" }, right: { value: "(?i)\"asyncapi\"\\s*:\\s*\"([0-9.]+)\"" } }
          - eq: { left: { ref: "steps.probe4.status" }, right: { value: 200 } }
      - all:
