schema_version: 1
id: "cortex.community:aem-osgi-bundles"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Adobe AEM Installed OSGI Bundles"
