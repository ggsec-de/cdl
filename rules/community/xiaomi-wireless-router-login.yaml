schema_version: 1
id: "cortex.community:xiaomi-wireless-router-login"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Xiaomi Wireless Router Admin Panel - Detect"
  description: "Xiaomi Wireless router admin panel was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.mi.com/shop/search?keyword=%E8%B7%AF%E7%94%B1%E5%99%A8"
  cwes: [200]
  tags: ["panel", "xiaomi", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/cgi-bin/luci/web" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - any:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>小米路由器</title>" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>Redmi路由器</title>" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
