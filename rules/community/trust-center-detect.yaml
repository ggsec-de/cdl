              - regex: { left: { ref: "steps.probe2.body" }, right: { value: "(?i)Powered\\ by\\ Safebase" } }
              - regex: { left: { ref: "steps.probe2.body" }, right: { value: "(?i)TrustShare\\ Overview" } }
              - regex: { left: { ref: "steps.probe2.body" }, right: { value: "(?i)static\\.vanta\\.com/static/entry\\-trust\\-report\\.js" } }
          - eq: { left: { ref: "steps.probe2.status" }, right: { value: 200 } }
