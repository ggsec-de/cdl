schema_version: 1
id: "cortex.community:weaver-getemdslist-disclosure"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Weaver E-cology getEmDsList Sensitive Information Disclosure"
  description: "Weaver E-cology10 contains a sensitive information disclosure vulnerability in the `/papi/em/transform/getEmDsList` endpoint. An unauthenticated attacker can access the endpoint to retrieve datasource-related information such as `dsKey`, `dsValue`, and `deleteType`. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://mp.weixin.qq.com/s/tZvq6vlbDO1_eQHvX-bQbQ"
  tags: ["weaver", "ecology", "ecology10", "disclosure", "exposure", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "High"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/papi/em/transform/getEmDsList" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "\"dsKey\":" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "\"deleteType\":" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "\"dsValue\":" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
