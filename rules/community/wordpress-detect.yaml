    request: { method: "GET", path: "/" }
  - id: "probe1"
    request: { method: "GET", path: "/wp-admin/install.php" }
  - id: "probe2"
    request: { method: "GET", path: "/feed/" }
  - id: "probe3"
    request: { method: "GET", path: "/?feed=rss2" }
proof:
