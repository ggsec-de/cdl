          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "name=\"generator\" content=\"wordpress" } }
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "<link[^>]+s\\d+\\.wp\\.com" } }
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "<!-- This site is optimized with the Yoast (?:WordPress )?SEO plugin v([\\d.]+) -" } }
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "<!--[^>]+WP-Super-Cache" } }
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "/wp-content/uploads/(.*)" } }
