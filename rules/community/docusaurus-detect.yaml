schema_version: 1
id: "cortex.community:docusaurus-detect"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Docusaurus - Detect"
  description: "Docusaurus is an open-source static site generator designed for documentation websites. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://docusaurus.io/"
    - "https://github.com/facebook/docusaurus"
  tags: ["tech", "docusaurus", "documentation", "static-site-generator", "detect", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - regex: { left: { ref: "steps.probe0.body" }, right: { value: "<meta name=\"generator\" content=\"Docusaurus v[0-9]+\\.[0-9]+" } }
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "name=\"docusaurus_locale\"" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "name=\"docusaurus_tag\"" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
