schema_version: 1
id: "cortex.community:fiftyone-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "FiftyOne Panel - Detect"
  description: "FiftyOne, an open-source dataset visualization and curation tool for computer vision workflows built by Voxel51, was detected. The app ships with no authentication by default, so any exposed instance directly served browsable dataset content (images, labels, metadata) to unauthenticated visitors. The instance was identified by matching its distinctive page title, meta description, and UI-specific element IDs. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://github.com/voxel51/fiftyone"
    - "https://docs.voxel51.com"
  tags: ["panel", "fiftyone", "ml", "ai", "computer-vision", "detect", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>FiftyOne</title>" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Explore, Analyze, Curate" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "id=\"colorModal\"" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
