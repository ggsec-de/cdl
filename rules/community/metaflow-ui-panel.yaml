schema_version: 1
id: "cortex.community:metaflow-ui-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Metaflow UI Panel - Detect"
  description: "Metaflow is an open-source ML platform created by Netflix for building and managing real-life data science projects. The Metaflow UI provides a web interface for monitoring and managing Metaflow runs and flows. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://github.com/Netflix/metaflow-ui"
    - "https://metaflow.org"
  tags: ["panel", "metaflow", "netflix", "mlops", "ai", "detect", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>Metaflow UI</title>" } }
      - any:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "webpackJsonpmetaflow-ui" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "metaflow-ui" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
