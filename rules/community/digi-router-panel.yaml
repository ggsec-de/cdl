schema_version: 1
id: "cortex.community:digi-router-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Digi International Router - Login Panel"
  description: "Digi International cellular routers expose a web management interface used in industrial IoT and remote connectivity applications. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.digi.com/products/networking/cellular-routers"
  tags: ["panel", "ics", "digi", "router", "industrial", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - any:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>Digi Router</title>" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "__meteor_runtime_config__" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "meteorRelease" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
