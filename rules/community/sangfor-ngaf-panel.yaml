schema_version: 1
id: "cortex.community:sangfor-ngaf-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Sangfor Next-Generation Application Firewall (NGAF) - Login Panel"
  description: "Sangfor NGAF is a next-generation application firewall and SSL VPN gateway by Sangfor Technologies. It is widely deployed in APAC and China-based enterprises. The management portal is frequently exposed on non-standard ports. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.sangfor.com/en/product/network-security/next-gen-application-firewall"
  tags: ["panel", "sangfor", "ngaf", "firewall", "vpn", "detect", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    contains: { left: { ref: "steps.probe0.body" }, right: { value: "SANGFOR | NGAF" } }
