schema_version: 1
id: "cortex.community:prometheus-unauth"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Prometheus Monitoring System - Unauthenticated"
  description: "Detects unauthenticated access to Prometheus Time Series Collection and Processing Server by checking for specific elements in the response from the `/graph` endpoint. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  tags: ["unauth", "prometheus", "misconfig", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "High"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/config" }
  - id: "probe1"
    request: { method: "GET", path: "/api/v1/status/config" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - all:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "global:" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "scrape_configs:" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "scrape_interval" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - all:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "global:" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "scrape_configs:" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "scrape_interval" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
