schema_version: 1
id: "cortex.community:redmine-settings"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Redmine settings.yml File Disclosure"
  description: "Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.exploit-db.com/ghdb/5796"
  tags: ["misconfig", "redmine", "devops", "files", "exposure", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/settings.yml" }
  - id: "probe1"
    request: { method: "GET", path: "/config/settings.yml" }
  - id: "probe2"
    request: { method: "GET", path: "/redmine/config/settings.yml" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - all:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "format:" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "default:" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Redmine" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - all:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "format:" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "default:" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "Redmine" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
      - all:
          - all:
              - contains: { left: { ref: "steps.probe2.body" }, right: { value: "format:" } }
              - contains: { left: { ref: "steps.probe2.body" }, right: { value: "default:" } }
              - contains: { left: { ref: "steps.probe2.body" }, right: { value: "Redmine" } }
          - eq: { left: { ref: "steps.probe2.status" }, right: { value: 200 } }
