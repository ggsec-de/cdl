schema_version: 1
id: "cortex.community:joomla-file-listing"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Joomla! Database File List"
  description: "A Joomla! database directory /libraries/joomla/database/ was found exposed and has directory indexing enabled. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.exploit-db.com/ghdb/6377"
  cwes: [548]
  tags: ["exposure", "joomla", "listing", "database", "edb", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Medium"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/libraries/joomla/database/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Index of /libraries/joomla/database" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Parent Directory" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
