schema_version: 1
id: "cortex.community:janitza-gridvis-detect"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Janitza GridVis Energy Management - Detect"
  description: "Janitza GridVis is an energy monitoring and management software platform by Janitza Electronics GmbH. It provides real-time power quality analysis, energy data logging, and grid visualisation for industrial facilities. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.janitza.com/gridvis.html"
  tags: ["tech", "panel", "janitza", "ics", "energy", "scada", "detect", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/landingpage" }
  - id: "probe1"
    request: { method: "GET", path: "/landingpage/" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - any:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>GridVis</title>" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "/landingpage/img/favicon.ico" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "gve-8janitza.energy.security" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - any:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "<title>GridVis</title>" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "/landingpage/img/favicon.ico" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "gve-8janitza.energy.security" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
