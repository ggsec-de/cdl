schema_version: 1
id: "cortex.community:cisco-webex-meetings-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Cisco Webex Meetings - Panel"
  description: "Detects Cisco Webex Meetings panel by requesting the modern Webex dashboard and matching unique Webex HTML markers. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.webex.com/"
  tags: ["panel", "cisco", "webex", "detect", "discovery", "login", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - any:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>Cisco Webex Meetings" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "content=\"Cisco Webex Site" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "webexTimezoneId\":" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "webexClientId\":" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
