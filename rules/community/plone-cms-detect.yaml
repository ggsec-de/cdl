schema_version: 1
id: "cortex.community:plone-cms-detect"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Plone CMS detect"
  description: "Detects Plone CMS Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://github.com/plone/Products.CMFPlone"
  tags: ["tech", "plone", "cms", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<meta name=\"generator\" content=\"Plone - " } }
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<div xmlns:css=\"http://namespaces.plone.org/diazo/css\"" } }
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "/++plone++static/plone-compiled.css" } }
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "/++plone++static/tinymce-styles.css" } }
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: ">Powered by Plone &amp; Python</a>" } }
