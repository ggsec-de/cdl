schema_version: 1
id: "cortex.community:pre-commit-config"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Pre-commit Configuration File - Detect"
  description: "Pre-commit configuration file was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://pre-commit.com/"
  cwes: [200]
  tags: ["exposure", "devops", "config", "cicd", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/.pre-commit-config.yaml" }
  - id: "probe1"
    request: { method: "GET", path: "/pre-commit-config.yaml" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - all:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "repos:" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "hooks:" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "rev:" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - all:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "repos:" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "hooks:" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "rev:" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
