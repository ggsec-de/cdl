schema_version: 1
id: "cortex.community:zimbra-web-login"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Zimbra Collaboration Suite Login Panel - Detect"
  description: "Zimbra Collaboration Suite panel was detected. Zimbra Collaboration Suite simplifies the communication environment, connects people over multiple channels, and provides a single place to manage collaboration and communication. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.zimbra.com/"
  cwes: [200]
  tags: ["panel", "zimbra", "synacor", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - any:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Zimbra Collaboration Suite Log In" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Zimbra Web Client Sign In" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Zimbra Web Client Log In" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
