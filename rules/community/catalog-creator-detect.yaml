schema_version: 1
id: "cortex.community:catalog-creator-detect"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "CATALOGcreator Page Login Panel - Detect"
  description: "CATALOGcreator Page login panel detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  cwes: [200]
  tags: ["tech", "catalogcreater", "panel", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
  - id: "probe1"
    request: { method: "GET", path: "/index.php" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - any:
              - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)Powered\\ by\\ CATALOGcreator" } }
              - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)content=\"CATALOGcreator" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - any:
              - regex: { left: { ref: "steps.probe1.body" }, right: { value: "(?i)Powered\\ by\\ CATALOGcreator" } }
              - regex: { left: { ref: "steps.probe1.body" }, right: { value: "(?i)content=\"CATALOGcreator" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
