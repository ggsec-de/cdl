schema_version: 1
id: "cortex.community:wd-mycloud-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "WD My Cloud Panel - Detect"
  description: "Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.zerodayinitiative.com/blog/2023/4/19/cve-2022-29844-a-classic-buffer-overflow-on-the-western-digital-my-cloud-pro-series-pr4100"
  tags: ["panel", "login", "mycloud", "wd", "detect", "western_digital", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - any:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "WDMyCloud" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Cloud_Connection_StatusID" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "my_cloud_os" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "WD Privacy Statement" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
