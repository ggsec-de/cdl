schema_version: 1
id: "cortex.community:beckhoff-twincat-hmi-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Beckhoff TwinCAT HMI Server - Login Panel"
  description: "Beckhoff TwinCAT HMI (Human Machine Interface) Server is part of the TwinCAT industrial automation platform used in manufacturing, robotics, and process automation. It exposes a web-based HMI accessible via browser for monitoring and controlling PLC-driven systems. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.beckhoff.com/en-en/products/automation/twincat/te2xxx-twincat-3-target/te2000.html"
    - "https://infosys.beckhoff.com/english.php?content=../content/1033/te2000_tc3_hmi_engineering/index.html"
  tags: ["panel", "scada", "ics", "beckhoff", "twincat", "hmi", "plc", "automation", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "TwinCAT" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Beckhoff" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
