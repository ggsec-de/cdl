schema_version: 1
id: "cortex.community:lucee-login"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Lucee Web and Lucee Server Admin Login Panel - Detect"
  description: "Lucee admin login panels were detected in both Web and Server tabs. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  cwes: [200]
  tags: ["panel", "lucee", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/lucee/admin/web.cfm" }
  - id: "probe1"
    request: { method: "GET", path: "/lucee/admin/server.cfm" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - any:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>Login - Lucee Web Administrator</title>" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>Login - Lucee Server Administrator</title>" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "lucee-admin-search-input" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "lucee-docs-search-input" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "server-lucee-small.png.cfm" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - any:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "<title>Login - Lucee Web Administrator</title>" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "<title>Login - Lucee Server Administrator</title>" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "lucee-admin-search-input" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "lucee-docs-search-input" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "server-lucee-small.png.cfm" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
