schema_version: 1
id: "cortex.community:avatier-password-management"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Avatier Password Management Panel"
  description: "An Avatier password management panel was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.exploit-db.com/ghdb/6576"
    - "https://www.avatier.com/products/identity-management/password-management/"
  cwes: [200]
  tags: ["edb", "panel", "avatier", "aims", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/aims/ps/" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - any:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "LabelWelcomeToPS" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Avatier Corporation" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Welcome to Password Management" } }
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Password Management Client" } }
