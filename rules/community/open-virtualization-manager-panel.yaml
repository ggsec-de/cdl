schema_version: 1
id: "cortex.community:open-virtualization-manager-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Open Virtualization Userportal & Webadmin Panel Detection"
  description: "Open Virtualization Userportal & Webadmin panels were detected. Open Virtualization Manager is an open-source distributed virtualization solution designed to manage enterprise infrastructure. oVirt uses the trusted KVM hypervisor and is built upon several other community projects, including libvirt, Gluster, PatternFly, and Ansible. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.ovirt.org/"
    - "https://www.ovirt.org/dropped/admin-guide/virt/console-client-resources.html"
  cwes: [668]
  tags: ["panel", "ovirt", "oss", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/ovirt-engine/userportal/" }
  - id: "probe1"
    request: { method: "GET", path: "/ovirt-engine/webadmin/" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - any:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "\"application_title\":\"oVirt Engine User Portal\"" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "\"application_title\":\"oVirt Engine Web Administration\"" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - any:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "\"application_title\":\"oVirt Engine User Portal\"" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "\"application_title\":\"oVirt Engine Web Administration\"" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
