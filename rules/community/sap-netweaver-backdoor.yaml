schema_version: 1
id: "cortex.community:sap-netweaver-backdoor"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "SAP NetWeaver - Backdoor Detection"
  description: "Detected a potential backdoor in SAP NetWeaver allowing unauthorized command execution. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.bleepingcomputer.com/news/security/sap-fixes-suspected-netweaver-zero-day-exploited-in-attacks/"
  tags: ["sap", "netweaver", "backdoor", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Critical"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/irj/helper.jsp?cmd=ls" }
  - id: "probe1"
    request: { method: "GET", path: "/irj/cache.jsp?cmd=ls" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - all:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Command: ls<BR>" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "sap" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - all:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "Command: ls<BR>" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "sap" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
