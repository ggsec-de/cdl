schema_version: 1
id: "cortex.community:apachespark-ui-exposed"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Apache Spark Application UI - Exposed"
  description: "Detects exposed PySparkShell Application UI by Apache Spark on port 4040. The UI should not be exposed to the internet as it may leak sensitive job and cluster information. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://spark.apache.org/docs/latest/web-ui.html"
  tags: ["spark", "pyspark", "ui", "exposed", "panel", "apache", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Medium"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/jobs/" }
  - id: "probe1"
    request: { method: "GET", path: "/:4040/jobs/" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - all:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Spark Jobs" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "application UI" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - all:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "Spark Jobs" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "application UI" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
