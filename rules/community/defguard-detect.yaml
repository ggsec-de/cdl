schema_version: 1
id: "cortex.community:defguard-detect"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Defguard - Detect"
  description: "Defguard is an open-source platform for secure remote access, WireGuard management and identity-aware access control. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://defguard.net/"
    - "https://github.com/DefGuard/defguard"
  tags: ["tech", "detect", "defguard", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - any:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<meta name=\"application-name\" content=\"Defguard\"" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>Defguard</title>" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>Defguard Enrollment Service</title>" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Defguard VPN Enrollment Portal" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
