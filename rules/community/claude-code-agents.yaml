schema_version: 1
id: "cortex.community:claude-code-agents"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Claude Code Subagent Configuration - Exposure"
  description: "Claude Code subagent configuration files under `.claude/agents/` were detected on the web server. Each `.md` file in this directory defines a specialized AI subagent (name, description, tool allow-list, system prompt) that Claude Code will delegate work to. Exposure of these files can leak custom system prompts (often containing internal API endpoints, business logic, prompt-engineering secrets), tool permission grants, and information about the project's internal automation setup. Directory listings on `.claude/agents/` further expose the full inventory of subagents defined for a project. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://docs.claude.com/en/docs/claude-code/sub-agents"
    - "https://docs.claude.com/en/docs/claude-code/settings"
  cwes: [200]
  tags: ["config", "exposure", "claude", "claude-code", "anthropic", "ai", "subagent", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Low"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/.claude/agents/" }
  - id: "probe1"
    request: { method: "GET", path: "/.claude/agents/index.md" }
  - id: "probe2"
    request: { method: "GET", path: "/.claude/agents/README.md" }
  - id: "probe3"
    request: { method: "GET", path: "/.claude/agents/code-reviewer.md" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - any:
              - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?s)^---\\s*\\n.*?\\bname:\\s*[A-Za-z0-9_-]+.*?\\bdescription:\\s*.*?\\n---" } }
              - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)Index of /\\.claude/agents" } }
              - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)Directory listing for /\\.claude/agents" } }
              - regex: { left: { ref: "steps.probe0.body" }, right: { value: ">[a-zA-Z0-9_.-]+\\.md<" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - any:
              - regex: { left: { ref: "steps.probe1.body" }, right: { value: "(?s)^---\\s*\\n.*?\\bname:\\s*[A-Za-z0-9_-]+.*?\\bdescription:\\s*.*?\\n---" } }
              - regex: { left: { ref: "steps.probe1.body" }, right: { value: "(?i)Index of /\\.claude/agents" } }
              - regex: { left: { ref: "steps.probe1.body" }, right: { value: "(?i)Directory listing for /\\.claude/agents" } }
              - regex: { left: { ref: "steps.probe1.body" }, right: { value: ">[a-zA-Z0-9_.-]+\\.md<" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
      - all:
          - any:
              - regex: { left: { ref: "steps.probe2.body" }, right: { value: "(?s)^---\\s*\\n.*?\\bname:\\s*[A-Za-z0-9_-]+.*?\\bdescription:\\s*.*?\\n---" } }
              - regex: { left: { ref: "steps.probe2.body" }, right: { value: "(?i)Index of /\\.claude/agents" } }
              - regex: { left: { ref: "steps.probe2.body" }, right: { value: "(?i)Directory listing for /\\.claude/agents" } }
              - regex: { left: { ref: "steps.probe2.body" }, right: { value: ">[a-zA-Z0-9_.-]+\\.md<" } }
          - eq: { left: { ref: "steps.probe2.status" }, right: { value: 200 } }
      - all:
          - any:
              - regex: { left: { ref: "steps.probe3.body" }, right: { value: "(?s)^---\\s*\\n.*?\\bname:\\s*[A-Za-z0-9_-]+.*?\\bdescription:\\s*.*?\\n---" } }
              - regex: { left: { ref: "steps.probe3.body" }, right: { value: "(?i)Index of /\\.claude/agents" } }
              - regex: { left: { ref: "steps.probe3.body" }, right: { value: "(?i)Directory listing for /\\.claude/agents" } }
              - regex: { left: { ref: "steps.probe3.body" }, right: { value: ">[a-zA-Z0-9_.-]+\\.md<" } }
          - eq: { left: { ref: "steps.probe3.status" }, right: { value: 200 } }
