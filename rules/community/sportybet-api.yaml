schema_version: 1
id: "cortex.community:sportybet-api"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "SportyBet / BetKing Admin or API Token - Exposure"
  description: "Detected exposed internal tokens and administrative endpoints belonging to online betting platforms. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  tags: ["exposure", "betting", "sportybet", "betking", "token", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - any:
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "Bearer\\s+[A-Za-z0-9_-]{50,}\\.[A-Za-z0-9_-]{50,}\\.[A-Za-z0-9_-]{50,}" } }
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "token[\"']?\\s*[:=]\\s*[\"']?eyJ[A-Za-z0-9_-]{100,}[\"']?" } }
      - any:
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)sportybet" } }
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)betking" } }
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)bet9ja" } }
