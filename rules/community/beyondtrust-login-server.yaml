schema_version: 1
id: "cortex.community:beyondtrust-login-server"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "BeyondTrust Privileged Access Management Login - Detect"
  description: "BeyondTrust Privileged Access Management login panel was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.beyondtrust.com/brand"
  cwes: [200]
  tags: ["beyondtrust", "pam", "panel", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/WebConsole/api/security/auth/loginServers" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "\"DomainName\":\"(.*)\"" } }
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "\"domains\":" } }
