schema_version: 1
id: "cortex.community:chamilo-installer"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Chamilo Installer Exposure"
  description: "Chamilo is susceptible to the Installation page exposure due to misconfiguration. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  tags: ["misconfig", "chamilo", "install", "exposure", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "High"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
  - id: "probe1"
    request: { method: "GET", path: "/main/install/index.php" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - any:
          - all:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Chamilo installation" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Installation Language" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>Chamilo has not been installed</title>" } }
      - any:
          - all:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "Chamilo installation" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "Installation Language" } }
          - contains: { left: { ref: "steps.probe1.body" }, right: { value: "<title>Chamilo has not been installed</title>" } }
