schema_version: 1
id: "cortex.community:moxa-mxview-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Moxa MXview One - Network Management Panel"
  description: "Moxa MXview One is a network management platform for industrial Ethernet infrastructure, OT network monitoring, and topology visualisation. It is widely used in manufacturing, energy, and transportation to manage industrial switches and routers. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.moxa.com/en/products/industrial-network-infrastructure/network-management-software/mxview-series/"
  tags: ["panel", "ics", "ot", "networking", "moxa", "mxview", "industrial-ethernet", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - any:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "MXview One Central Manager" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "MXview" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Central Manager" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
