schema_version: 1
id: "cortex.community:next-js-config-file"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Next JS Config - File Disclosure"
  description: "Next JS Config file is exposed. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://nextjs.org/docs/app/api-reference/config/next-config-js"
  tags: ["exposure", "files", "nextjs", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Low"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/next.config.js" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)nextConfig" } }
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)module\\.exports\\ =" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
