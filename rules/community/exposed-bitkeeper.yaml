schema_version: 1
id: "cortex.community:exposed-bitkeeper"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "BitKeeper Configuration - Detect"
  description: "BitKeeper configuration was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.bitkeeper.org/man/config-etc.html"
  tags: ["config", "exposure", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Low"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/BitKeeper/etc/config" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "BitKeeper configuration" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "logging" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "email" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "description" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
