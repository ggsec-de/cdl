schema_version: 1
id: "cortex.community:opennms-dashboard-exposure"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "OpenNMS Dashboard - Exposure Detection"
  description: "OpenNMS Dashboard exposure was detected. OpenNMS is an enterprise-grade network monitoring platform. Exposed dashboards may reveal sensitive network infrastructure information, monitoring data, alarms, and potentially allow unauthorized access. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://docs.opennms.com/horizon/35/operation/deep-dive/visualizations/dashboard.html"
    - "https://docs.opennms.com/horizon/30/operation/user-management/introduction.html"
    - "https://www.opennms.com/"
  cwes: [200]
  tags: ["panel", "opennms", "exposure", "dashboard", "network-monitoring", "misconfig", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Medium"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/opennms/index.jsp" }
  - id: "probe1"
    request: { method: "GET", path: "/opennms/dashboard.jsp" }
  - id: "probe2"
    request: { method: "GET", path: "/opennms/" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - any:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "OpenNMS Web Console" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "OpenNMS" } }
          - all:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Status" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Dashboard" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Home" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Maps" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - any:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "OpenNMS Web Console" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "OpenNMS" } }
          - all:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "Status" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "Dashboard" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "Home" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "Maps" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
      - all:
          - any:
              - contains: { left: { ref: "steps.probe2.body" }, right: { value: "OpenNMS Web Console" } }
              - contains: { left: { ref: "steps.probe2.body" }, right: { value: "OpenNMS" } }
          - all:
              - contains: { left: { ref: "steps.probe2.body" }, right: { value: "Status" } }
              - contains: { left: { ref: "steps.probe2.body" }, right: { value: "Dashboard" } }
              - contains: { left: { ref: "steps.probe2.body" }, right: { value: "Home" } }
              - contains: { left: { ref: "steps.probe2.body" }, right: { value: "Maps" } }
          - eq: { left: { ref: "steps.probe2.status" }, right: { value: 200 } }
