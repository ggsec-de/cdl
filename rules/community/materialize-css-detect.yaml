schema_version: 1
id: "cortex.community:materialize-css-detect"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Materialize CSS - Detect"
  description: "Detected the presence of Materialize, a modern responsive front-end framework based on Material Design. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://materializecss.com/"
  tags: ["tech", "materialize", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)href=[\"'][^\"']*materialize(?:[\\.-]min)?\\.css" } }
      - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)src=[\"'][^\"']*materialize(?:[\\.-]min)?\\.js" } }
      - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)class=[\"'][^\"']*waves-effect" } }
      - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)class=[\"'][^\"']*materialize-textarea" } }
