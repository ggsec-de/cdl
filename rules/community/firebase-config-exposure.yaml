schema_version: 1
id: "cortex.community:firebase-config-exposure"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Firebase Configuration File - Detect"
  description: "Firebase configuration file was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://github.com/firebase/firebaseui-web/blob/master/demo/public/sample-config.js"
  cwes: [200]
  tags: ["firebase", "exposure", "config", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Medium"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
  - id: "probe1"
    request: { method: "GET", path: "/public/config.js" }
  - id: "probe2"
    request: { method: "GET", path: "/config.js" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - all:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "apiKey:" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "authDomain:" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "databaseURL:" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "storageBucket:" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - all:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "apiKey:" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "authDomain:" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "databaseURL:" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "storageBucket:" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
      - all:
          - all:
              - contains: { left: { ref: "steps.probe2.body" }, right: { value: "apiKey:" } }
              - contains: { left: { ref: "steps.probe2.body" }, right: { value: "authDomain:" } }
              - contains: { left: { ref: "steps.probe2.body" }, right: { value: "databaseURL:" } }
              - contains: { left: { ref: "steps.probe2.body" }, right: { value: "storageBucket:" } }
          - eq: { left: { ref: "steps.probe2.status" }, right: { value: 200 } }
