schema_version: 1
id: "cortex.community:yarn-resourcemanager-rce"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Apache Hadoop YARN ResourceManager - Remote Code Execution"
  description: "Apache Hadoop YARN ResourceManager is susceptible to remote code execution. An attacker can execute malware, obtain sensitive information, modify data, and/or gain full control over a compromised system without entering necessary credentials. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://neerajsabharwal.medium.com/hadoop-yarn-hack-9a72cc1328b6"
    - "https://www.infosecmatter.com/nessus-plugin-library/?id=117615"
  tags: ["apache", "rce", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Low"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "POST", path: "/ws/v1/cluster/apps/new-application" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "application-id" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "maximum-resource-capability" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
