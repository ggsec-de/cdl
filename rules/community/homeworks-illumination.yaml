schema_version: 1
id: "cortex.community:homeworks-illumination"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "HomeWorks Illumination Web Keypad"
  description: "HomeWorks Illumination Web Keypad panel was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.lutron.com"
  tags: ["misconfig", "iot", "homeworks", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Low"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "HomeWorks Illumination Web Keypad" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Lutron HomeWorks" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
