schema_version: 1
id: "cortex.community:rubygems-credentials-exposure"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Ruby Gem::ConfigFile Credential - Exposure"
  description: "Ruby Gem credentials file is exposed, potentially leaking RubyGems API keys. The ~/.gem/credentials file stores authentication tokens for publishing gems to RubyGems.org or private gem servers. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://guides.rubygems.org/rubygems-org-api/"
    - "https://blog.rubygems.org/2020/07/28/api-key-leak.html"
  cwes: [200]
  tags: ["exposure", "rubygems", "credentials", "config", "token", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "High"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/.gem/credentials" }
  - id: "probe1"
    request: { method: "GET", path: "/credentials" }
  - id: "probe2"
    request: { method: "GET", path: "/.gem/credentials.yaml" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: ":rubygems_api_key:" } }
          - not:
              any:
                - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<html" } }
                - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<body" } }
                - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<!DOCTYPE" } }
                - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<script" } }
                - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<?php" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - contains: { left: { ref: "steps.probe1.body" }, right: { value: ":rubygems_api_key:" } }
          - not:
              any:
                - contains: { left: { ref: "steps.probe1.body" }, right: { value: "<html" } }
                - contains: { left: { ref: "steps.probe1.body" }, right: { value: "<body" } }
                - contains: { left: { ref: "steps.probe1.body" }, right: { value: "<!DOCTYPE" } }
                - contains: { left: { ref: "steps.probe1.body" }, right: { value: "<script" } }
                - contains: { left: { ref: "steps.probe1.body" }, right: { value: "<?php" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
      - all:
          - contains: { left: { ref: "steps.probe2.body" }, right: { value: ":rubygems_api_key:" } }
          - not:
              any:
                - contains: { left: { ref: "steps.probe2.body" }, right: { value: "<html" } }
                - contains: { left: { ref: "steps.probe2.body" }, right: { value: "<body" } }
                - contains: { left: { ref: "steps.probe2.body" }, right: { value: "<!DOCTYPE" } }
                - contains: { left: { ref: "steps.probe2.body" }, right: { value: "<script" } }
                - contains: { left: { ref: "steps.probe2.body" }, right: { value: "<?php" } }
          - eq: { left: { ref: "steps.probe2.status" }, right: { value: 200 } }
