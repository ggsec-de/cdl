schema_version: 1
id: "cortex.community:papercut-ng-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "PaperCut NG Panel - Detect"
  description: "PaperCut is a print management system. Log in to manage your print quotas, see your print history and configure your system. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  cwes: [200]
  tags: ["panel", "papercut", "detect", "papercut-ng", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/user" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - any:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "content=\"PaperCut" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>PaperCut Login" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
