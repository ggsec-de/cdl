schema_version: 1
id: "cortex.community:mlflow-unauth"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Mlflow - Unauthenticated Access"
  description: "Unauthenticated Access to MLflow dashboard. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  tags: ["unauth", "mlflow", "oss", "misconfig", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "High"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/ajax-api/2.0/preview/mlflow/experiments/get?experiment_id=0" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "experiment_id" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "name" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "artifact_location" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
