schema_version: 1
id: "cortex.community:jenkins-stack-trace"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Detect Jenkins in Debug Mode with Stack Traces Enabled"
  description: "Module identified that the affected host is running an instance of Jenkins in debug mode, as a result stack traces are enabled. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://hackerone.com/reports/221833"
  tags: ["jenkins", "hackerone", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Low"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/adjuncts/3a890183/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "java.lang.StringIndexOutOfBoundsException" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "String index out of range" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 500 } }
