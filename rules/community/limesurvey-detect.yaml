schema_version: 1
id: "cortex.community:limesurvey-detect"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "LimeSurvey Survey Software - Detect"
  description: "Limesurvey is the number one open-source survey software. Advanced features like branching and multiple question types make it a valuable partner for survey-creation. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://github.com/LimeSurvey/LimeSurvey"
  tags: ["tech", "limesurvey", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - any:
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)content=\"LimeSurvey" } }
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)alt=\"LimeSurvey\\ Survey\\ Software" } }
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)data\\-limesurvey\\-lang=" } }
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)alt=\"Powered\\ by\\ LimeSurvey" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
