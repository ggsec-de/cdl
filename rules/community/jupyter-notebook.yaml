schema_version: 1
id: "cortex.community:jupyter-notebook"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Jupyter Notebook Login Panel - Detect"
  description: "Jupyter Notebook login panel was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.exploit-db.com/ghdb/7970"
  cwes: [200]
  tags: ["edb", "panel", "jupyter", "notebook", "exposure", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/jupyter/login" }
  - id: "probe1"
    request: { method: "GET", path: "/jupyter/lab" }
  - id: "probe2"
    request: { method: "GET", path: "/jupyter/hub/lti/launch" }
  - id: "probe3"
    request: { method: "GET", path: "/hub/login" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - any:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "/jupyter/static/base/images/logo.png" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "/jupyter/hub/logo" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Select items to perform actions on them." } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "JupyterHub" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - any:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "/jupyter/static/base/images/logo.png" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "/jupyter/hub/logo" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "Select items to perform actions on them." } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "JupyterHub" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
      - all:
          - any:
              - contains: { left: { ref: "steps.probe2.body" }, right: { value: "/jupyter/static/base/images/logo.png" } }
              - contains: { left: { ref: "steps.probe2.body" }, right: { value: "/jupyter/hub/logo" } }
              - contains: { left: { ref: "steps.probe2.body" }, right: { value: "Select items to perform actions on them." } }
              - contains: { left: { ref: "steps.probe2.body" }, right: { value: "JupyterHub" } }
          - eq: { left: { ref: "steps.probe2.status" }, right: { value: 200 } }
      - all:
          - any:
              - contains: { left: { ref: "steps.probe3.body" }, right: { value: "/jupyter/static/base/images/logo.png" } }
              - contains: { left: { ref: "steps.probe3.body" }, right: { value: "/jupyter/hub/logo" } }
              - contains: { left: { ref: "steps.probe3.body" }, right: { value: "Select items to perform actions on them." } }
              - contains: { left: { ref: "steps.probe3.body" }, right: { value: "JupyterHub" } }
          - eq: { left: { ref: "steps.probe3.status" }, right: { value: 200 } }
