schema_version: 1
id: "cortex.community:unauth-hoteldruid-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Hoteldruid Management Panel Access"
  description: "A vulnerability in Hoteldruid Panel allows remote unauthenticated users access to the management portal without authentication. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://github.com/nomi-sec/PoC-in-GitHub/blob/master/2021/CVE-2021-42949.json"
    - "https://www.hoteldruid.com/"
  cwes: [522]
  tags: ["hoteldruid", "panel", "unauth", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "High"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/hoteldruid/inizio.php" }
  - id: "probe1"
    request: { method: "GET", path: "/inizio.php" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
          - all:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title> HotelDruid </title>" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<b>INSERT:</b>" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<b>TABLES:</b>" } }
      - all:
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
          - all:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "<title> HotelDruid </title>" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "<b>INSERT:</b>" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "<b>TABLES:</b>" } }
