schema_version: 1
id: "cortex.community:kubernetes-metrics"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Detect Kubernetes Exposed Metrics"
  description: "Information Disclosure of Garbage Collection Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://kubernetes.io/docs/concepts/cluster-administration/system-metrics/#metrics-in-kubernetes"
  tags: ["kubernetes", "exposure", "devops", "misconfig", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Low"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/metrics" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "namespace" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "HELP" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "TYPE" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "kube" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
