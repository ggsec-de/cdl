schema_version: 1
id: "cortex.community:htpasswd-detection"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Apache htpasswd Config - Detect"
  description: "Apache htpasswd configuration was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://httpd.apache.org/docs/current/programs/htpasswd.html"
  cwes: [200]
  tags: ["config", "exposure", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "High"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/.htpasswd" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - any:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: ":{SHA}" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: ":$apr1$" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: ":$2y$" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
