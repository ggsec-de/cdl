schema_version: 1
id: "cortex.community:spidercontrol-scada-server-info"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "SpiderControl SCADA Web Server - Sensitive Information Exposure"
  description: "SpiderControl SCADA Web Server is vulnerable to sensitive information exposure. Numerous, market-leading OEM manufacturers - from a wide variety of industries - rely on SpiderControl. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://spidercontrol.net/spidercontrol-inside/"
  tags: ["spidercontrol", "scada", "exposure", "misconfig", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "High"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/cgi-bin/GetSrvInfo.exe" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "powered by SpiderControl" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "LSWEBSERVER" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "SCWEBSERVICES" } }
