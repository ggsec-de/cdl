schema_version: 1
id: "cortex.community:imageresizer-debug-exposure"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "ImageResizer Debug - Information Exposure"
  description: "The ImageResizer debug endpoint exposes sensitive server configuration and path information. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://world.optimizely.com/blogs/Eric-Pettersson/Dates/2016/4/hide-resizer-debug-ashx-from-your-website/"
  tags: ["exposure", "debug", "imageresizer", "config", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Low"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/resizer.debug.ashx" }
  - id: "probe1"
    request: { method: "GET", path: "/resizer.debug" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - all:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "ImageResizer." } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Diagnostics" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Configuration:" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Registered plugins:" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - all:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "ImageResizer." } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "Diagnostics" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "Configuration:" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "Registered plugins:" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
