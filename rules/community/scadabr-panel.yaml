schema_version: 1
id: "cortex.community:scadabr-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "ScadaBR - Login Panel"
  description: "ScadaBR is an open-source SCADA system based on Mango Automation, widely used in Brazil and Latin America for industrial monitoring. The \"powered by Mango\" tagline in the title is a unique identifier. Instances are often internet-facing without authentication controls. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.scadabr.com.br/"
    - "https://github.com/ScadaBR/ScadaBR"
  tags: ["panel", "scada", "ics", "scadabr", "mango", "open-source", "latin-america", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - any:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>ScadaBR</title>" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "ScadaBR Software" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
