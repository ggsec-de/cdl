schema_version: 1
id: "cortex.community:versa-director-login"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Versa Director Login Panel - Detect"
  description: "Versa Director login panel was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://versa-networks.com/products/components/"
  cwes: [200]
  tags: ["panel", "versa", "director", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/versa/login" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - any:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "versa-login-logo" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "VERSA DIRECTOR" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
