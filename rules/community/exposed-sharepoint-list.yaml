schema_version: 1
id: "cortex.community:exposed-sharepoint-list"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Sharepoint List - Detect"
  description: "Sharepoint list was detected because of improper configuration. An anonymous user can access SharePoint Web Services. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://hackerone.com/reports/761158"
    - "https://hackerone.com/reports/300539"
  cwes: [200]
  tags: ["hackerone", "config", "exposure", "sharepoint", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Medium"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/_vti_bin/lists.asmx?WSDL" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "GetListResponse" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "GetList" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
