schema_version: 1
id: "cortex.community:livehelperchat-detect"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Live Helper Chat Detect"
  description: "Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  tags: ["livehelperchat", "tech", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
  - id: "probe1"
    request: { method: "GET", path: "/doc/CHANGELOG.txt" }
  - id: "probe2"
    request: { method: "GET", path: "/doc/README.txt" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - any:
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)Live.Helper.Chat" } }
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)Copyright.\\(c\\).2019.Remigijus.Kiminas" } }
      - any:
          - regex: { left: { ref: "steps.probe1.body" }, right: { value: "(?i)Live.Helper.Chat" } }
          - regex: { left: { ref: "steps.probe1.body" }, right: { value: "(?i)Copyright.\\(c\\).2019.Remigijus.Kiminas" } }
      - any:
          - regex: { left: { ref: "steps.probe2.body" }, right: { value: "(?i)Live.Helper.Chat" } }
          - regex: { left: { ref: "steps.probe2.body" }, right: { value: "(?i)Copyright.\\(c\\).2019.Remigijus.Kiminas" } }
