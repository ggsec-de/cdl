schema_version: 1
id: "cortex.community:eyoucms-installer"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "EyouCMS - Installation"
  description: "EyouCMS installation is exposed. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  tags: ["misconfig", "eyoucms", "install", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "High"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/install/index.php" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)EyouCms" } }
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)/install/index\\.php\\?step=2" } }
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)使用协议</p>" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
