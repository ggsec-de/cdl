schema_version: 1
id: "cortex.community:bmc-discovery-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "BMC Discovery Login Panel - Detect"
  description: "BMC Discovery login panel was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://docs.bmc.com/docs/discovery/documentation-home-1098837931.html"
  cwes: [200]
  tags: ["panel", "bmc", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/ui/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "BMC Discovery:" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<span class=\"logo-product\">Discovery</span>" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
