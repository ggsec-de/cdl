schema_version: 1
id: "cortex.community:rackup-config-ru"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Rackup Configuration - Detect"
  description: "Rackup configuration information was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://raw.githubusercontent.com/maurosoria/dirsearch/master/db/dicc.txt"
    - "https://learn.co/lessons/config-ru-tutorial"
  cwes: [200]
  tags: ["exposure", "files", "config", "rackup", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/config.ru" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "run Rails.application" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "/config/environment" } }
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Bundler.require" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "require 'rubygems'" } }
