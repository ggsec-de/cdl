schema_version: 1
id: "cortex.community:firezone-detect"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Firezone - Detect"
  description: "Firezone is an open-source remote access platform built on WireGuard. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.firezone.dev/"
    - "https://github.com/firezone/firezone"
  tags: ["tech", "detect", "firezone", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)<title>[^<]*Firezone[^<]*</title>" } }
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "phx-track-static" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
