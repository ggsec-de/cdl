schema_version: 1
id: "cortex.community:laravel-nova-unauth"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Laravel Nova - Unauthenticated Admin Panel Access"
  description: "Laravel Nova admin panel is accessible without authentication. Nova provides full CRUD access to application models and database records, making unauthenticated access a critical security risk. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://nova.laravel.com/docs/4.0/installation.html#authorizing-nova"
  tags: ["laravel", "nova", "admin", "unauth", "exposure", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "High"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/nova/dashboards/main" }
  - id: "probe1"
    request: { method: "GET", path: "/nova/resources" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - any:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Nova.booting" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "nova-resources" } }
          - not:
              any:
                - contains: { left: { ref: "steps.probe0.body" }, right: { value: "nova-login" } }
                - contains: { left: { ref: "steps.probe0.body" }, right: { value: "/nova/login" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - any:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "Nova.booting" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "nova-resources" } }
          - not:
              any:
                - contains: { left: { ref: "steps.probe1.body" }, right: { value: "nova-login" } }
                - contains: { left: { ref: "steps.probe1.body" }, right: { value: "/nova/login" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
