schema_version: 1
id: "cortex.community:vercel-source-exposure"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Vercel Source Code Exposure"
  description: "The Vercel Source Code Exposure misconfiguration allows an attacker to access sensitive source code files on the Vercel platform. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://vercel.com/docs/projects/overview#logs-and-source-protection"
  tags: ["vercel", "exposure", "misconfig", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Medium"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/_src" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - any:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Deployment Source</title>" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Deployment Source – Dashboard – Vercel" } }
      - not:
          contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>Login – Vercel</title>" } }
