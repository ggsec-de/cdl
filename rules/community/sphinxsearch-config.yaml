schema_version: 1
id: "cortex.community:sphinxsearch-config"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Sphinx Search Config - Exposure"
  description: "sphinx.conf file contains SQL credentials and is publicly accessible. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://github.com/manticorp/SphinxSearch/blob/master/sphinx.conf.example"
  tags: ["sphinx", "sphinxsearch", "exposure", "config", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "High"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/config/development.sphinx.conf" }
  - id: "probe1"
    request: { method: "GET", path: "/config/production.sphinx.conf" }
  - id: "probe2"
    request: { method: "GET", path: "/configs/sphinx.conf" }
  - id: "probe3"
    request: { method: "GET", path: "/search/configs/sphinx.conf" }
  - id: "probe4"
    request: { method: "GET", path: "/sphinx.conf" }
  - id: "probe5"
    request: { method: "GET", path: "/sphinx/sphinx.conf" }
  - id: "probe6"
    request: { method: "GET", path: "/sphinxsearch/sphinx.conf" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - all:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "sql_user" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "sql_pass" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "indexer" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - all:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "sql_user" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "sql_pass" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "indexer" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
      - all:
          - all:
              - contains: { left: { ref: "steps.probe2.body" }, right: { value: "sql_user" } }
              - contains: { left: { ref: "steps.probe2.body" }, right: { value: "sql_pass" } }
              - contains: { left: { ref: "steps.probe2.body" }, right: { value: "indexer" } }
          - eq: { left: { ref: "steps.probe2.status" }, right: { value: 200 } }
      - all:
