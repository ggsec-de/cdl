              - contains: { left: { ref: "steps.probe4.body" }, right: { value: "sql_pass" } }
              - contains: { left: { ref: "steps.probe4.body" }, right: { value: "indexer" } }
          - eq: { left: { ref: "steps.probe4.status" }, right: { value: 200 } }
