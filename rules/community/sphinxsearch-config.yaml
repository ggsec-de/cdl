              - contains: { left: { ref: "steps.probe3.body" }, right: { value: "sql_pass" } }
              - contains: { left: { ref: "steps.probe3.body" }, right: { value: "indexer" } }
          - eq: { left: { ref: "steps.probe3.status" }, right: { value: 200 } }
