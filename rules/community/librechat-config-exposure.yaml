schema_version: 1
id: "cortex.community:librechat-config-exposure"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "librechat - Config Exposure"
  description: "Detected the `/api/config` endpoint of the LibreChat web application was publicly accessible, potentially exposing internal configuration details. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  tags: ["librechat", "config", "exposure", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Low"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/api/config" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "LibreChat" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "serverDomain" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "registrationEnabled" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "passwordResetEnabled" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
