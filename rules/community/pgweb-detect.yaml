schema_version: 1
id: "cortex.community:pgweb-detect"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Pgweb - Detect"
  description: "Pgweb is an open-source, cross-platform web client for browsing PostgreSQL databases and running SQL queries. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://sosedoff.github.io/pgweb/"
    - "https://github.com/sosedoff/pgweb"
  tags: ["tech", "pgweb", "database", "postgresql", "detect", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>pgweb</title>" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "src=\"static/js/ace-pgsql.js\"" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "id=\"table_connection\"" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
