schema_version: 1
id: "cortex.community:rustdesk-server-pro-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "RustDesk Server Pro - Login Panel"
  description: "RustDesk Server Pro administrative web console was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://rustdesk.com/docs/en/self-host/rustdesk-server-pro/console/"
    - "https://github.com/rustdesk/rustdesk-server-pro"
  tags: ["panel", "rustdesk", "server-pro", "login", "detect", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/_admin/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>Rustdesk API Admin</title>" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
