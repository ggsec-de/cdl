schema_version: 1
id: "cortex.community:thinger-io-detect"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Thinger.io - Detect"
  description: "Thinger.io is an IoT platform for connecting, managing, and visualising connected devices. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://thinger.io/"
    - "https://docs.thinger.io/"
  tags: ["thinger", "tech", "iot", "device-management", "detect", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - any:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>Thinger.io | Cloud Console</title>" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>Thinger.io - Cloud Console</title>" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
