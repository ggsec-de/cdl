schema_version: 1
id: "cortex.community:ssh-authorized-keys"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "SSH Authorized Keys File - Detect"
  description: "SSH authorized keys file was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.ssh.com/academy/ssh/authorized-key"
  cwes: [200]
  tags: ["config", "exposure", "ssh", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Medium"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/.ssh/authorized_keys" }
  - id: "probe1"
    request: { method: "GET", path: "/_/.ssh/authorized_keys" }
  - id: "probe2"
    request: { method: "GET", path: "/authorized_keys" }
  - id: "probe3"
    request: { method: "GET", path: "/.authorized_keys" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - any:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "ssh-dss" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "ssh-ed25519" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "ssh-rsa" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "ecdsa-sha2-nistp256" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - any:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "ssh-dss" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "ssh-ed25519" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "ssh-rsa" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "ecdsa-sha2-nistp256" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
      - all:
          - any:
              - contains: { left: { ref: "steps.probe2.body" }, right: { value: "ssh-dss" } }
              - contains: { left: { ref: "steps.probe2.body" }, right: { value: "ssh-ed25519" } }
              - contains: { left: { ref: "steps.probe2.body" }, right: { value: "ssh-rsa" } }
              - contains: { left: { ref: "steps.probe2.body" }, right: { value: "ecdsa-sha2-nistp256" } }
          - eq: { left: { ref: "steps.probe2.status" }, right: { value: 200 } }
      - all:
          - any:
              - contains: { left: { ref: "steps.probe3.body" }, right: { value: "ssh-dss" } }
              - contains: { left: { ref: "steps.probe3.body" }, right: { value: "ssh-ed25519" } }
              - contains: { left: { ref: "steps.probe3.body" }, right: { value: "ssh-rsa" } }
              - contains: { left: { ref: "steps.probe3.body" }, right: { value: "ecdsa-sha2-nistp256" } }
          - eq: { left: { ref: "steps.probe3.status" }, right: { value: 200 } }
