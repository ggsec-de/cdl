schema_version: 1
id: "cortex.community:xcp-ng-xo-lite-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "XCP-ng XO Lite - Login Panel"
  description: "XO Lite local management interface hosted directly by an XCP-ng server was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://docs.xcp-ng.org/management/manage-locally/xo-lite/"
    - "https://github.com/vatesfr/xen-orchestra"
  tags: ["panel", "xcp-ng", "xo-lite", "vates", "virtualization", "login", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>XO Lite</title>" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
