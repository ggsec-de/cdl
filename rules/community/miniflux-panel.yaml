schema_version: 1
id: "cortex.community:miniflux-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Miniflux - Login Panel"
  description: "Miniflux is a minimalist and opinionated self-hosted feed reader written in Go. The login panel was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://miniflux.app/docs/index.html"
  tags: ["panel", "miniflux", "rss", "login", "signin", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>Sign In - Miniflux</title>" } }
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "data-add-subscription-url=\"/subscribe\"" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "data-refresh-all-feeds-url=\"/feeds/refresh\"" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
