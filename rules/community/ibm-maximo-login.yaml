schema_version: 1
id: "cortex.community:ibm-maximo-login"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "IBM Maximo Login Panel - Detect"
  description: "IBM Maximo login panel was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.ibm.com/support/pages/what-default-username-and-password-websphere-application-server-community-edition-and-how-add-users-admin-group"
    - "https://www.ibm.com/products/maximo"
  cwes: [200]
  tags: ["maximo", "panel", "ibm", "login", "detect", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/maximo/webclient/login/login.jsp?appservauth=true" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "maximo-icon.png" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "IBM" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
