schema_version: 1
id: "cortex.community:humhub-detect"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "HumHub - Detect"
  description: "HumHub is an open-source social network and collaboration platform. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.humhub.com/"
    - "https://github.com/humhub/humhub"
  tags: ["humhub", "social", "community", "collaboration", "tech", "detect", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "/static/js/humhub-app.js" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "humhub.modules.ui.view.setState(" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "humhub.config.set(" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
