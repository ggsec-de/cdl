schema_version: 1
id: "cortex.community:firebase-auth-fingerprint"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Firebase Authentication - Fingerprint"
  description: "Identifies applications using Firebase for authentication by requesting the auth helper script and checking for Firebase license, SDK version, and terms-of-service references. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://firebase.google.com/docs/auth/web/redirect-best-practices"
  tags: ["firebase", "fingerprint", "tech", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/__/auth/handler.js" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "@license Firebase" } }
      - regex: { left: { ref: "steps.probe0.body" }, right: { value: "Build: [0-9]+\\.[0-9]+\\.[0-9]+(-rc\\.[0-9]+)?" } }
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "https://firebase.google.com/terms/" } }
