schema_version: 1
id: "cortex.community:panos-management-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "PAN-OS Management Panel - Detect"
  description: "PAN-OS management panel was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://security.paloaltonetworks.com/PAN-SA-2024-0015"
  cwes: [200]
  tags: ["panel", "panos", "login", "detect", "paloaltonetworks", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/php/login.php" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<TITLE>Login</TITLE>" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "PAN_FORM_CONTENT" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
