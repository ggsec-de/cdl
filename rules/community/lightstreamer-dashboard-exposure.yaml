schema_version: 1
id: "cortex.community:lightstreamer-dashboard-exposure"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Lightstreamer Dashboard Exposure"
  description: "Detected exposed Lightstreamer Server dashboard that may reveal server configuration,real-time monitoring data, session information, and internal infrastructure details. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://lightstreamer.com/"
    - "https://lightstreamer.com/docs/ls-server/latest/Dashboard%20and%20Monitoring.html"
  tags: ["exposure", "lightstreamer", "dashboard", "misconfig", "unauth", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Medium"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/dashboard/" }
  - id: "probe1"
    request: { method: "GET", path: "/lightstreamer/dashboard/" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - all:
              - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)Lightstreamer\\ Monitoring\\ Dashboard" } }
              - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)performance" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - all:
              - regex: { left: { ref: "steps.probe1.body" }, right: { value: "(?i)Lightstreamer\\ Monitoring\\ Dashboard" } }
              - regex: { left: { ref: "steps.probe1.body" }, right: { value: "(?i)performance" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
