schema_version: 1
id: "cortex.community:openstack-user-secrets"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "OpenStack User Secrets Exposure"
  description: "Internal user_secrets.yml file is exposed in OpenStack. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://docs.openstack.org/project-deploy-guide/openstack-ansible/stein/configure.html"
  tags: ["openstack", "config", "exposure", "files", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "High"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/user_secrets.yml" }
  - id: "probe1"
    request: { method: "GET", path: "/user_secrets.yml.old" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - all:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "_password:" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "OpenStack environment" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - all:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "_password:" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "OpenStack environment" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
