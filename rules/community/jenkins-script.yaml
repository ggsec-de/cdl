schema_version: 1
id: "cortex.community:jenkins-script"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Jenkins - Remote Code Execution"
  description: "Jenkins is susceptible to a remote code execution vulnerability due to accessible script functionality. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://hackerone.com/reports/403402"
    - "https://medium.com/@gokulsspace/the-30000-bounty-affair-3f025ee6b834"
  cwes: [78]
  tags: ["devops", "hackerone", "jenkins", "rce", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Critical"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/script/" }
  - id: "probe1"
    request: { method: "GET", path: "/jenkins/script" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "println(Jenkins.instance.pluginManager.plugins)" } }
          - any:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Script Console" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Scriptconsole" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - contains: { left: { ref: "steps.probe1.body" }, right: { value: "println(Jenkins.instance.pluginManager.plugins)" } }
          - any:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "Script Console" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "Scriptconsole" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
