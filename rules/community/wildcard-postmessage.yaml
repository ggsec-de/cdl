schema_version: 1
id: "cortex.community:wildcard-postmessage"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "postMessage - Cross-Site Scripting"
  description: "postMessage contains a cross-site scripting vulnerability. An attacker can execute arbitrary script and therefore steal cookie-based authentication credentials and launch other attacks. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://jlajara.gitlab.io/web/2020/06/12/Dom_XSS_PostMessage.html"
    - "https://payatu.com/blog/anubhav.singh/postmessage-vulnerabilities"
    - "https://developer.mozilla.org/en-US/docs/Web/API/Window/postMessage"
  cwes: [346]
  tags: ["xss", "postmessage", "misconfig", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    regex: { left: { ref: "steps.probe0.body" }, right: { value: "postMessage\\([a-zA-Z]+,[\"']\\*[\"']\\)" } }
