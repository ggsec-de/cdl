schema_version: 1
id: "cortex.community:opencart-error-log"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "OpenCart Error Log Disclosure"
  description: "Detected exposed OpenCart error log files that may contain sensitive information including file paths, database errors, PHP warnings, and internal application details. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.opencart.com/"
    - "https://docs.opencart.com/en-gb/administration/"
  tags: ["opencart", "exposure", "logs", "disclosure", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Medium"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/system/storage/logs/error.log" }
  - id: "probe1"
    request: { method: "GET", path: "/opencart/system/storage/logs/error.log" }
  - id: "probe2"
    request: { method: "GET", path: "/storage/logs/error.log" }
  - id: "probe3"
    request: { method: "GET", path: "/error.log" }
  - id: "probe4"
    request: { method: "GET", path: "/system/logs/error.log" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - any:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "PHP Notice" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "PHP Warning" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "PHP Error" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "PHP Fatal error" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "opencart" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "catalog/controller" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "catalog/model" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "system/library" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Undefined index" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "MySQL" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "mysqli" } }
          - any:
              - regex: { left: { ref: "steps.probe0.body" }, right: { value: "\\d{4}-\\d{2}-\\d{2}\\s+\\d{2}:\\d{2}:\\d{2}" } }
              - regex: { left: { ref: "steps.probe0.body" }, right: { value: "\\[error\\]|\\[warning\\]|\\[notice\\]" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
