schema_version: 1
id: "cortex.community:azure-instrumentation-key-exposure"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Azure Instrumentation Key - Exposure"
  description: "Detected exposed Azure Application Insights Instrumentation Keys (classic ikey format) in HTTP responses, which allowed anyone to send telemetry data and, in some older configurations, could enable read access via undocumented or legacy APIs. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://learn.microsoft.com/en-us/azure/azure-monitor/app/connection-strings"
    - "http://www.medic-consulting.com/2016/07/10/Share-Asp-Net-Core-appsettings-json-with-Service-Fabric-Microservices/"
  tags: ["exposure", "azure", "instrumentation", "appinsights", "token", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Medium"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
  - id: "probe1"
    request: { method: "GET", path: "/appsettings.json" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - any:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "InstrumentationKey" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "instrumentationKey" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "APPINSIGHTS_INSTRUMENTATIONKEY" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<InstrumentationKey>" } }
          - any:
              - regex: { left: { ref: "steps.probe0.body" }, right: { value: "instrumentationKey:\"([0-9a-z-]+)\"" } }
              - regex: { left: { ref: "steps.probe0.body" }, right: { value: "<InstrumentationKey>(.*)</InstrumentationKey>" } }
              - regex: { left: { ref: "steps.probe0.body" }, right: { value: "APPINSIGHTS_INSTRUMENTATIONKEY=([a-z0-9-]+)" } }
              - regex: { left: { ref: "steps.probe0.body" }, right: { value: "InstrumentationKey\": \"([0-9a-z-]+)\"" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - any:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "InstrumentationKey" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "instrumentationKey" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "APPINSIGHTS_INSTRUMENTATIONKEY" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "<InstrumentationKey>" } }
          - any:
              - regex: { left: { ref: "steps.probe1.body" }, right: { value: "instrumentationKey:\"([0-9a-z-]+)\"" } }
              - regex: { left: { ref: "steps.probe1.body" }, right: { value: "<InstrumentationKey>(.*)</InstrumentationKey>" } }
              - regex: { left: { ref: "steps.probe1.body" }, right: { value: "APPINSIGHTS_INSTRUMENTATIONKEY=([a-z0-9-]+)" } }
              - regex: { left: { ref: "steps.probe1.body" }, right: { value: "InstrumentationKey\": \"([0-9a-z-]+)\"" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
