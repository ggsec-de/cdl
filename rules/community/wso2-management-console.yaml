schema_version: 1
id: "cortex.community:wso2-management-console"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "WSO2 Management Console Login Panel - Detect"
  description: "WSO2 Management Console login panel was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.exploit-db.com/ghdb/5691"
  cwes: [200]
  tags: ["panel", "wso2", "edb", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/carbon/admin/login.jsp" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - any:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>WSO2 Management Console</title>" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "WSO2 Carbon Server" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
