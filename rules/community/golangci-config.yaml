schema_version: 1
id: "cortex.community:golangci-config"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "GolangCI-Lint Configuration File - Detect"
  description: "GolangCI-Lint configuration file was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://github.com/maurosoria/dirsearch/blob/master/db/dicc.txt"
    - "https://golangci-lint.run/usage/configuration/"
  cwes: [200]
  tags: ["exposure", "golang", "devops", "cicd", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/.golangci.yml" }
  - id: "probe1"
    request: { method: "GET", path: "/.golangci.yaml" }
  - id: "probe2"
    request: { method: "GET", path: "/.golangci.toml" }
  - id: "probe3"
    request: { method: "GET", path: "/.golangci.json" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - all:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "linters:" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "linters-settings:" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - all:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "linters:" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "linters-settings:" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
      - all:
          - all:
              - contains: { left: { ref: "steps.probe2.body" }, right: { value: "linters:" } }
              - contains: { left: { ref: "steps.probe2.body" }, right: { value: "linters-settings:" } }
          - eq: { left: { ref: "steps.probe2.status" }, right: { value: 200 } }
      - all:
          - all:
              - contains: { left: { ref: "steps.probe3.body" }, right: { value: "linters:" } }
              - contains: { left: { ref: "steps.probe3.body" }, right: { value: "linters-settings:" } }
          - eq: { left: { ref: "steps.probe3.status" }, right: { value: 200 } }
