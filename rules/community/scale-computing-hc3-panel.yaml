schema_version: 1
id: "cortex.community:scale-computing-hc3-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Scale Computing HC3 - Login Panel"
  description: "Scale Computing HC3 web management login panel was detected. HC3, now part of the SC//HyperCore virtualization suite, provides hyperconverged compute, storage, and virtualization management. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.scalecomputing.com/sc-platform"
  tags: ["panel", "scale-computing", "hc3", "hci", "virtualization", "login", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>Scale System</title>" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "branding/favicons/" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
