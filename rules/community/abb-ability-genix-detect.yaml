schema_version: 1
id: "cortex.community:abb-ability-genix-detect"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "ABB Ability Genix Industrial Analytics and AI Suite - Detect"
  description: "ABB Ability Genix industrial analytics and artificial intelligence management portal was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://new.abb.com/process-automation/genix"
  tags: ["tech", "abb", "genix", "iiot", "ics", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>ABB Ability&trade; Genix Industrial Analytics and AI Suite</title>" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "assets/abb_favicon.ico" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
