schema_version: 1
id: "cortex.community:langflow-detect"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Langflow - Detect"
  description: "Langflow was detected. Langflow is an open-source visual LLM flow builder built on LangChain, providing a drag-and-drop interface for building AI pipelines and agents. Exposed instances may allow access to AI workflow configurations and API keys. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://github.com/langflow-ai/langflow"
    - "https://docs.langflow.org/"
  tags: ["tech", "langflow", "llm", "ai", "detect", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/api/v1/version" }
  - id: "probe1"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - any:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "\"package\":\"Langflow\"" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>Langflow</title>" } }
      - any:
          - contains: { left: { ref: "steps.probe1.body" }, right: { value: "\"package\":\"Langflow\"" } }
          - contains: { left: { ref: "steps.probe1.body" }, right: { value: "<title>Langflow</title>" } }
