schema_version: 1
id: "cortex.community:wp-table-of-contents-plus-fpd"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "WordPress Table of Contents Plus - Full Path Disclosure"
  description: "WordPress Table of Contents Plus plugin is vulnerable to full path disclosure via direct access to plugin files. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://wordpress.org/plugins/table-of-contents-plus/"
  tags: ["wp", "wordpress", "wp-plugin", "fpd", "toc", "exposure", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Low"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/wp-content/plugins/table-of-contents-plus/includes/class.toc.php" }
  - id: "probe1"
    request: { method: "GET", path: "/wp-content/plugins/table-of-contents-plus/admin/class.admin.php" }
  - id: "probe2"
    request: { method: "GET", path: "/wp-content/plugins/table-of-contents-plus/front.php" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - all:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Fatal error" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "table-of-contents-plus" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Uncaught Error:" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - all:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "Fatal error" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "table-of-contents-plus" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "Uncaught Error:" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
      - all:
          - all:
              - contains: { left: { ref: "steps.probe2.body" }, right: { value: "Fatal error" } }
              - contains: { left: { ref: "steps.probe2.body" }, right: { value: "table-of-contents-plus" } }
              - contains: { left: { ref: "steps.probe2.body" }, right: { value: "Uncaught Error:" } }
          - eq: { left: { ref: "steps.probe2.status" }, right: { value: 200 } }
