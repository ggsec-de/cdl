schema_version: 1
id: "cortex.community:nuget-package-config"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "NuGet Package.config File Disclosure"
  description: "Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://learn.microsoft.com/en-us/nuget/reference/packages-config"
    - "https://github.com/maurosoria/dirsearch/blob/master/db/dicc.txt"
  tags: ["exposure", "sass", "devops", "cicd", "nuget", "files", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/packages.config" }
  - id: "probe1"
    request: { method: "GET", path: "/.nuget/packages.config" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - all:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<?xml version=\"1.0\" encoding=\"utf-8\"?>" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<packages>" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "</packages>" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - all:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "<?xml version=\"1.0\" encoding=\"utf-8\"?>" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "<packages>" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "</packages>" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
