schema_version: 1
id: "cortex.community:sidekiq-dashboard"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Sidekiq Dashboard Panel - Detect"
  description: "Sidekiq Dashboard panel was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://sidekiq.org"
    - "https://github.com/mperham/sidekiq"
    - "https://github.com/mperham/sidekiq/wiki/Monitoring"
  cwes: [200]
  tags: ["unauth", "panel", "sidekiq", "contribsys", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Medium"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/sidekiq" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - any:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>Sidekiq</title>" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>Sidekiq Enterprise</title>" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
