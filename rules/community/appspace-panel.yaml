schema_version: 1
id: "cortex.community:appspace-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Appspace Login Panel - Detect"
  description: "Appspace is the workplace experience platform for your whole team that lets you manage it all – from employee communications to your physical office spaces. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.appspace.com/"
  tags: ["appspace", "panel", "detect", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
  - id: "probe1"
    request: { method: "GET", path: "/app/login.aspx" }
  - id: "probe2"
    request: { method: "GET", path: "/signin/#!/login?returnUrl=%2Fapp%2Fdefault.aspx" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - any:
              - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)\\.appspace\\-ui" } }
              - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)appspace\\-logo" } }
              - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)<title>Appspace</title>" } }
              - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)class=\"btnSSOAppspace" } }
              - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)Sign\\ in\\ to\\ Appspace\\ Core" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - any:
              - regex: { left: { ref: "steps.probe1.body" }, right: { value: "(?i)\\.appspace\\-ui" } }
              - regex: { left: { ref: "steps.probe1.body" }, right: { value: "(?i)appspace\\-logo" } }
              - regex: { left: { ref: "steps.probe1.body" }, right: { value: "(?i)<title>Appspace</title>" } }
              - regex: { left: { ref: "steps.probe1.body" }, right: { value: "(?i)class=\"btnSSOAppspace" } }
              - regex: { left: { ref: "steps.probe1.body" }, right: { value: "(?i)Sign\\ in\\ to\\ Appspace\\ Core" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
      - all:
          - any:
              - regex: { left: { ref: "steps.probe2.body" }, right: { value: "(?i)\\.appspace\\-ui" } }
              - regex: { left: { ref: "steps.probe2.body" }, right: { value: "(?i)appspace\\-logo" } }
              - regex: { left: { ref: "steps.probe2.body" }, right: { value: "(?i)<title>Appspace</title>" } }
              - regex: { left: { ref: "steps.probe2.body" }, right: { value: "(?i)class=\"btnSSOAppspace" } }
              - regex: { left: { ref: "steps.probe2.body" }, right: { value: "(?i)Sign\\ in\\ to\\ Appspace\\ Core" } }
          - eq: { left: { ref: "steps.probe2.status" }, right: { value: 200 } }
