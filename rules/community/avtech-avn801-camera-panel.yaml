schema_version: 1
id: "cortex.community:avtech-avn801-camera-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Avtech AVN801 Network Camera Admin Panel - Detect"
  description: "An Avtech AVN801 Network Camera administration panel was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "http://www.avtech.com.tw"
  cwes: [200]
  tags: ["panel", "avtech", "iot", "camera", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "IP Surveillance for Your Life" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "avtech" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "/cgi-bin/guest/Login.cgi?rnd=" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
