schema_version: 1
id: "cortex.community:posthog-rum-detect"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "PostHog Browser RUM - Detect"
  description: "Detects PostHog Product Analytics & RUM (Real User Monitoring) SDK artifacts in HTML responses. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://posthog.com/docs/integrate/client/js"
    - "https://github.com/PostHog/posthog-js"
    - "https://www.npmjs.com/package/posthog-js"
  tags: ["tech", "discovery", "rum", "posthog", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - regex: { left: { ref: "steps.probe0.body" }, right: { value: "window\\.posthog" } }
      - regex: { left: { ref: "steps.probe0.body" }, right: { value: "api_host[\"']?\\s*:\\s*[\"'][^\"']*posthog" } }
      - regex: { left: { ref: "steps.probe0.body" }, right: { value: "posthog\\.init\\s*\\(" } }
