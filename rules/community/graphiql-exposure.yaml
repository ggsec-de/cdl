schema_version: 1
id: "cortex.community:graphiql-exposure"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "GraphiQL - Exposure"
  description: "Detected publicly exposed GraphiQL consoles. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://github.com/graphql/graphiql"
  tags: ["misconfig", "graphql", "graphiql", "exposure", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Low"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/graphiql" }
  - id: "probe1"
    request: { method: "GET", path: "/graphql" }
  - id: "probe2"
    request: { method: "GET", path: "/api/graphql" }
  - id: "probe3"
    request: { method: "GET", path: "/v1/graphql" }
  - id: "probe4"
    request: { method: "GET", path: "/query" }
  - id: "probe5"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - any:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "graphiql.createFetcher" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "id=\"graphiql\"" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "id='graphiql'" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "/graphiql.css" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - any:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "graphiql.createFetcher" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "id=\"graphiql\"" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "id='graphiql'" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "/graphiql.css" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
