schema_version: 1
id: "cortex.community:growatt-shinelink-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Growatt Shinelink - Login Panel"
  description: "Growatt Shinelink is a web-based data logger and monitoring interface for Growatt solar inverters, providing real-time solar energy production data and system configuration. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.ginverter.com/en/product/monitor/shinelink-x.html"
  tags: ["panel", "growatt", "ics", "scada", "solar", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - any:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Growatt Shinelink" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "datalogsta" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "treeapp.htm" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
