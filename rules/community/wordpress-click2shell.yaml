schema_version: 1
id: "cortex.community:wordpress-click2shell"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "WordPress Click2Shell Theme Preview Selector Injection"
  description: "WordPress contains a client-side selector injection in the theme installer preview route. A crafted URL opened by an authenticated administrator can cause WordPress to automatically install and preview an attacker-selected inactive theme from WordPress.org. The issue can be chained with a separate vulnerability in an installed theme to achieve code execution. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://wordpress.org/news/2026/09/wordpress-7-1-1-maintenance-and-security-release/"
    - "https://core.trac.wordpress.org/changeset/63664"
    - "https://pwn.ai/blog/click2shell"
  tags: ["wordpress", "wp", "click2shell", "selector-injection", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "High"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/wp-admin/js/theme.js" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "self.view.collection.once( 'query:success', function() {" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "$( 'div[data-slug=\"' + slug + '\"]' ).trigger( 'click' );" } }
      - not:
          contains: { left: { ref: "steps.probe0.body" }, right: { value: "escapeSelector" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
