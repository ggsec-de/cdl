schema_version: 1
id: "cortex.community:gnu-mailman"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "GNU Mailman Panel - Detect"
  description: "GNU Mailman panel was detected. Panel exposes all public mailing lists on server. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  cwes: [200]
  tags: ["exposure", "mailman", "panel", "gnu", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/mailman/listinfo" }
  - id: "probe1"
    request: { method: "GET", path: "/listinfo" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - all:
              - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)Mailing\\ Lists" } }
              - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)Description" } }
              - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)list" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - all:
              - regex: { left: { ref: "steps.probe1.body" }, right: { value: "(?i)Mailing\\ Lists" } }
              - regex: { left: { ref: "steps.probe1.body" }, right: { value: "(?i)Description" } }
              - regex: { left: { ref: "steps.probe1.body" }, right: { value: "(?i)list" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
