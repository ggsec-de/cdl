schema_version: 1
id: "cortex.community:mailtrain-detect"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Mailtrain - Detect"
  description: "Mailtrain, an open-source self-hosted newsletter application, was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://github.com/Mailtrain-org/mailtrain"
  tags: ["tech", "mailtrain", "newsletter", "marketing", "mail", "detect", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "content=\"Self hosted email newsletter app\"" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "window.mailtrainConfig" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "/client/mailtrain.css" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
