schema_version: 1
id: "cortex.community:pingfederate-login-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "PingFederate - Login Panel"
  description: "PingFederate is an enterprise federation server for single sign-on and identity management. The administrative login panel was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://docs.pingidentity.com/pingfederate/latest/getting_started_with_pingfederate/pf_get_started_w_pf.html"
  tags: ["panel", "pingfederate", "identity", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "/pingfederate/dist/styles.css" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "/pingfederate/dist/index-bundle.js" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
