schema_version: 1
id: "cortex.community:tomcat-snoop-servlet-exposed"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Apache Tomcat - Snoop Servlet Information Disclosure"
  description: "The Snoop servlet is exposed in the Apache Tomcat examples directory. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://vulners.com/nessus/TOMCAT_SNOOP.NASL"
    - "https://nvd.nist.gov/vuln/detail/CVE-2000-0760"
  tags: ["apache", "jakarta", "tomcat", "exposure", "info-leak", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/examples/jsp/snp/snoop.jsp" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Request Information" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Path info" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Server name" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Remote address" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
