schema_version: 1
id: "cortex.community:dir-listing"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Directory listing enabled"
  description: "Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://portswigger.net/kb/issues/00600100_directory-listing"
  cwes: [548]
  tags: ["miscellaneous", "misc", "generic", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - any:
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)Directory\\ listing\\ for\\ " } }
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)Index\\ of\\ /" } }
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)\\[To\\ Parent\\ Directory\\]" } }
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)Directory:\\ /" } }
      - all:
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "\\d{1,2}\\/\\d{1,2}\\/\\d{4}\\s+\\d+:\\d+\\s+[\\sAPM]+(&lt;dir&gt;|\\d+)\\s+<[Aa]\\s+[hH][rR][eE][fF]=\"\\/" } }
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "\\s+-\\s+\\/<\\/(title|h1)>" } }
