schema_version: 1
id: "cortex.community:inductive-automation-ignition-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Inductive Automation Ignition - Gateway Panel"
  description: "Inductive Automation Ignition is a widely-deployed industrial SCADA/HMI platform used in manufacturing, utilities, and process industries. The Ignition Gateway web interface provides access to project management, OPC-UA tag browsing, and system configuration. Exposed gateways may allow unauthenticated access to project lists and system information. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://inductiveautomation.com/ignition/"
    - "https://docs.inductiveautomation.com/docs/8.1/ignition-gateway-interface"
  tags: ["panel", "scada", "hmi", "ics", "ignition", "inductive-automation", "opc-ua", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - any:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>Ignition Gateway</title>" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Inductive Automation" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "/res/perspective/client.js" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
