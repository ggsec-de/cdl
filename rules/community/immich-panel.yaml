schema_version: 1
id: "cortex.community:immich-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Immich Panel - Detect"
  description: "Immich is a self-hosted photo and video backup solution Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://immich.app/"
    - "https://github.com/immich-app/immich"
  tags: ["panel", "immich", "detect", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/auth/login" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - any:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>Login - Immich" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "\"PUBLIC_IMMICH_" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "alt=\"Immich Logo" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Welcome to Immich" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
