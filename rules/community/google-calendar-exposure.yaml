schema_version: 1
id: "cortex.community:google-calendar-exposure"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Google Calendar - Exposure"
  description: "Detected publicly accessible Google Calendar embedded on the target that may expose sensitive information including meeting details, attendee names, event schedules, and internal organizational data. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://support.google.com/calendar/answer/37083"
  tags: ["google", "calendar", "exposure", "misconfig", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Low"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - any:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "calendar.google.com/calendar/embed" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "calendar.google.com/calendar/ical" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "calendar.google.com/calendar/u/0/embed" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "www.googleapis.com/calendar" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - not:
          contains: { left: { ref: "steps.probe0.body" }, right: { value: "reviewable_default_visibility" } }
