schema_version: 1
id: "cortex.community:jolokia-acceslogvalve-rce"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Jolokia write to RCE valve"
  description: "RCE in Jolokia < 1.7.1 using AccesLogValve Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://github.com/laluka/jolokia-exploitation-toolkit"
    - "https://therealcoiffeur.github.io/c11011"
  tags: ["jolokia", "rce", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Critical"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/jolokia/list" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "\"host=localhost,name=AccessLogValve,type=Valve\"" } }
