schema_version: 1
id: "cortex.community:idea-folder-exposure"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Public .idea Folder containing files with sensitive data"
  description: "Searches for .idea Folder by querying the /.idea and a few other files with sensitive data. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  tags: ["phpstorm", "jetbrains", "idea", "exposure", "files", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/.idea/deployment.xml" }
  - id: "probe1"
    request: { method: "GET", path: "/.idea/workspace.xml" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
          - all:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<?xml version=" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<project version" } }
      - all:
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
          - all:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "<?xml version=" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "<project version" } }
