schema_version: 1
id: "cortex.community:blazor-boot"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Blazor Boot File Disclosure"
  description: "Exposed Blazor Boot (a web framework developed by Microsoft) config file. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://github.com/freakyclown/Nuclei_templates/blob/main/blazor_server.yaml"
  tags: ["blazor", "boot", "exposure", "config", "disclosure", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/_framework/blazor.boot.json" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Blazor" } }
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "\"config\":" } }
