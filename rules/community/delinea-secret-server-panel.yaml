schema_version: 1
id: "cortex.community:delinea-secret-server-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Delinea Secret Server - Login Panel"
  description: "Delinea Secret Server, formerly Thycotic Secret Server, is an enterprise privileged access management and password vault platform. The login panel was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://docs.delinea.com/online-help/secret-server/start.htm"
  tags: ["panel", "delinea", "thycotic", "secretserver", "pam", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)Secret\\ Server" } }
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)Secret%20Server%20\\-%20SPA/" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
