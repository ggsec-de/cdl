schema_version: 1
id: "cortex.community:publii-detect"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Publii - Detect"
  description: "Publii is an open-source desktop static-site CMS and publishing application. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://getpublii.com/"
    - "https://github.com/GetPublii/Publii"
  tags: ["tech", "detect", "publii", "cms", "static-site", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<meta name=\"generator\" content=\"Publii Open-Source CMS for Static Site\">" } }
      - regex: { left: { ref: "steps.probe0.body" }, right: { value: "href=[\"'][^\"']*/assets/css/style\\.css\\?v=[a-f0-9]+" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
