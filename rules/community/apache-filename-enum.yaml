schema_version: 1
id: "cortex.community:apache-filename-enum"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Apache Filename Enumeration"
  description: "If the client provides an invalid Accept header, the server will respond with a 406 Not Acceptable error containing a pseudo directory listing. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://hackerone.com/reports/210238"
    - "https://www.acunetix.com/vulnerabilities/web/apache-mod_negotiation-filename-bruteforcing/"
  tags: ["apache", "misconfig", "hackerone", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Low"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request:
      method: "GET"
      path: "/index"
      headers: { "Accept": "fake/value" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 406 } }
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Not Acceptable" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Available variants:" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<address>Apache Server at" } }
