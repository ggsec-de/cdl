schema_version: 1
id: "cortex.community:nextcloud-install"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Nextcloud Exposed Installation"
  description: "Nextcloud installation is exposed. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://docs.nextcloud.com/server/latest/admin_manual/installation/installation_wizard.html"
  tags: ["tech", "nextcloud", "storage", "misconfig", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "High"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<fieldset id=\"adminaccount\"><legend>Create an <strong>admin account</strong></legend>" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<legend><a id=\"showAdvanced\" tabindex=\"0\" href=\"#\">Storage &amp; database" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
