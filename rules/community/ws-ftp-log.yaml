schema_version: 1
id: "cortex.community:ws-ftp-log"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "WS FTP File Disclosure"
  description: "WS_FTP software, which is a popular FTP (File Transfer Protocol) client used for transferring files between a local computer and a remote server has its log file exposed. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  tags: ["exposure", "ftp", "logs", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Low"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/ws_ftp.log" }
  - id: "probe1"
    request: { method: "GET", path: "/WS_FTP.LOG" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - any:
              - regex: { left: { ref: "steps.probe0.body" }, right: { value: "\\d{4}\\.\\d{2}\\.\\d{2} \\d{2}:\\d{2} [A-Z] C:\\\\" } }
              - regex: { left: { ref: "steps.probe0.body" }, right: { value: "\\d{4}\\.\\d{2}\\.\\d{2} \\d{2}:\\d{2} [A-Z] D:\\\\" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - any:
              - regex: { left: { ref: "steps.probe1.body" }, right: { value: "\\d{4}\\.\\d{2}\\.\\d{2} \\d{2}:\\d{2} [A-Z] C:\\\\" } }
              - regex: { left: { ref: "steps.probe1.body" }, right: { value: "\\d{4}\\.\\d{2}\\.\\d{2} \\d{2}:\\d{2} [A-Z] D:\\\\" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
