schema_version: 1
id: "cortex.community:sap-netweaver-portal"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "SAP NetWeaver Portal - Detect"
  description: "SAP NetWeaver Portal login has been detected. Note that NetWeaver has multiple default passwords as listed in the references. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.sap.com/products/technology-platform/netweaver.html"
    - "https://www.cisoplatform.com/profiles/blogs/sap-netweaver-abap-security-configuration-part-2-default"
  cwes: [200]
  tags: ["panel", "sap", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/irj/portal" }
proof:
  kind: "signal.v1"
  assertions:
    contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>SAP&#x20;NetWeaver&#x20;Portal</title>" } }
