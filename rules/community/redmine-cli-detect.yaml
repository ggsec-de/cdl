schema_version: 1
id: "cortex.community:redmine-cli-detect"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Detect Redmine CLI Configuration File"
  description: "A small command-line utility to interact with Redmine - https://pypi.org/project/Redmine-CLI/ Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  tags: ["tech", "redmine", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/.redmine-cli" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "default" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "my_id" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "root_url" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
