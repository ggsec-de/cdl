schema_version: 1
id: "cortex.community:dnt-policy-detect"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "DNT Policy Declaration"
  description: "Detects a Do not Track policy. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.freeprivacypolicy.com/blog/privacy-policy-do-not-track-dnt/"
  tags: ["privacy", "dnt", "detect", "compliance", "policy", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/.well-known/dnt-policy.txt" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Do not track" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Policy" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Compliance" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
