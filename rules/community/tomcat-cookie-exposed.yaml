schema_version: 1
id: "cortex.community:tomcat-cookie-exposed"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Tomcat Cookie Exposed"
  description: "Tomcat Cookie is exposed. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://medium.com/bugbountywriteup/apache-example-servlet-leads-to-61a2720cac20"
  tags: ["misconfig", "apache", "tomcat", "exposure", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Low"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/examples/servlets/servlet/CookieExample" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Cookies Example" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Your browser is sending the following cookies:" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
