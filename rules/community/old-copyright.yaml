schema_version: 1
id: "cortex.community:old-copyright"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Find Pages with Old Copyright Dates"
  description: "Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  tags: ["miscellaneous", "misc", "generic", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - not:
          contains: { left: { ref: "steps.probe0.body" }, right: { value: "2026" } }
      - any:
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "Copyright [1-9]\\d* ?\\-? ?[1-9]?\\d*" } }
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "© [1-9]\\d* ?\\-? ?[1-9]?\\d*" } }
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "&copy; [1-9]\\d* ?\\-? ?[1-9]?\\d*" } }
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "&#169; [1-9]\\d* ?\\-? ?[1-9]?\\d*" } }
