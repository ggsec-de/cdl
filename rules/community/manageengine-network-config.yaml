schema_version: 1
id: "cortex.community:manageengine-network-config"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Zoho ManageEngine Network Configuration Manager Panel - Detect"
  description: "ZOHO ManageEngine Network Configuration Manager was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  cwes: [200]
  tags: ["panel", "zoho", "manageengine", "zohocorp", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/apiclient/ember/Login.jsp" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Network Configuration Manager" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "https://www.manageengine.com" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
