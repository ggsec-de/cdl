schema_version: 1
id: "cortex.community:saleor-dashboard-detect"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Saleor Dashboard - Detect"
  description: "Saleor Dashboard, the administration interface for Saleor commerce, was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://saleor.io/"
    - "https://github.com/saleor/saleor-dashboard"
  tags: ["tech", "saleor", "commerce", "dashboard", "detect", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>Sign in to the Saleor Dashboard</title>" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "window.__SALEOR_CONFIG__" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "id=\"dashboard-app\"" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
