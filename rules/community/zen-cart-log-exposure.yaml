schema_version: 1
id: "cortex.community:zen-cart-log-exposure"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Zen Cart Log File Exposure"
  description: "Detected exposed Zen Cart log files that may contain sensitive information including error messages, file paths, database queries, and customer data. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.zen-cart.com/"
    - "https://docs.zen-cart.com/user/troubleshooting/debug_logs/"
  cwes: [200]
  tags: ["zencart", "exposure", "logs", "ecommerce", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Medium"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/logs/" }
  - id: "probe1"
    request: { method: "GET", path: "/cache/" }
  - id: "probe2"
    request: { method: "GET", path: "/includes/logs/" }
  - id: "probe3"
    request: { method: "GET", path: "/admin/logs/" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - all:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Index of" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "myDEBUG" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - all:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "Index of" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "myDEBUG" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
      - all:
          - all:
              - contains: { left: { ref: "steps.probe2.body" }, right: { value: "Index of" } }
              - contains: { left: { ref: "steps.probe2.body" }, right: { value: "myDEBUG" } }
          - eq: { left: { ref: "steps.probe2.status" }, right: { value: 200 } }
      - all:
          - all:
              - contains: { left: { ref: "steps.probe3.body" }, right: { value: "Index of" } }
              - contains: { left: { ref: "steps.probe3.body" }, right: { value: "myDEBUG" } }
          - eq: { left: { ref: "steps.probe3.status" }, right: { value: 200 } }
