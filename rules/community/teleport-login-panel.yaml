schema_version: 1
id: "cortex.community:teleport-login-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Teleport Login Panel - Detect"
  description: "Detects Teleport web login interface exposed at /web/login and version information from /webapi/ping Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://github.com/gravitational/teleport"
  tags: ["panel", "teleport", "login", "oss", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/webapi/ping" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - regex: { left: { ref: "steps.probe0.body" }, right: { value: "\"server_version\"\\s*:\\s*\"\\d+\\.\\d+\\.\\d+\"" } }
      - regex: { left: { ref: "steps.probe0.body" }, right: { value: "teleport" } }
