schema_version: 1
id: "cortex.community:struts-ognl-console"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Apache Struts - OGNL Console"
  description: "This development console allows the evaluation of OGNL expressions that could lead to Remote Command Execution Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://github.com/PortSwigger/j2ee-scan/blob/master/src/main/java/burp/j2ee/issues/impl/ApacheStrutsWebConsole.java"
  tags: ["apache", "struts", "ognl", "panel", "misconfig", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/struts/webconsole.html?debug=console" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Welcome to the OGNL console!" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
