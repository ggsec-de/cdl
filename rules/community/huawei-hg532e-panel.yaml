schema_version: 1
id: "cortex.community:huawei-hg532e-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Huawei HG532e Router Panel - Detect"
  description: "Huawei HG532e router login panel was detected. After installation, both the default username and default password are user. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://setuprouter.com/router/huawei/hg532e/1194.pdf"
    - "https://www.192-168-1-1-ip.co/router/huawei/hg532e/2186/"
  cwes: [200]
  tags: ["huawei", "panel", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>HG532e</title>" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
