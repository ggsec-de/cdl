schema_version: 1
id: "cortex.community:zap-rest-api-detect"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "ZAP Rest API Server Running"
  description: "Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.zaproxy.org/docs/api/"
  tags: ["zap", "tech", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>ZAP API UI</title>" } }
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Welcome to the OWASP Zed Attack Proxy (ZAP)" } }
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Access-Control-Allow-Headers: ZAP-Header" } }
