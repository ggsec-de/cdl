schema_version: 1
id: "cortex.community:livewire-detect"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Laravel Livewire - Detect"
  description: "Detects the presence of Laravel Livewire, a full-stack framework for Laravel that builds dynamic interfaces. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://livewire.laravel.com/"
  tags: ["tech", "discovery", "livewire", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "wire:id=" } }
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "wire:initial-data=" } }
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "window.livewire_app_url" } }
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "window.livewire_token" } }
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "livewire.js" } }
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "livewire.min.js" } }
