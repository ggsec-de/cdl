schema_version: 1
id: "cortex.community:hp-ilo-serial-key-disclosure"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "HP iLO Serial Key - Detect"
  description: "HP iLO serial key was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://github.com/detectify/ugly-duckling/blob/master/modules/crowdsourced/hp-ilo-serial-key-disclosure.json"
  cwes: [200]
  tags: ["exposure", "config", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Medium"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/xmldata?item=CpqKey" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "LTYPE" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "LNAME" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "KEY" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
