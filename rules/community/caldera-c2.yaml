schema_version: 1
id: "cortex.community:caldera-c2"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Caldera C2 - Detect"
  description: "MITRE Caldera™ is a cyber security platform designed to easily automate adversary emulation, assist manual red-teams, and automate incident response. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://github.com/mitre/caldera"
    - "https://github.com/montysecurity/C2-Tracker/blob/main/tracker.py"
  tags: ["c2", "ir", "osint", "caldera", "panel", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - any:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>Login | CALDERA</title>" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>Magma | Caldera</title>" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
