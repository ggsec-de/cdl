schema_version: 1
id: "cortex.community:cheatsh-detect"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "cheat.sh Instance - Detection"
  description: "Detects exposed cheat.sh instances. cheat.sh is a community-driven cheat sheet service that provides quick command-line reference for programming languages and Unix commands. While designed to be public, self-hosted instances may expose internal documentation. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://github.com/chubin/cheat.sh"
    - "https://cheat.sh/"
  tags: ["tech", "cheatsh", "detection", "devtools", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - any:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "cheat.sh" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "curl cheat.sh" } }
      - any:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: ":firstpage" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "cht.sh" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "/files/style.css" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
