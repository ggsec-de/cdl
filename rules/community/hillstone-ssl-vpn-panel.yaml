schema_version: 1
id: "cortex.community:hillstone-ssl-vpn-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Hillstone Networks SSL VPN - Login Panel"
  description: "Hillstone Networks SSL VPN (SG-6000 series) is an enterprise network security gateway with SSL VPN capabilities. The web login portal is frequently exposed on standard HTTPS ports. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.hillstonenet.com/products/next-generation-firewalls/"
  tags: ["panel", "hillstone", "ssl-vpn", "vpn", "ics", "network", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - any:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Hillstone Networks" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "hillstonenet.com" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "HILLSTONE NETWORKS" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
