schema_version: 1
id: "cortex.community:jaspersoft-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "TIBCO Jaspersoft Login Panel - Detect"
  description: "TIBCO Jaspersoft login panel was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  cwes: [200]
  tags: ["panel", "jaspersoft", "tibco", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/jasperserver/login.html?error=1" }
  - id: "probe1"
    request: { method: "GET", path: "/jasperserver-pro/login.html?error=1" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - any:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "TIBCO Jaspersoft: Login" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Could not login to JasperReports Server" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "About TIBCO JasperReports Server" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - any:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "TIBCO Jaspersoft: Login" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "Could not login to JasperReports Server" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "About TIBCO JasperReports Server" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
