schema_version: 1
id: "cortex.community:3cx-installer"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "3CX Phone System - Installer Page Exposure"
  description: "A 3CX Phone System installer or setup wizard page is publicly accessible. This web-based configuration tool is used for initial PBX setup including admin credential creation, SIP trunk configuration, license activation, and network settings. Exposure of this page allows unauthenticated attackers to reconfigure or take over the phone system. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.3cx.com/docs/manual/install/"
    - "https://www.3cx.com/"
  cwes: [668]
  tags: ["3cx", "voip", "exposure", "misconfig", "installer", "panel", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "High"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - any:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "3CX Configuration Tool" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "3CX Initial Setup" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Welcome to the 3CX Management Console" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
