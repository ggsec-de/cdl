schema_version: 1
id: "cortex.community:totolink-n150rt-password-exposure"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "TOTOLINK N150RT - Password Exposure"
  description: "Detects password exposure vulnerability in TOTOLINK N150RT router where sensitive credentials are exposed in the password.htm page. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://github.com/fizz-is-on-the-way/Iot_vuls/blob/main/N150RT/Information_disclosure_password/imgs/2.png"
  tags: ["totolink", "router", "exposure", "credentials", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "High"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/password.htm" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "orgpassword=" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "orgusername=" } }
      - not:
          contains: { left: { ref: "steps.probe0.body" }, right: { value: "orgpassword=''" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
