schema_version: 1
id: "cortex.community:efak-login-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Eagle For Apache Kakfa Login - Detect"
  description: "EFAK is a visualization and management software that allows one to query, visualize, alert on, and explore their metrics wherever they were stored. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://github.com/smartloli/efak"
    - "https://www.kafka-eagle.org/"
  tags: ["panel", "efak", "login", "detect", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
  - id: "probe1"
    request: { method: "GET", path: "/account/signin?/" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - any:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>Login - EFAK</title>" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Eagle For Apache Kafka" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<h1>EFAK</h1>" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - any:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "<title>Login - EFAK</title>" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "Eagle For Apache Kafka" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "<h1>EFAK</h1>" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
