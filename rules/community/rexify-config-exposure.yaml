schema_version: 1
id: "cortex.community:rexify-config-exposure"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Rexify Configuration - Exposure"
  description: "Rexfile configuration from the Rex/Rexify automation framework was exposed. These files may contain SSH credentials, server hostnames, private key paths, and other sensitive data. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.rexify.org/"
  tags: ["exposure", "config", "rexify", "rex", "devops", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "High"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/Rexfile" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "use Rex" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "task" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "group" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "user" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "password" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "desc" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
