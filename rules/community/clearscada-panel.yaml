schema_version: 1
id: "cortex.community:clearscada-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Schneider Electric ClearSCADA - Panel"
  description: "ClearSCADA (now branded as EcoStruxure Geo SCADA Expert) is a Schneider Electric SCADA platform used in water, oil and gas, and utilities sectors. Exposed instances may provide unauthenticated access to industrial process data and control interfaces. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.se.com/ww/en/work/products/product-launch/scada/"
    - "https://www.se.com/us/en/faqs/FA298792/"
  tags: ["panel", "ics", "scada", "schneider", "clearscada", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - any:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "ClearSCADA Home" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "ClearSCADA" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "/webservices" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
