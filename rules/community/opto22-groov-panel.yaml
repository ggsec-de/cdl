schema_version: 1
id: "cortex.community:opto22-groov-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Opto 22 groov - Panel"
  description: "Opto 22 groov is an IIoT and industrial automation platform providing browser-based HMI and edge computing capabilities. The groov View and groov Admin interfaces allow control of industrial devices and data acquisition systems. Exposed instances may provide unauthenticated access to industrial control panels. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.opto22.com/products/product-container/groov-epic"
    - "https://www.opto22.com/products/product-container/groov-rio"
  tags: ["panel", "ics", "iot", "opto22", "groov", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - any:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Loading - groov View" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "groovVersion" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "groov View" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
