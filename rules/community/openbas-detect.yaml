schema_version: 1
id: "cortex.community:openbas-detect"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "OpenBAS - Detect"
  description: "OpenBAS, now OpenAEV, is an open-source adversarial exposure validation and breach and attack simulation platform. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://docs.openbas.io/"
    - "https://github.com/OpenAEV-Platform/openaev"
  tags: ["tech", "detect", "openbas", "openaev", "bas", "security", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>OpenBAS - Open Breach & Attack Simulation Platform</title>" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "OpenBAS is an open source platform allowing organizations to plan, schedule and conduct adversary simulation campaigns" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
