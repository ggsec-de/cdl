schema_version: 1
id: "cortex.community:jboss-seam-debug-page"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Jboss Seam Debug Page Enabled"
  description: "Jboss Seam Debug Page was exposed. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://github.com/jaeles-project/jaeles-signatures/blob/master/common/jboss-seam-debug-page.yaml"
  tags: ["jboss", "logs", "exposure", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Medium"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/debug.seam" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "SeamDebugPage" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "org.jboss.seam" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
