schema_version: 1
id: "cortex.community:remotely-registration-enabled"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Remotely Registration Enabled"
  description: "Checks if the Remotely self-hosted remote desktop and collaboration web application has its user registration endpoint enabled, potentially allowing anyone to register without invitation. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://github.com/lucent-sea/Remotely"
    - "https://github.com/lucent-sea/Remotely/blob/master/README.md"
  tags: ["remotely", "registration", "exposure", "misconfig", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "High"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/Identity/Account/Register" }
  - id: "probe1"
    request: { method: "GET", path: "/Account/Register" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - all:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Create a new account." } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Remotely" } }
          - not:
              contains: { left: { ref: "steps.probe0.body" }, right: { value: "Registration is disabled." } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - all:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "Create a new account." } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "Remotely" } }
          - not:
              contains: { left: { ref: "steps.probe1.body" }, right: { value: "Registration is disabled." } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
