schema_version: 1
id: "cortex.community:it-tools-detect"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "IT-Tools - Detect"
  description: "IT-Tools is an open-source collection of online utilities for developers and IT professionals. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://it-tools.tech/"
    - "https://github.com/CorentinTh/it-tools"
  tags: ["tech", "it-tools", "detect", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>IT Tools - Handy online tools for developers</title>" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<link rel=\"canonical\" href=\"https://it-tools.tech\"" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
