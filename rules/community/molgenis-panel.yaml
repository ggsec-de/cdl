schema_version: 1
id: "cortex.community:molgenis-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Molgenis Panel - Exposure"
  description: "Molgenis emx2 data platform is a software that provides a web-based interface for managing and analyzing data. It might contain sensitive information without authentication. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://molgenis.org/"
    - "https://github.com/molgenis/molgenis-emx2"
  tags: ["panel", "molgenis", "login", "emx2", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
  - id: "probe1"
    request: { method: "GET", path: "/api" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - any:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "molgenis-" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Welcome to MOLGENIS EMX2 POC" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - any:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "molgenis-" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "Welcome to MOLGENIS EMX2 POC" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
