schema_version: 1
id: "cortex.community:sangfor-iam-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Sangfor Internet Access Management - Login Panel"
  description: "Sangfor Internet Access Management (IAM) is a network access control and web filtering appliance from Sangfor Technologies used for managing internet access policies and user authentication in enterprise environments. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.sangfor.com/en/product/internet-access-management"
  tags: ["panel", "sangfor", "iam", "vpn", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "SANGFOR Internet Access Management" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
