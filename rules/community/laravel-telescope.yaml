schema_version: 1
id: "cortex.community:laravel-telescope"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Laravel Telescope Disclosure"
  description: "Telescope provides insight into the requests coming into your application, exceptions, log entries, database queries, queued jobs, mail, notifications, cache operations, scheduled tasks, variable dumps, and more. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://laravel.com/docs/8.x/telescope"
  tags: ["laravel", "disclosure", "logs", "exposure", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Medium"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/telescope/requests" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>Telescope</title>" } }
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Requests" } }
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Commands" } }
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Schedule" } }
