schema_version: 1
id: "cortex.community:laravel-pulse-unauth"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Laravel Pulse - Unauthenticated Dashboard Access"
  description: "Laravel Pulse monitoring dashboard is accessible without authentication. Pulse displays server performance metrics, slow queries, user activity, cache hit rates, and exception logs that could aid attackers in reconnaissance. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://laravel.com/docs/11.x/pulse#dashboard-authorization"
    - "https://owasp.org/Top10/A01_2021-Broken_Access_Control/"
  cwes: [306]
  tags: ["laravel", "pulse", "monitoring", "misconfig", "unauth", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Medium"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/pulse" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Laravel Pulse" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "livewire" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
