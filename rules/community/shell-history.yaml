schema_version: 1
id: "cortex.community:shell-history"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Shell History"
  description: "Discover history for bash, ksh, sh, and zsh Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  tags: ["misconfig", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Low"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/.bash_history" }
  - id: "probe1"
    request: { method: "GET", path: "/.ksh_history" }
  - id: "probe2"
    request: { method: "GET", path: "/.sh_history" }
  - id: "probe3"
    request: { method: "GET", path: "/.zsh_history" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - any:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "mkdir " } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "chmod " } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "mv " } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "nano " } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "vim " } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "pico " } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "sudo " } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "cd " } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "cp " } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "ps aux" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "ls " } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "logout" } }
          - not:
              any:
                - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<?xml" } }
                - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<env" } }
                - contains: { left: { ref: "steps.probe0.body" }, right: { value: "application/javascript" } }
                - contains: { left: { ref: "steps.probe0.body" }, right: { value: "application/json" } }
                - contains: { left: { ref: "steps.probe0.body" }, right: { value: "application/xml" } }
                - contains: { left: { ref: "steps.probe0.body" }, right: { value: "html>" } }
                - contains: { left: { ref: "steps.probe0.body" }, right: { value: "text/html" } }
                - contains: { left: { ref: "steps.probe0.body" }, right: { value: "image/" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - any:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "mkdir " } }
