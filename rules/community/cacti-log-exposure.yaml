schema_version: 1
id: "cortex.community:cacti-log-exposure"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Cacti Log - Exposure"
  description: "Exposed Cacti log files (cacti.log) were detected. These files contain system statistics, error messages, and potentially sensitive information. They can also be used in log poisoning attacks. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://docs.cacti.net/Cacti-Log.md"
  tags: ["cacti", "log", "exposure", "file", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Medium"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/cacti/log/cacti.log" }
  - id: "probe1"
    request: { method: "GET", path: "/log/cacti.log" }
  - id: "probe2"
    request: { method: "GET", path: "/cacti.log" }
  - id: "probe3"
    request: { method: "GET", path: "/include/cacti.log" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - any:
              - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)SYSTEM STATS: Time:" } }
              - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)POLLER: Poller\\[" } }
              - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)Cacti\\[[0-9]+\\]" } }
              - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)CMDPHP:" } }
          - all:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "SYSTEM STATS" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Method:" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Processes:" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Threads:" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Hosts:" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - any:
              - regex: { left: { ref: "steps.probe1.body" }, right: { value: "(?i)SYSTEM STATS: Time:" } }
              - regex: { left: { ref: "steps.probe1.body" }, right: { value: "(?i)POLLER: Poller\\[" } }
              - regex: { left: { ref: "steps.probe1.body" }, right: { value: "(?i)Cacti\\[[0-9]+\\]" } }
              - regex: { left: { ref: "steps.probe1.body" }, right: { value: "(?i)CMDPHP:" } }
          - all:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "SYSTEM STATS" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "Method:" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "Processes:" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "Threads:" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "Hosts:" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
      - all:
          - any:
              - regex: { left: { ref: "steps.probe2.body" }, right: { value: "(?i)SYSTEM STATS: Time:" } }
              - regex: { left: { ref: "steps.probe2.body" }, right: { value: "(?i)POLLER: Poller\\[" } }
              - regex: { left: { ref: "steps.probe2.body" }, right: { value: "(?i)Cacti\\[[0-9]+\\]" } }
              - regex: { left: { ref: "steps.probe2.body" }, right: { value: "(?i)CMDPHP:" } }
          - all:
              - contains: { left: { ref: "steps.probe2.body" }, right: { value: "SYSTEM STATS" } }
              - contains: { left: { ref: "steps.probe2.body" }, right: { value: "Method:" } }
              - contains: { left: { ref: "steps.probe2.body" }, right: { value: "Processes:" } }
              - contains: { left: { ref: "steps.probe2.body" }, right: { value: "Threads:" } }
              - contains: { left: { ref: "steps.probe2.body" }, right: { value: "Hosts:" } }
          - eq: { left: { ref: "steps.probe2.status" }, right: { value: 200 } }
      - all:
          - any:
              - regex: { left: { ref: "steps.probe3.body" }, right: { value: "(?i)SYSTEM STATS: Time:" } }
              - regex: { left: { ref: "steps.probe3.body" }, right: { value: "(?i)POLLER: Poller\\[" } }
              - regex: { left: { ref: "steps.probe3.body" }, right: { value: "(?i)Cacti\\[[0-9]+\\]" } }
              - regex: { left: { ref: "steps.probe3.body" }, right: { value: "(?i)CMDPHP:" } }
          - all:
              - contains: { left: { ref: "steps.probe3.body" }, right: { value: "SYSTEM STATS" } }
              - contains: { left: { ref: "steps.probe3.body" }, right: { value: "Method:" } }
              - contains: { left: { ref: "steps.probe3.body" }, right: { value: "Processes:" } }
              - contains: { left: { ref: "steps.probe3.body" }, right: { value: "Threads:" } }
              - contains: { left: { ref: "steps.probe3.body" }, right: { value: "Hosts:" } }
          - eq: { left: { ref: "steps.probe3.status" }, right: { value: 200 } }
