schema_version: 1
id: "cortex.community:lucee-unset-credentials"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Lucee - Unset Credentials"
  description: "The Lucee admin panel has a first-time setup page which allows any user to set the administrator password. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://luceeserver.atlassian.net/browse/LDEV-926"
    - "https://www.petefreitag.com/blog/lucee-admin-password-box/"
  cwes: [798]
  tags: ["lucee", "default-login", "unauth", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "High"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/lucee/admin/web.cfm" }
  - id: "probe1"
    request: { method: "GET", path: "/lucee/admin/server.cfm" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - all:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Lucee" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "box\">New Password</div>" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - all:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "Lucee" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "box\">New Password</div>" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
