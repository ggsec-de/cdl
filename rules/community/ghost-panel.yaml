schema_version: 1
id: "cortex.community:ghost-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Ghost Panel - Detect"
  description: "Beautiful, modern publishing with email newsletters and paid subscriptions built-in. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://ghost.org/"
  tags: ["panel", "ghost", "login", "detect", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/ghost/#/signin" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)<title>Ghost\\ Admin" } }
      - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)content=\"Ghost\"" } }
