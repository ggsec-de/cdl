schema_version: 1
id: "cortex.community:jira-detect"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Jira Detect"
  description: "Jira login panel was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  cwes: [200]
  tags: ["tech", "panel", "jira", "atlassian", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/secure/Dashboard.jspa" }
  - id: "probe1"
    request: { method: "GET", path: "/jira/secure/Dashboard.jspa" }
  - id: "probe2"
    request: { method: "GET", path: "/login.jsp" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Project Management Software" } }
      - contains: { left: { ref: "steps.probe1.body" }, right: { value: "Project Management Software" } }
      - contains: { left: { ref: "steps.probe2.body" }, right: { value: "Project Management Software" } }
