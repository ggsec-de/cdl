schema_version: 1
id: "cortex.community:cisco-esa-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Cisco Email Security Appliance - Panel"
  description: "Detected Cisco Email Security Appliance login panel. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  cwes: [200]
  tags: ["login", "cisco", "panel", "email", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/login" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - any:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Email Security Appliance" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Email Security Virtual Appliance" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "IronPort C" } }
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "action:Login" } }
