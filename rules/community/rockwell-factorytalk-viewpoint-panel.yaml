schema_version: 1
id: "cortex.community:rockwell-factorytalk-viewpoint-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Rockwell Automation FactoryTalk ViewPoint - Panel"
  description: "Rockwell Automation FactoryTalk ViewPoint is a web-based HMI that allows remote monitoring and control of industrial automation systems from a browser. It provides access to FactoryTalk View Machine Edition and Site Edition displays. Exposed instances may allow unauthorised access to industrial control system visualisations. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.rockwellautomation.com/en-us/products/software/factorytalk/operationsuite/view/factorytalk-viewpoint.html"
  tags: ["panel", "ics", "scada", "rockwell", "factorytalk", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - any:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "/ftvp/ViewPoint.aspx" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>FTVP</title>" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "/ftvp/Images/favicon.ico" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
