schema_version: 1
id: "cortex.community:prometheus-log"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "http.preserve_raw_path.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Exposed Prometheus"
  description: "Prometheus instance is exposed. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  tags: ["prometheus", "misconfig", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Low"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/prometheus" }
  - id: "probe1"
    request: { method: "GET", path: "/actuator/prometheus" }
  - id: "probe2"
    request: { method: "GET", path: "/actuator/prometheus;%2f..%2f..%2f", path_mode: "preserve_raw" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - any:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "gateway_request_total" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "logback_events_total" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - any:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "gateway_request_total" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "logback_events_total" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
      - all:
          - any:
              - contains: { left: { ref: "steps.probe2.body" }, right: { value: "gateway_request_total" } }
              - contains: { left: { ref: "steps.probe2.body" }, right: { value: "logback_events_total" } }
          - eq: { left: { ref: "steps.probe2.status" }, right: { value: 200 } }
