schema_version: 1
id: "cortex.community:laravel-terminal-exposure"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Laravel Terminal - Exposed"
  description: "The web application was built on the Laravel framework, with Laravel Terminal enabled and publicly accessible; this was detected in the production environment and led to disclosure of sensitive application information. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://github.com/recca0120/laravel-terminal"
    - "https://www.acunetix.com/vulnerabilities/web/laravel-terminal-open/"
  tags: ["laravel", "terminal", "exposure", "misconfig", "rce", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "High"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/asf/terminal" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - any:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Laravel Terminal" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "terminal.endpoint" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
