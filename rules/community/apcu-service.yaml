schema_version: 1
id: "cortex.community:apcu-service"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "APCu service information leakage"
  description: "APCu service is vulnerable to information leakage. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  tags: ["config", "service", "apcu", "misconfig", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Low"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/apc/apc.php" }
  - id: "probe1"
    request: { method: "GET", path: "/apc.php" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - any:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "APCu Version Information" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "General Cache Information" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Detailed Memory Usage and Fragmentation" } }
      - any:
          - contains: { left: { ref: "steps.probe1.body" }, right: { value: "APCu Version Information" } }
          - contains: { left: { ref: "steps.probe1.body" }, right: { value: "General Cache Information" } }
          - contains: { left: { ref: "steps.probe1.body" }, right: { value: "Detailed Memory Usage and Fragmentation" } }
