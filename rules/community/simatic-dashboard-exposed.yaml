schema_version: 1
id: "cortex.community:simatic-dashboard-exposed"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Siemens SIMATIC 300 Dashboard - Exposed"
  description: "An unauthenticated exposed web interface for Siemens SIMATIC S7-300 was discovered, potentially allowing access without any login credentials. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://new.siemens.com"
  tags: ["siemens", "simatic", "plc", "scada", "iot", "misconfig", "unauth", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "High"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/Portal0000.htm" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - regex: { left: { ref: "steps.probe0.body" }, right: { value: "SIMATIC\\s*300" } }
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "alt=\"Simatic S7 CP\"" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
