schema_version: 1
id: "cortex.community:fronius-inverter-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Fronius Inverter - Login Panel"
  description: "Fronius Inverter is the web interface for Fronius GEN24 and Symo series solar inverters, providing real-time monitoring, configuration, and energy management for photovoltaic systems. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.fronius.com/en/solar-energy/private-customers/products-solutions/solar-inverters"
  tags: ["panel", "fronius", "ics", "scada", "solar", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - any:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>Fronius Inverter</title>" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Fronius" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "inverter" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
