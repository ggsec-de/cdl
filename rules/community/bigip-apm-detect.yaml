schema_version: 1
id: "cortex.community:bigip-apm-detect"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "BIGIP APM - Detect"
  description: "Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://my.f5.com/manage/s/article/K000138683"
  tags: ["bigip", "tech", "f5", "detect", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/pre/config.php?version=2.0" }
  - id: "probe1"
    request: { method: "GET", path: "/pre/config.php?version=3.0" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - all:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "F5 Networks" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<PROFILE VERSION=" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<VERSION>" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - all:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "F5 Networks" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "<PROFILE VERSION=" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "<VERSION>" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
