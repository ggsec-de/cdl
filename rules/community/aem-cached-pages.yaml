schema_version: 1
id: "cortex.community:aem-cached-pages"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Invalidate / Flush Cached Pages on AEM"
  description: "Cached Pages on AEM can be Flushed. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://twitter.com/AEMSecurity/status/1244965623689609217"
  tags: ["aem", "misconfig", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Low"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request:
      method: "GET"
      path: "/dispatcher/invalidate.cache"
      headers: { "CQ-Handle": "/content", "CQ-Path": "/content" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<H1>OK</H1>" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
