schema_version: 1
id: "cortex.community:deos-open500ems-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "DEOS OPEN 500EMS Controller - Admin Exposure"
  description: "The DEOS OPEN 500EMS controller exposes administrative functions without authentication. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.deos-ag.com/"
  cwes: [284]
  tags: ["openv500", "disclosure", "panel", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "High"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/cgi-bin/cosmobdf.cgi?function=0" }
  - id: "probe1"
    request: { method: "GET", path: "/cgi-bin/cosmobdf.cgi?function=1" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
          - any:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<b>OPENview</b>" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "/cgi-bin/cosmobdf.cgi?function=12" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "/cgi-bin/cosmobdf.cgi?function=2" } }
      - all:
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
          - any:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "<b>OPENview</b>" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "/cgi-bin/cosmobdf.cgi?function=12" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "/cgi-bin/cosmobdf.cgi?function=2" } }
