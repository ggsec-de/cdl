schema_version: 1
id: "cortex.community:cloud-metadata"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "GCP/AWS Metadata Disclosure"
  description: "GCP/AWS Metadata is exposed. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.facebook.com/ExWareLabs/photos/pcb.5605494709514357/5605493856181109/"
  tags: ["misconfig", "exposure", "devops", "cloud", "aws", "gcp", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Low"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "\"instance_metadata\":" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "\"cloud\":" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
