schema_version: 1
id: "cortex.community:axiom-digitalocean-key-exposure"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "DigitalOcean Key Exposure via Axiom"
  description: "Axiom is a dynamic infrastructure framework to efficiently work with multi-cloud environments. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://github.com/pry0cc/axiom"
  cwes: [425]
  tags: ["axiom", "digitalocean", "key", "exposure", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Critical"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/.axiom/accounts/do.json" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "\"do_key\"" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "\"region\"" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "\"provider\"" } }
