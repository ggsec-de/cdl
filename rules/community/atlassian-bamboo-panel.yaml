schema_version: 1
id: "cortex.community:atlassian-bamboo-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Atlassian Bamboo Login Panel - Detect"
  description: "Atlassian Bamboo login panel was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.atlassian.com/software/bamboo"
  tags: ["panel", "bamboo", "login", "detect", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/userlogin!doDefault.action?os_destination=%2Fstart.action" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - any:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>Log in as a Bamboo user" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "content=\"Bamboo" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "atlassian.bamboo.plugins" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Atlassian Bamboo</a>" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
