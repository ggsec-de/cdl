schema_version: 1
id: "cortex.community:behat-config"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Behat Configuration File - Detect"
  description: "Behat configuration file was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://docs.behat.org/en/v2.5/guides/7.config.html"
  cwes: [200]
  tags: ["exposure", "behat", "devops", "cicd", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Medium"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/behat.yml" }
  - id: "probe1"
    request: { method: "GET", path: "/behat.yml.dist" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - all:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "default:" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "paths:" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "suites:" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - all:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "default:" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "paths:" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "suites:" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
