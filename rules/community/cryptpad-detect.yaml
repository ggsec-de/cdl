schema_version: 1
id: "cortex.community:cryptpad-detect"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "CryptPad - Detect"
  description: "CryptPad is an open-source, end-to-end encrypted collaboration suite. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://cryptpad.org/"
    - "https://github.com/cryptpad/cryptpad"
  tags: ["tech", "cryptpad", "collaboration", "encrypted", "detect", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "data-localization=\"main_title\">CryptPad:" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "data-bootload=\"/customize/template.js\"" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "data-main=\"/common/boot.js" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
