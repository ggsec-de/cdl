schema_version: 1
id: "cortex.community:knime-server-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "KNIME Server / Business Hub WebPortal - Detect"
  description: "KNIME Server (and its successor KNIME Business Hub), a commercial platform from KNIME AG for deploying, executing, and managing data-science and machine learning workflows built in the KNIME Analytics Platform, was detected. An exposed WebPortal login page was identified, including white-labeled/rebranded deployments, via their underlying static asset paths. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.knime.com/knime-software/knime-server"
    - "https://www.knime.com/knime-business-hub"
    - "https://docs.knime.com/latest/business_hub_admin_guide/index.html"
  tags: ["panel", "knime", "ml", "ai", "data-science", "detect", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "webportal/_nuxt/theme/favicon" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "_login/_nuxt" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
