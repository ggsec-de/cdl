schema_version: 1
id: "cortex.community:cacti-guest-access-enabled"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Cacti - Guest User Access Enabled"
  description: "Cacti instance has guest user access enabled, allowing unauthenticated users to access graph_view.php and potentially other resources. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  tags: ["cacti", "misconfig", "unauth", "guest-access", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Medium"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/graph_view.php" }
  - id: "probe1"
    request: { method: "GET", path: "/cacti/graph_view.php" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - any:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Tree Mode" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "List Mode" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Preview Mode" } }
          - not:
              any:
                - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Login to Cacti" } }
                - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Please enter your Cacti" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - any:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "Tree Mode" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "List Mode" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "Preview Mode" } }
          - not:
              any:
                - contains: { left: { ref: "steps.probe1.body" }, right: { value: "Login to Cacti" } }
                - contains: { left: { ref: "steps.probe1.body" }, right: { value: "Please enter your Cacti" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
