schema_version: 1
id: "cortex.community:gocd-cruise-configuration"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "GoCd Cruise Configuration disclosure"
  description: "GoCd Cruise Configuration is exposed. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://attackerkb.com/assessments/9101a539-4c6e-4638-a2ec-12080b7e3b50"
    - "https://blog.sonarsource.com/gocd-pre-auth-pipeline-takeover"
    - "https://twitter.com/wvuuuuuuuuuuuuu/status/1456316586831323140"
  tags: ["go", "gocd", "config", "exposure", "misconfig", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "High"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/go/add-on/business-continuity/api/cruise_config" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "server agentAutoRegisterKey" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "webhookSecret" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "tokenGenerationKey" } }
