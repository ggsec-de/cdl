schema_version: 1
id: "cortex.community:cnvd-2021-15824"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "EmpireCMS 7.5 - Cross-Site Scripting"
  description: "EmpireCMS is vulnerable to a DOM based cross-site scripting attack. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://sourceforge.net/projects/empirecms/"
    - "https://www.bilibili.com/read/cv10441910"
    - "https://vul.wangan.com/a/CNVD-2021-15824"
    - "https://github.com/leadscloud/EmpireCMS/issues/4"
  cwes: [79]
  tags: ["cnvd2021", "cnvd", "empirecms", "xss", "domxss", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "High"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/e/ViewImg/index.html?url=javascript:alert(1)" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "if(Request(\"url\")!=0)" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "href=\\\"\"+Request(\"url\")+\"\\\"" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
