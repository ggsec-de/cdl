schema_version: 1
id: "cortex.community:commax-credentials-disclosure"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "COMMAX Smart Home Ruvie CCTV Bridge DVR - RTSP Credentials Disclosure"
  description: "The COMMAX CCTV Bridge for the DVR service allows an unauthenticated attacker to disclose real time streaming protocol (RTSP) credentials in plain-text. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.zeroscience.mk/en/vulnerabilities/ZSL-2021-5665.php"
  tags: ["commax", "exposure", "camera", "iot", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Critical"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/overview.asp" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "DVR Lists" } }
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "rtsp://" } }
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "login_check.js" } }
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "MAX USER :" } }
