schema_version: 1
id: "cortex.community:oracle-access-management"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Oracle Access Management Login Panel - Detect"
  description: "Oracle Access Management login panel was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.oracle.com/security/identity-management/access-management/"
  tags: ["panel", "oracle", "login", "detect", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/oam/pages/login.jsp" }
  - id: "probe1"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - any:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>Login - Oracle Access Management" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "/oam/pages/images" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "/oam/server/" } }
      - any:
          - contains: { left: { ref: "steps.probe1.body" }, right: { value: "<title>Login - Oracle Access Management" } }
          - contains: { left: { ref: "steps.probe1.body" }, right: { value: "/oam/pages/images" } }
          - contains: { left: { ref: "steps.probe1.body" }, right: { value: "/oam/server/" } }
