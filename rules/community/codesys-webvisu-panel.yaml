schema_version: 1
id: "cortex.community:codesys-webvisu-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "CODESYS WebVisu - Panel"
  description: "CODESYS WebVisu is the web-based HMI (Human-Machine Interface) component of the CODESYS industrial automation runtime. It provides browser-based access to PLC visualizations and industrial control interfaces. Exposed instances may reveal real-time process data and control functions without authentication. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.codesys.com/products/codesys-runtime/web-visualization.html"
  tags: ["panel", "ics", "scada", "codesys", "webvisu", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - any:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "WebVisu Authentication" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "WEBVISU LOGIN" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "4Tredir" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
