schema_version: 1
id: "cortex.community:pnpm-lock"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "PNPM Lock Yaml File Disclosure"
  description: "The pnpm-lock.yaml file is similar to the package-lock.json file used by npm or the yarn.lock file used by Yarn. It serves as a lock file that ensures consistent and reproducible installations of dependencies across different environments. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://pnpm.io/cli/install#tldr"
  tags: ["exposure", "files", "node", "npm", "pnpm", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/pnpm-lock.yaml" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "lockfileVersion:" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "specifiers:" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "packages:" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
