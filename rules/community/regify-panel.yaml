schema_version: 1
id: "cortex.community:regify-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Regify Login Panel - Detect"
  description: "Regify Login Panel was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.regify.com/"
  tags: ["panel", "regify", "login", "detect", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/phpLogin.php" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)regify" } }
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)regibill" } }
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)regify_default\\.css" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
