schema_version: 1
id: "cortex.community:unauthenticated-mongo-express"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Mongo Express - Unauthenticated Access"
  description: "Mongo Express was able to be access with no authentication requirements in place. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.exploit-db.com/ghdb/5684"
  tags: ["mongo", "unauth", "edb", "misconfig", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "High"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
  - id: "probe1"
    request: { method: "GET", path: "/mongo-express/" }
  - id: "probe2"
    request: { method: "GET", path: "/db/admin/system.users" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - any:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>Home - Mongo Express</title>" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>system.users - Mongo Express</title>" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - any:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "<title>Home - Mongo Express</title>" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "<title>system.users - Mongo Express</title>" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
      - all:
          - any:
              - contains: { left: { ref: "steps.probe2.body" }, right: { value: "<title>Home - Mongo Express</title>" } }
              - contains: { left: { ref: "steps.probe2.body" }, right: { value: "<title>system.users - Mongo Express</title>" } }
          - eq: { left: { ref: "steps.probe2.status" }, right: { value: 200 } }
