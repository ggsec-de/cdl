schema_version: 1
id: "cortex.community:jira-serverinfo"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Jira Rest API Server Information"
  description: "Detected Jira REST API serverInfo endpoint is accessible without authentication, exposing sensitive server information including version, build number, server title, base URL, and server time. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://developer.atlassian.com/cloud/jira/platform/rest/v2/api-group-server-info/"
    - "https://support.atlassian.com/jira/kb/restrict-unauthenticated-access-for-some-jira-endpoints/"
  cwes: [200]
  tags: ["jira", "tech", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/rest/api/latest/serverInfo" }
  - id: "probe1"
    request: { method: "GET", path: "/rest/api/2/serverInfo" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - all:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "\"baseUrl\"" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "\"deploymentType\"" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - all:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "\"baseUrl\"" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "\"deploymentType\"" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
