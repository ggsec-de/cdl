schema_version: 1
id: "cortex.community:jolokia-tomcat-creds-leak"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Jolokia <= 1.7.1 Information Leakage"
  description: "Tomcat's credential disclosure leading to Remote Code Execution via WAR upload. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://github.com/laluka/jolokia-exploitation-toolkit/blob/main/exploits/info-leak-tomcat-creds.py"
    - "https://therealcoiffeur.github.io/c11011"
  tags: ["jolokia", "tomcat", "exposure", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Critical"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/jolokia/read/Users:database=UserDatabase,type=UserDatabase" }
  - id: "probe1"
    request: { method: "GET", path: "/actuator/jolokia/read/Users:database=UserDatabase,type=UserDatabase" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
          - all:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "\"mbean\":\"Users:database=UserDatabase,type=UserDatabase\"" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "\"users\":" } }
          - not:
              contains: { left: { ref: "steps.probe0.body" }, right: { value: "\"users\":[]" } }
      - all:
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
          - all:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "\"mbean\":\"Users:database=UserDatabase,type=UserDatabase\"" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "\"users\":" } }
          - not:
              contains: { left: { ref: "steps.probe1.body" }, right: { value: "\"users\":[]" } }
