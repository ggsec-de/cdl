schema_version: 1
id: "cortex.community:ge-proficy-webspace-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "GE Proficy WebSpace - Login Panel"
  description: "GE Proficy WebSpace is a thin-client delivery platform for GE Proficy HMI/SCADA (iFIX, CIMPLICITY) applications over the web. It exposes industrial HMI screens via browser on TCP/491 by default. The Server header \"WebSocket++/0.7.0\" is a unique indicator. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.ge.com/digital/applications/hmi-scada/proficy-webspace"
  tags: ["panel", "scada", "hmi", "ics", "ge", "proficy", "webspace", "ifix", "cimplicity", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - any:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Proficy WebSpace" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "BRAND_NAME_PRODUCT" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "brand.js" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
