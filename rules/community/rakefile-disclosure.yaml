schema_version: 1
id: "cortex.community:rakefile-disclosure"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Rakefile - File Disclosure"
  description: "Rakefile configuration file was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://ruby.github.io/rake/doc/rakefile_rdoc.html"
  tags: ["devops", "exposure", "rakefile", "config", "ruby", "rails", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/Rakefile" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)application\\.load_tasks" } }
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)config/application" } }
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "require" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "desc" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "task :" } }
