schema_version: 1
id: "cortex.community:totemomail-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Totemomail Login Panel - Detect"
  description: "Totemomail login panel was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.totemo.com/en/products/email-encryption"
  cwes: [200]
  tags: ["totemomail", "panel", "totemo", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/responsiveUI/" }
  - id: "probe1"
    request: { method: "GET", path: "/responsiveUI/webmail/folder.xhtml" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - any:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "/responsiveUI/javax.faces.resource/images/totemomail_logo.svg.xhtml" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "/responsiveUI/javax.faces.resource/css/custom.css.xhtml?con=totemo" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>WebMail login: totemomail® WebMail</title>" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - any:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "/responsiveUI/javax.faces.resource/images/totemomail_logo.svg.xhtml" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "/responsiveUI/javax.faces.resource/css/custom.css.xhtml?con=totemo" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "<title>WebMail login: totemomail® WebMail</title>" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
