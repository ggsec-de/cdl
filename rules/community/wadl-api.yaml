schema_version: 1
id: "cortex.community:wadl-api"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "WADL API - Detect"
  description: "WADL API was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://github.com/dwisiswant0/wadl-dumper"
    - "https://www.nopsec.com/leveraging-exposed-wadl-xml-in-burp-suite/"
  cwes: [200]
  tags: ["exposure", "api", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/application.wadl" }
  - id: "probe1"
    request: { method: "GET", path: "/application.wadl?detail=true" }
  - id: "probe2"
    request: { method: "GET", path: "/api/application.wadl" }
  - id: "probe3"
    request: { method: "GET", path: "/api/v1/application.wadl" }
  - id: "probe4"
    request: { method: "GET", path: "/api/v2/application.wadl" }
  - id: "probe5"
    request: { method: "OPTIONS", path: "/" }
  - id: "probe6"
    request: { method: "OPTIONS", path: "/api/v1" }
  - id: "probe7"
    request: { method: "OPTIONS", path: "/api/v2" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - any:
          - any:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "This is simplified WADL with user and core resources only" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "http://jersey.java.net" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "http://wadl.dev.java.net/2009/02" } }
          - any:
