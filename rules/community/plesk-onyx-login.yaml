schema_version: 1
id: "cortex.community:plesk-onyx-login"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Plesk Login Panel - Detect"
  description: "Plesk login panel was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.exploit-db.com/ghdb/6501"
    - "https://www.plesk.com/"
  cwes: [200]
  tags: ["panel", "plesk", "login", "edb", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/login_up.php" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - any:
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)alt=\"Plesk\\ Onyx" } }
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)plesk\\-build" } }
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)plesk\\-revision" } }
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)plesk\\-root" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
