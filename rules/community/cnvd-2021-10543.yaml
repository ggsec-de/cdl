schema_version: 1
id: "cortex.community:cnvd-2021-10543"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "EEA - Information Disclosure"
  description: "EEA is susceptible to information disclosure including the username and password. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.cnvd.org.cn/flaw/show/CNVD-2021-10543"
  cwes: [200]
  tags: ["cnvd", "cnvd2021", "config", "exposure", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "High"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/authenticationserverservlet" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "<username>(.*?)</username>" } }
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "<password>(.*?)</password>" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
