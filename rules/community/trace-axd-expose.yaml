schema_version: 1
id: "cortex.community:trace-axd-expose"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "ASP.NET Trace.AXD - Exposure"
  description: "ASP.NET Trace.AXD information was exposed. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.rapid7.com/db/vulnerabilities/spider-asp-dot-net-trace-axd/"
  tags: ["logs", "asp", "exposure", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Low"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/Trace.axd" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - any:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<td><h1>Application Trace</h1></td>" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>Trace Error</title>" } }
      - not:
          contains: { left: { ref: "steps.probe0.body" }, right: { value: "The current trace settings prevent trace.axd from being viewed" } }
      - any:
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 403 } }
