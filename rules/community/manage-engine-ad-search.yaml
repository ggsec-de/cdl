schema_version: 1
id: "cortex.community:manage-engine-ad-search"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Manage Engine AD Search"
  description: "Manage Engine AD Manager service can be configured to allow anonymous users to browse the AD list remotely. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  tags: ["unauth", "misconfig", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "High"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/ADSearch.cc?methodToCall=search" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "ManageEngine" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Showing Objects Of" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Export as" } }
      - not:
          contains: { left: { ref: "steps.probe0.body" }, right: { value: "This search has been disabled" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
