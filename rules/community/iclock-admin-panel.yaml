schema_version: 1
id: "cortex.community:iclock-admin-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "iClock Automatic Data Master Server Admin Panel - Detect"
  description: "An iClock Automatic Data Master Server Admin login panel was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  cwes: [200]
  tags: ["panel", "iclock", "login", "admin", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/iclock/accounts/login/" }
  - id: "probe1"
    request: { method: "GET", path: "/iclock/accounts/login/?next=/iclock/data/iclock/" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - any:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "\"site-name\">iClock Automatic Data Master Server" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title> | Django site admin</title>" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - any:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "\"site-name\">iClock Automatic Data Master Server" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "<title> | Django site admin</title>" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
