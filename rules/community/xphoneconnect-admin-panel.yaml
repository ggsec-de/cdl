schema_version: 1
id: "cortex.community:xphoneconnect-admin-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "XPhone Connect Admin Interface - Detect"
  description: "Detects the presence of the XPhone Connect admin interface. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.c4b.com/en/xphone-connect/"
  cwes: [200]
  tags: ["panel", "xphone", "login", "detect", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
  - id: "probe1"
    request: { method: "GET", path: "/xphoneconnect/admin/Login.aspx" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - any:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "XPhone Connect server - Logon" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "XPhone Web-Meeting" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - any:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "XPhone Connect server - Logon" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "XPhone Web-Meeting" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
