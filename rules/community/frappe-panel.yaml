schema_version: 1
id: "cortex.community:frappe-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Frappe Panel - Detect"
  description: "Frappe ERPNext Login Panel was discovered. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://frappeframework.com/"
  tags: ["frappe", "login", "web", "erp", "detect", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/login#login" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - any:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<h4>Login to Frappe</h4>" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "frappe.csrf_token" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "frappe.boot" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
