schema_version: 1
id: "cortex.community:pyproject-toml"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "pyproject.toml Configuration - Detect"
  description: "pyproject.toml configuration was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://pip.pypa.io/en/stable/reference/build-system/pyproject-toml/"
  cwes: [200]
  tags: ["exposure", "pyproject", "pip", "devops", "cicd", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/pyproject.toml" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "[tool.black]" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "exclude =" } }
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "[tool.poetry]" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "name =" } }
