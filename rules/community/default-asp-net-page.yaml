schema_version: 1
id: "cortex.community:default-asp-net-page"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "ASP.Net Default Page"
  description: "Detected default ASP.NET application pages including both traditional and modern versions. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  tags: ["tech", "asp", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Home Page - My ASP.NET Application" } }
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "ASP.NET is a free web framework for building great Web sites and Web applications" } }
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "My ASP.NET Application" } }
