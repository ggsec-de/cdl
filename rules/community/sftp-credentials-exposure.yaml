schema_version: 1
id: "cortex.community:sftp-credentials-exposure"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "SFTP Configuration File - Credentials Exposure"
  description: "SFTP configuration file was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://blog.sucuri.net/2012/11/psa-sftpftp-password-exposure-via-sftp-config-json.html"
    - "https://www.acunetix.com/vulnerabilities/web/sftp-ftp-credentials-exposure/"
    - "https://codexns.io/products/sftp_for_sublime/settings"
  cwes: [200]
  tags: ["sftp", "config", "exposure", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "High"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/sftp-config.json" }
  - id: "probe1"
    request: { method: "GET", path: "/ftpsync.settings" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - any:
          - all:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "\"host\":" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "\"user\":" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "\"password\":" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "\"remote_path\":" } }
          - all:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "file_permissions" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "extra_list_connections" } }
      - any:
          - all:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "\"host\":" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "\"user\":" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "\"password\":" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "\"remote_path\":" } }
          - all:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "file_permissions" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "extra_list_connections" } }
