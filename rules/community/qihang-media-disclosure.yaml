schema_version: 1
id: "cortex.community:qihang-media-disclosure"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "QiHang Media Web Digital Signage 3.0.9 - Cleartext Credentials Disclosure"
  description: "QiHang Media Web Digital Signage 3.0.9 suffers from a clear-text credentials disclosure vulnerability that allows an unauthenticated attacker to issue a request to an unprotected directory that hosts an XML file /xml/User/User.xml and obtain administrative login information that allows for a successful authentication bypass attack. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.zeroscience.mk/en/vulnerabilities/ZSL-2020-5579.php"
  cwes: [522]
  tags: ["qihang", "exposure", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "High"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/xml/User/User.xml" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<?xml version" } }
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<Users>" } }
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "account=" } }
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "password=" } }
