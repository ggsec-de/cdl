schema_version: 1
id: "cortex.community:fuxa-scada-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "FUXA - SCADA/HMI Panel"
  description: "FUXA is an open-source web-based SCADA/HMI platform built on Node.js. It supports Modbus, OPC-UA, BACnet, MQTT, and Siemens S7 protocols and is widely self-hosted for small industrial deployments. Instances are frequently exposed to the internet without authentication. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://github.com/frangoteam/FUXA"
  tags: ["panel", "scada", "hmi", "ics", "fuxa", "open-source", "nodejs", "modbus", "opc-ua", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - any:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>FUXA</title>" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "assets/lib/svgeditor" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "FUXA" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
