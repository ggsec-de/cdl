schema_version: 1
id: "cortex.community:hp-laserjet-config"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "HP LaserJet Configuration Exposure"
  description: "HP LaserJet printer web interface exposes sensitive configuration information without authentication.This includes device information, network configuration, SNMP settings, and other sensitive data that could be leveraged for further attacks or network reconnaissance. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://support.hp.com/us-en/document/ish_4629476-1206130-16"
    - "https://h10032.www1.hp.com/ctg/Manual/c03137192.pdf"
    - "https://www.exploit-db.com/ghdb/6459"
  cwes: [200]
  tags: ["hp", "laserjet", "printer", "iot", "config", "exposure", "misconfig", "intrusive", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Medium"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/hp/device/this.LCDispatcher?nav=hp.Config" }
  - id: "probe1"
    request: { method: "GET", path: "/info_configuration.html?tab=Home&menu=DevConfig" }
  - id: "probe2"
    request: { method: "GET", path: "/SSI/info_configuration.htm" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - any:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Configuration Page" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Device Configuration" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "set_config_deviceinfo" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - any:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "Configuration Page" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "Device Configuration" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "set_config_deviceinfo" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
      - all:
          - any:
              - contains: { left: { ref: "steps.probe2.body" }, right: { value: "Configuration Page" } }
              - contains: { left: { ref: "steps.probe2.body" }, right: { value: "Device Configuration" } }
              - contains: { left: { ref: "steps.probe2.body" }, right: { value: "set_config_deviceinfo" } }
          - eq: { left: { ref: "steps.probe2.status" }, right: { value: 200 } }
