schema_version: 1
id: "cortex.community:fooocus-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Fooocus Panel - Detect"
  description: "Fooocus, an open-source, offline Stable Diffusion image-generation UI built on Gradio and focused on simplified prompt-based image generation, was detected by matching its Fooocus-branded page metadata together with the embedded Gradio config, thereby avoiding collisions with other Gradio apps (ComfyUI, text-generation-webui, etc.) that commonly share the same port. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://github.com/lllyasviel/Fooocus"
  tags: ["panel", "fooocus", "ai", "image-generation", "gradio", "detect", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "og:title\" content=\"Fooocus" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "window.gradio_config" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
