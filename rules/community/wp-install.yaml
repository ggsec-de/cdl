schema_version: 1
id: "cortex.community:wp-install"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "WordPress Exposed Installation"
  description: "Wordpress installation files have been detected Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://smaranchand.com.np/2020/04/misconfigured-wordpress-takeover-to-remote-code-execution/"
    - "https://x.com/0xPugal/status/1610315762392268802"
  cwes: [284]
  tags: ["misconfig", "panel", "wordpress", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Critical"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/wp-admin/install.php?step=1" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>WordPress &rsaquo; Installation</title>" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Site Title" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
