schema_version: 1
id: "cortex.community:browserless-debugger"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Exposed Browserless debugger"
  description: "Browserless instance can be used to make web requests. May worth checking /workspace for juicy files. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://docs.browserless.io/docs/docker.html#securing-your-instance"
  tags: ["browserless", "unauth", "debug", "misconfig", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Medium"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - any:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>browserless debugger</title>" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<code>Click the ► button to run your code.</code>" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
