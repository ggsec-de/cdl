schema_version: 1
id: "cortex.community:chronos-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Chronos Panel - Detect"
  description: "Chronos Login Panel was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.asys.fr/chronos"
  tags: ["panel", "chronos", "login", "detect", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/chronos.wsc/asparamlogin.html" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)chronoslogin\\.html" } }
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)urlcli" } }
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)url_portail" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
