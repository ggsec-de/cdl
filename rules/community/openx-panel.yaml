schema_version: 1
id: "cortex.community:openx-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "OpenX/Revive Adserver Login Panel - Detect"
  description: "OpenX login panel was detected. Note that OpenX is now a Revive Adserver. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.revive-adserver.com/download/"
  cwes: [200]
  tags: ["panel", "openx", "revive", "adserver", "login", "revive-adserver", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/www/admin/index.php" }
  - id: "probe1"
    request: { method: "GET", path: "/admin/index.php" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - any:
              - regex: { left: { ref: "steps.probe0.body" }, right: { value: "<title>OpenX</title>" } }
              - regex: { left: { ref: "steps.probe0.body" }, right: { value: "<title>Revive Adserver</title>" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - any:
              - regex: { left: { ref: "steps.probe1.body" }, right: { value: "<title>OpenX</title>" } }
              - regex: { left: { ref: "steps.probe1.body" }, right: { value: "<title>Revive Adserver</title>" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
