schema_version: 1
id: "cortex.community:shopware-detect"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Shopware CMS detect"
  description: "Detects Shopware CMS Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://github.com/shopware/shopware"
    - "https://github.com/shopware/platform"
  tags: ["tech", "shopware", "cms", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/admin" }
  - id: "probe1"
    request: { method: "GET", path: "/backend" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - any:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Realisiert mit Shopware" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Realised with Shopware" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Shopware Administration (c) shopware AG" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>Shopware 5 - Backend (c) shopware AG</title>" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Shopware.Application.start" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - any:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "Realisiert mit Shopware" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "Realised with Shopware" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "Shopware Administration (c) shopware AG" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "<title>Shopware 5 - Backend (c) shopware AG</title>" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "Shopware.Application.start" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
