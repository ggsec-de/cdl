schema_version: 1
id: "cortex.community:appdynamics-rum-detect"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "AppDynamics (Cisco) RUM - Detect"
  description: "Detects AppDynamics (Cisco) End User Monitoring (EUM) artifacts. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://docs.appdynamics.com/appd/24.x/latest/en/end-user-monitoring/browser-monitoring/browser-real-user-monitoring"
  tags: ["tech", "discovery", "rum", "appdynamics", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - any:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "adrum-config" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "adrum-start-time" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "adrumExtUrlHttp" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "adrumExtUrlHttps" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
