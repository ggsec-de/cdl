schema_version: 1
id: "cortex.community:cold-fusion-cfcache-map"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Discover Cold Fusion cfcache.map Files"
  description: "Adobe Cold Fusion cfcache.map file is exposed. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://securiteam.com/windowsntfocus/5bp081f0ac/"
  tags: ["exposure", "coldfusion", "adobe", "files", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Low"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/cfcache.map" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Mapping=" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "SourceTimeStamp=" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
