schema_version: 1
id: "cortex.community:kevinlab-device-detect"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "KevinLAB Devices Detection"
  description: "KevinLab is a venture company specialized in IoT, Big Data, A.I based energy management platform. KevinLAB's BEMS (Building Energy Management System) enables efficient energy management in buildings by collecting and analyzing various information of energy usage and facilities as well as efficiency and indoor environment control. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  tags: ["iot", "kevinlab", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/pages/" }
  - id: "probe1"
    request: { method: "GET", path: "/dashboard/" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - any:
          - all:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>BEMS</title>" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "../http/index.php" } }
          - all:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>HEMS</title>" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "../dashboard/proc.php" } }
      - any:
          - all:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "<title>BEMS</title>" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "../http/index.php" } }
          - all:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "<title>HEMS</title>" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "../dashboard/proc.php" } }
