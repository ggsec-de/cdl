schema_version: 1
id: "cortex.community:nuage-networks-vsp-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Nokia Nuage Networks VSP - Dashboard Panel"
  description: "Nokia Nuage Networks VSP (Virtualized Services Platform) is a software-defined networking platform for enterprise and service provider SDN/NFV deployments. The web dashboard is exposed on ports 8443, 9090, or 11443. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.nokia.com/networks/solutions/nuage-networks-virtualized-services-platform/"
  tags: ["panel", "nuage", "nokia", "vsp", "sdn", "vpn", "network", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - any:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Nuage Networks" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Nuage Network" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
