schema_version: 1
id: "cortex.community:radius-manager-login"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Radius Manager Admininstration Control Panel Login Panel - Detect"
  description: "Radius Manager Administration Control Panel login panel was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.exploit-db.com/ghdb/6790"
  cwes: [200]
  tags: ["panel", "radius", "edb", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
  - id: "probe1"
    request: { method: "GET", path: "/admin.php" }
  - id: "probe2"
    request: { method: "GET", path: "/radiusmanager/user.php" }
  - id: "probe3"
    request: { method: "GET", path: "/user.php" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>Radius Manager - User Control Panel</title>" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - contains: { left: { ref: "steps.probe1.body" }, right: { value: "<title>Radius Manager - User Control Panel</title>" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
      - all:
          - contains: { left: { ref: "steps.probe2.body" }, right: { value: "<title>Radius Manager - User Control Panel</title>" } }
          - eq: { left: { ref: "steps.probe2.status" }, right: { value: 200 } }
      - all:
          - contains: { left: { ref: "steps.probe3.body" }, right: { value: "<title>Radius Manager - User Control Panel</title>" } }
          - eq: { left: { ref: "steps.probe3.status" }, right: { value: 200 } }
