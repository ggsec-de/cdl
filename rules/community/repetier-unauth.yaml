schema_version: 1
id: "cortex.community:repetier-unauth"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Repetier Server Dashboard - Unauthenticated"
  description: "Repetier Server Dashboard has been exposed. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  tags: ["repetier", "dashboard", "unauth", "misconfig", "intrusive", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "High"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/#!/printer/Prusa_I3/print" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Global Settings" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Edit Profile" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Logout" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Clear all Messages" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
