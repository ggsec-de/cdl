schema_version: 1
id: "cortex.community:moinmoin-detect"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "MoinMoin wiki detect"
  description: "Detects MoinMoin Wiki Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://github.com/moinwiki/moin-1.9"
  tags: ["tech", "moin", "moinmoin", "wiki", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - any:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<a href=\"http://moinmo.in/\" title=\"This site uses the MoinMoin Wiki software.\">MoinMoin Powered</a>" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<a href=\"http://moinmo.in/Python\" title=\"MoinMoin is written in Python.\">Python Powered</a>" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
