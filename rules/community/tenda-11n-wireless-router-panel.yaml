schema_version: 1
id: "cortex.community:tenda-11n-wireless-router-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Tenda 11n Wireless Router - Admin Panel"
  description: "The administrative panel for a Tenda Technology 11n Wireless Router was found. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.tendacn.com/products/11n-routers.html"
  cwes: [668]
  tags: ["panel", "tenda", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/login.asp" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>Tenda 11N Wireless Router Login Screen</title>" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
