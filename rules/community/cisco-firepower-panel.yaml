schema_version: 1
id: "cortex.community:cisco-firepower-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Cisco Secure Firewall Management Center - Panel"
  description: "Cisco Secure Firewall Management Center login panel was detected. Secure Firewall Management Center was formerly known as Firepower Management Center. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  cwes: [200]
  tags: ["login", "cisco", "panel", "console", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/ui/login" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Login" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "/img/cisco-icon.svg" } }
      - any:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Cisco Firepower Management Center" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Secure Firewall Management Center" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
