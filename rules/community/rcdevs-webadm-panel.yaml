schema_version: 1
id: "cortex.community:rcdevs-webadm-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "RCDevs WebADM Panel - Detect"
  description: "RCDevs WebADM Login Panel was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.rcdevs.com/solutions/"
  tags: ["panel", "rcdevs", "webadm", "login", "detect", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
  - id: "probe1"
    request: { method: "GET", path: "/webapps/index.php" }
  - id: "probe2"
    request: { method: "GET", path: "/websrvs/index.php" }
  - id: "probe3"
    request: { method: "GET", path: "/admin/login_uid.php" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - all:
              - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)WebADM" } }
              - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)RCDevs\\ Security" } }
              - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)www\\.rcdevs\\.com" } }
          - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
      - all:
          - all:
              - regex: { left: { ref: "steps.probe1.body" }, right: { value: "(?i)WebADM" } }
              - regex: { left: { ref: "steps.probe1.body" }, right: { value: "(?i)RCDevs\\ Security" } }
              - regex: { left: { ref: "steps.probe1.body" }, right: { value: "(?i)www\\.rcdevs\\.com" } }
          - eq: { left: { ref: "steps.probe1.status" }, right: { value: 200 } }
      - all:
          - all:
              - regex: { left: { ref: "steps.probe2.body" }, right: { value: "(?i)WebADM" } }
              - regex: { left: { ref: "steps.probe2.body" }, right: { value: "(?i)RCDevs\\ Security" } }
              - regex: { left: { ref: "steps.probe2.body" }, right: { value: "(?i)www\\.rcdevs\\.com" } }
          - eq: { left: { ref: "steps.probe2.status" }, right: { value: 200 } }
      - all:
          - all:
              - regex: { left: { ref: "steps.probe3.body" }, right: { value: "(?i)WebADM" } }
              - regex: { left: { ref: "steps.probe3.body" }, right: { value: "(?i)RCDevs\\ Security" } }
              - regex: { left: { ref: "steps.probe3.body" }, right: { value: "(?i)www\\.rcdevs\\.com" } }
          - eq: { left: { ref: "steps.probe3.status" }, right: { value: 200 } }
