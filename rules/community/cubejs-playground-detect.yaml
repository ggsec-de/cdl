schema_version: 1
id: "cortex.community:cubejs-playground-detect"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Cube.js Playground - Detect"
  description: "Cube is an open-source semantic layer and analytics platform that includes a web-based development playground. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://github.com/cube-js/cube"
    - "https://cube.dev/"
  tags: ["cubejs", "cube", "analytics", "semantic-layer", "data", "tech", "detect", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>Cube.js Playground</title>" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "id=\"playground-root\"" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "webpackJsonp@cubejs-client/playground" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
