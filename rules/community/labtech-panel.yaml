schema_version: 1
id: "cortex.community:labtech-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "LabTech Web Portal Login Panel - Detect"
  description: "LabTech Web Portal login panel was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  cwes: [200]
  tags: ["panel", "labtech", "labtech_software", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/WCC2/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - any:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<li>LabTech</li>" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<form action=\"/WCC2/Search/search\" id=\"searchForm method=\"post\">" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<h1> Welcome to the LabTech Web Portal</h1>" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Universal Agent Uninstaller" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Technician Login" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<form action=\"/WCC2/Home/Login\" autocomplete=\"off\" method=\"post\">" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
