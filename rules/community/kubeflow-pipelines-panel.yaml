schema_version: 1
id: "cortex.community:kubeflow-pipelines-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "Kubeflow Pipelines Panel - Detect"
  description: "Kubeflow Pipelines is an open-source platform for building and deploying portable, scalable ML workflows. It provides a web UI for managing ML pipelines, experiments, and runs on Kubernetes. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://github.com/kubeflow/pipelines"
    - "https://www.kubeflow.org"
  tags: ["panel", "kubeflow", "kubernetes", "mlops", "ai", "detect", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<title>Kubeflow Pipelines</title>" } }
      - any:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "window.KFP_FLAGS" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "KFP_FLAGS" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
