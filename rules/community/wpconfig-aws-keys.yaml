schema_version: 1
id: "cortex.community:wpconfig-aws-keys"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "AWS S3 keys Leak"
  description: "AWS S3 keys are exposed. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  tags: ["aws", "s3", "wordpress", "disclosure", "exposure", "vuln", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "High"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/wp-config.php-backup" }
  - id: "probe1"
    request: { method: "GET", path: "/%c0" }
proof:
  kind: "signal.v1"
  assertions:
    any:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "access-key-id" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "secret-access-key" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "DB_NAME" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "DB_PASSWORD" } }
      - all:
          - contains: { left: { ref: "steps.probe1.body" }, right: { value: "access-key-id" } }
          - contains: { left: { ref: "steps.probe1.body" }, right: { value: "secret-access-key" } }
          - contains: { left: { ref: "steps.probe1.body" }, right: { value: "DB_NAME" } }
          - contains: { left: { ref: "steps.probe1.body" }, right: { value: "DB_PASSWORD" } }
