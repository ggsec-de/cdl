schema_version: 1
id: "cortex.community:elastic-beanstalk-detect"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "AWS Elastic Beanstalk Detect"
  description: "Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  tags: ["aws", "tech", "beanstalk", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - any:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<li><a href=\"http://docs.aws.amazon.com/elasticbeanstalk/latest/dg/Welcome.html\">AWS Elastic Beanstalk overview</a></li>" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "<li><a href=\"http://docs.amazonwebservices.com/elasticbeanstalk/latest/dg/\">AWS Elastic Beanstalk overview</a></li>" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
