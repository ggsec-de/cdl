schema_version: 1
id: "cortex.community:workspace-one-uem-ssp"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "VMware Workspace ONE UEM Airwatch Self-Service Portal - Detect"
  description: "VMware Workspace ONE UEM Airwatch Self-Service Portal (SSP) login panel was detected. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://docs.vmware.com/en/VMware-Workspace-ONE-UEM/2209/UEM_ConsoleBasics/GUID-AWT-SELFSERVICEPORTALOVERVIEW.html"
  cwes: [200]
  tags: ["panel", "workspaceone", "vmware", "airwatch", "ssp", "login", "detect", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/MyDevice/Login" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)Self\\-Service\\ Portal" } }
      - regex: { left: { ref: "steps.probe0.body" }, right: { value: "(?i)AirWatch" } }
