schema_version: 1
id: "cortex.community:fortirecorder-panel"
rule_version: "1.0.0"
requires:
  engine_api: 1
  capabilities: ["http.standard.v1", "matchers.basic.v1", "proof.signal.v1"]
info:
  name: "FortiRecorder Panel - Detect"
  description: "FortiRecorder Panel was discovered. Auto-ported from a Nuclei template by nuclei2cdl. Certainty is LIKELY: a ported matcher has no baseline/differential proof, so it is a signal, not a confirmed exploit. Review before use."
  references:
    - "https://www.fortinet.com/content/dam/fortinet/assets/data-sheets/FortiRecorder.pdf"
  tags: ["fortinet", "fortirecorder", "login", "panel", "discovery", "nuclei", "auto-ported", "signal"]
  remediation: "See the referenced advisory / template source for remediation."
finding:
  sink_type: "VULNERABLE_COMPONENT"
  impact: "INFORMATION_DISCLOSURE"
  severity: "Info"
  root_cause: "nuclei-ported-signal"
execution: { auth: "anonymous", side_effects: "read_only", transport: "http" }
steps:
  - id: "probe0"
    request: { method: "GET", path: "/admin/" }
proof:
  kind: "signal.v1"
  assertions:
    all:
      - all:
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "FortiRecorder Admin" } }
          - contains: { left: { ref: "steps.probe0.body" }, right: { value: "Log In" } }
      - eq: { left: { ref: "steps.probe0.status" }, right: { value: 200 } }
